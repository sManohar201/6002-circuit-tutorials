<!doctype html>
<html lang="en">
<head>

<title>Math 25 · Solving Circuits with Matrices</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: a chapter map (hub) that opens one part at a time; each part is a rail of single-card steps on graph paper. */
:root {
  --paper: #eaf0f4;
  --grid: rgba(40, 90, 140, 0.08);
  --card: #ffffff;
  --ink: #142238;
  --muted: #56677d;
  --line: #d2dce6;
  --accent: #e39a0b;
  --accent-soft: #fdf1d8;
  --accent-ink: #7a4d00;
  --cool: #2b67a3;
  --cool-soft: #e1ecf7;
  --good: #1d8656;
  --good-soft: #def4e9;
  --bad: #c2412a;
  --bad-soft: #fbe5e0;
  --on-accent: #1b1300;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1520; --grid: rgba(120, 170, 220, 0.07); --card: #16212f; --ink: #e5edf6; --muted: #98a8bc;
    --line: #2a3a4e; --accent: #f3b53c; --accent-soft: #3a2d10; --accent-ink: #f8d68f; --cool: #7db3ea;
    --cool-soft: #15283d; --good: #43c88d; --good-soft: #123426; --bad: #f2735a; --bad-soft: #3d1c16;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1520; --grid: rgba(120, 170, 220, 0.07); --card: #16212f; --ink: #e5edf6; --muted: #98a8bc;
  --line: #2a3a4e; --accent: #f3b53c; --accent-soft: #3a2d10; --accent-ink: #f8d68f; --cool: #7db3ea;
  --cool-soft: #15283d; --good: #43c88d; --good-soft: #123426; --bad: #f2735a; --bad-soft: #3d1c16;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.55;
}
.wrap {
  max-width: 700px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
  display: grid; gap: 16px;
}
header.top { display: grid; gap: 10px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.eyebrow button { font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--cool); background: none; border: 0; padding: 0; cursor: pointer; }
.eyebrow a.book-link { color: var(--cool); text-decoration: none; }
.eyebrow a.book-link:hover, .eyebrow a.book-link:focus-visible { text-decoration: underline; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 6.5vw, 40px); line-height: 1.05; margin: 0; text-wrap: balance; }
.rail { display: flex; gap: 5px; align-items: center; }
.rail button { flex: 1; height: 8px; border-radius: 4px; border: 0; padding: 0; cursor: pointer; background: var(--line); }
.rail button.done { background: var(--accent); opacity: 0.5; }
.rail button.now { background: var(--accent); }
.rail button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.where { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.where b { color: var(--ink); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 20px; display: grid; gap: 16px; min-width: 0; }
.card > * { min-width: 0; }
.card h2 { font-family: var(--display); font-weight: 600; font-size: 24px; line-height: 1.18; margin: 0; text-wrap: balance; }
.card h3 { font-family: var(--display); font-weight: 600; font-size: 19px; margin: 0; }
.card p { margin: 0; max-width: 62ch; }
.card ul, .card ol { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.tag { justify-self: start; font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--line); color: var(--ink); }
.k-predict, .k-play { background: var(--accent-soft); color: var(--accent-ink); }
.k-why, .k-math { background: var(--cool-soft); color: var(--cool); }
.k-bug { background: var(--bad-soft); color: var(--bad); }
.k-whatif, .k-check { background: var(--good-soft); color: var(--good); }
.k-say { background: transparent; color: var(--ink); border: 1px solid var(--ink); }

.mono, code { font-family: var(--mono); font-weight: 700; font-size: 0.92em; }
.eq { font-family: var(--mono); font-weight: 700; font-size: clamp(20px, 5.4vw, 28px); text-align: center; padding: 8px 0; overflow-x: auto; }
.eq .a { color: var(--accent); }
.key { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 10px 10px 0; }
.key b { color: var(--accent-ink); }
.aside { font-size: 15px; color: var(--muted); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.two > * { min-width: 0; }
.tile { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; }
.tile h3 { font-size: 17px; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 16px; }
.tbl th, .tbl td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
.tbl th { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* controls */
.btn { font: inherit; font-size: 16px; padding: 10px 16px; border-radius: 10px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn.ghost { background: transparent; }
.btn.small { font-size: 14px; padding: 6px 12px; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); font-weight: 700; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn:focus-visible, input:focus-visible, textarea:focus-visible, .hit:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.choices { display: grid; gap: 8px; }
.choice { text-align: left; width: 100%; }
.choice.right { border-color: var(--good); background: var(--good-soft); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.q { display: grid; gap: 10px; }
.qq { font-weight: 700; }
.feedback { border-radius: 10px; padding: 12px 14px; font-size: 16px; background: var(--paper); border: 1px solid var(--line); }
.feedback.ok { background: var(--good-soft); border-color: var(--good); }
.feedback.no { background: var(--bad-soft); border-color: var(--bad); }
.num { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.num input { font: inherit; font-family: var(--mono); font-size: 19px; width: 8em; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
textarea { font: inherit; font-size: 17px; width: 100%; min-height: 96px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); resize: vertical; }
select { font: inherit; font-family: var(--mono); font-size: 15px; max-width: 100%; padding: 8px 10px; margin: 4px 0 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.model { border: 2px dashed var(--good); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.model .lbl { font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--good); }
.sort { display: grid; gap: 8px; }
.sort-item { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.sort-item > span { min-width: 0; }
.sort-item.right { border-color: var(--good); background: var(--good-soft); }
.sort-item.wrong { border-color: var(--bad); background: var(--bad-soft); }
.sort-item .why { grid-column: 1 / -1; font-size: 15px; }
@media (max-width: 480px) { .sort-item { grid-template-columns: 1fr; } }

/* sliders + readouts */
.sliders { display: grid; gap: 10px; }
.sl { display: grid; gap: 2px; }
.sl label { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; color: var(--muted); }
.sl output { font-family: var(--mono); font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.sl input[type="range"] { width: 100%; accent-color: var(--accent); }
.readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.readout > div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--paper); min-width: 0; }
.readout span { display: block; font-size: 13px; color: var(--muted); }
.readout b { font-family: var(--mono); font-size: 19px; font-variant-numeric: tabular-nums; }
.verdict { justify-self: start; font-weight: 700; font-size: 15px; padding: 4px 14px; border-radius: 999px; }
.verdict.ok { background: var(--good-soft); color: var(--good); }
.verdict.mid { background: var(--accent-soft); color: var(--accent-ink); }
.verdict.no { background: var(--bad-soft); color: var(--bad); }

/* schematics + plots */
.fig { overflow-x: auto; }
.sch, .plot { width: 100%; height: auto; display: block; margin: 0 auto; }
.sch .w { stroke: var(--ink); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.sch .w.hl { stroke: var(--accent); stroke-width: 3.5; }
.sch .w.dim { stroke: var(--line); }
.sch .el { fill: var(--card); stroke: var(--ink); stroke-width: 2.5; }
.sch .el.hl { stroke: var(--accent); stroke-width: 3.5; }
.sch .nd { fill: var(--ink); }
.sch text { fill: var(--ink); font-family: var(--mono); font-size: 14px; }
.sch text.s { font-size: 12px; }
.sch text.big { font-size: 18px; font-weight: 700; }
.sch .m { fill: var(--muted); }
.sch .a { fill: var(--accent-ink); }
.sch .c { fill: var(--cool); }
.sch .g { fill: var(--good); }
.sch .b { fill: var(--bad); }
.sch .cur { stroke: var(--cool); stroke-width: 2.2; fill: none; }
.sch .curh { fill: var(--cool); }
.sch .flow { stroke: var(--accent); stroke-width: 4; fill: none; stroke-dasharray: 3 13; stroke-linecap: round; animation: flow var(--dur, 1s) linear infinite; }
.sch .zone { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 4; }
.sch .box { fill: var(--paper); stroke: var(--ink); stroke-width: 2.5; }
.sch .hit { cursor: pointer; fill: transparent; stroke: transparent; stroke-width: 18; }
@keyframes flow { to { stroke-dashoffset: -16; } }
.plot .grid { stroke: var(--line); stroke-width: 1; }
.plot .axis { stroke: var(--muted); stroke-width: 1.5; }
.plot text { fill: var(--muted); font-family: var(--mono); font-size: 12px; }
.plot text.lab { fill: var(--ink); font-size: 13px; font-weight: 700; }
.plot .s1 { stroke: var(--accent); stroke-width: 3; fill: none; }
.plot .s2 { stroke: var(--cool); stroke-width: 3; fill: none; }
.plot .s3 { stroke: var(--good); stroke-width: 3; fill: none; }
.plot .s4 { stroke: var(--bad); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.plot .s5 { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 4 4; }
.plot .ar1 { fill: var(--accent); opacity: 0.22; }
.plot .ar2 { fill: var(--cool); opacity: 0.18; }
.plot .ar3 { fill: var(--good); opacity: 0.16; }
.plot .mk { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
.plot .mk2 { fill: var(--cool); stroke: var(--card); stroke-width: 2; }
.plot .mkb { fill: var(--bad); stroke: var(--card); stroke-width: 2; }

/* hub */
.parts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.part-btn { width: 100%; text-align: left; display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.part-btn:hover { border-color: var(--ink); }
.part-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.part-btn > span { min-width: 0; }
.part-n { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-weight: 700; border: 2px solid var(--line); }
.part-btn.done .part-n { background: var(--good); border-color: var(--good); color: var(--card); }
.part-btn.next .part-n { border-color: var(--accent); color: var(--accent-ink); }
.part-t { font-weight: 700; display: block; }
.part-d { font-size: 15px; color: var(--muted); display: block; }
.part-m { font-family: var(--mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
.after { border: 2px solid var(--ink); border-radius: 14px; padding: 16px 18px; display: grid; gap: 8px; background: var(--card); }

nav.bottom { display: flex; justify-content: space-between; gap: 8px; }
nav.bottom .btn { min-width: 120px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
.ov { text-decoration: overline; }
.bits { display: flex; flex-wrap: wrap; gap: 6px; }
.bits .btn { min-width: 44px; font-family: var(--mono); font-weight: 700; }

/* code (HDL and assembly listings) */
pre.code { font-family: var(--mono); font-size: 14px; line-height: 1.5; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 0; overflow-x: auto; white-space: pre; color: var(--ink); }
pre.code .kw { color: var(--accent-ink); font-weight: 700; }
pre.code .cm { color: var(--muted); font-style: italic; }
pre.code .nm { color: var(--cool); }
pre.code .hl { background: var(--accent-soft); border-radius: 4px; }
code { font-family: var(--mono); font-size: .92em; background: var(--paper); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
</style>
</head>

  key: "edc", short: "Boylestad", home: "edc.html", dir: "edc",

  pdfFolder: "electroinc_devices_circuit_theory / ilovepdf_split-range",
  source: "Boylestad & Nashelsky, Electronic Devices and Circuit Theory, 11th edition",

   adds the shared helpers and sets window.BOOK to the book this page belongs to (window.BOOK_KEY). */
(function () {
  const all = window.BOOKS || {};
  Object.values(all).forEach((B) => {
    B.all = () => B.groups.flatMap((g) => g.items);
    B.chapters = () => B.all().filter((c) => typeof c.n === "number");
    B.find = (id) => B.all().find((c) => c.id === id);
    B.pdfName = (c) => B.pdfFile || B.pdfPrefix + c.pdf + ".pdf"; /* one-file books name the whole PDF */
    /* "pp. 26–75" for books whose file names are PDF pages, "pp. 1–54" (printed pages) when a chapter lists `pages`. */
    B.pagesLabel = (c) => (c.pages ? "book pp. " + c.pages : "pp. " + c.pdf).replace("-", "–") + (B.pdfFile && c.pages ? ", PDF pp. " + c.pdf.replace("-", "–") : "");
    B.probsLabel = (c) => (c.probs ? `page ${c.probs} of that PDF${c.probsBook && c.probsBook !== c.probs ? ` (book page ${c.probsBook})` : ""}` : "");
  });
  window.BOOK = all[window.BOOK_KEY] || null;
})();

<script>
/* Progress store shared by the contents page and every chapter page.
   Each chapter's state is { done: {p1: true}, last: {part, step} | null, say: {key: text}, t: ms }.
   It lives in two places:
     - localStorage "course-<id>": instant first paint, and the fallback when nothing else works.
     - the artifact's db, at data/users/<viewer id>/<chapter id>: private to the viewer, follows them
       across browsers and sessions. Only available when the page runs inside the claude.ai viewer. */
window.Progress = (function () {
  const LKEY = (id) => "course-" + id;
  const local = {
    get(id) { try { const v = localStorage.getItem(LKEY(id)); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
    set(id, v) { try { localStorage.setItem(LKEY(id), JSON.stringify(v)); } catch (e) {} },
  };
  const blank = () => ({ done: {}, last: null, say: {}, t: 0 });
  const norm = (s) => Object.assign(blank(), s || {}, { done: Object.assign({}, s && s.done), say: Object.assign({}, s && s.say) });

  /* Combine two copies: parts finished anywhere stay finished; the newer copy wins for position and text. */
  function merge(a, b) {
    a = norm(a); b = norm(b);
    const [old, neu] = a.t >= b.t ? [b, a] : [a, b];
    return { done: Object.assign({}, old.done, neu.done), last: neu.last, say: Object.assign({}, old.say, neu.say), t: neu.t };
  }
  const same = (a, b) => JSON.stringify(norm(a)) === JSON.stringify(norm(b));

  /* ---------- cloud ---------- */
  let status = "local"; // "local" | "cloud"
  const statusFns = [];
  const setStatus = (s) => { status = s; statusFns.forEach((f) => f(s)); };
  const cloud = (async () => {
    try {
      if (!window.claude || !window.claude.use) return null;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return null;
      const uid = await user.id();
      if (!uid) return null;
      const col = db.collection("data/users/" + uid);
      await col.limit(1).get(); // proves the store answers before we claim "saved to your account"
      setStatus("cloud");
      return col;
    } catch (e) { return null; }
  })();

  /* One write in flight per chapter; bursts collapse into the latest state. */
  const pending = {}, busy = {};
  async function flush(id) {
    const col = await cloud;
    if (!col || busy[id] || !pending[id]) return;
    busy[id] = true;
    const body = pending[id]; pending[id] = null;
    try { await col.doc(id).set(body); }
    catch (e) {
      if (e && e.code === "unavailable") { pending[id] = pending[id] || body; setTimeout(() => flush(id), 1500 + Math.random() * 1500); }
      else if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) setStatus("local");
    }
    busy[id] = false;
    if (pending[id]) flush(id);
  }
  const timers = {};
  function push(id, state, delay) {
    pending[id] = JSON.parse(JSON.stringify(norm(state)));
    clearTimeout(timers[id]);
    timers[id] = setTimeout(() => flush(id), delay);
  }

  return {
    /* Synchronous best guess from this browser. */
    load(id) { return norm(local.get(id)); },
    /* Save locally now, to the account shortly after. `delay` batches typing. */
    save(id, state, delay = 400) {
      state.t = Date.now();
      local.set(id, state);

    onStatus(fn) { statusFns.push(fn); fn(status); },

    });
    (o.texts || []).forEach((tx) => { s += `<text class="lab" x="${X(tx.x)}" y="${Y(tx.y)}" text-anchor="${tx.a || "start"}">${tx.s}</text>`; });
    return `<svg class="plot" viewBox="0 0 ${W} ${H}" style="max-width:${W}px" role="img" aria-label="${o.label || "Graph"}">${s}</svg>`;
  }

  /* ---------- UI helpers for widgets ---------- */
  function slider(o, onChange) {
    const wrap = el(`<div class="sl"><label for="${o.id}"><span>${o.label}</span><output></output></label><input type="range" id="${o.id}"></div>`);
    const inp = wrap.querySelector("input"), out = wrap.querySelector("output");
    if (o.log) { inp.min = 0; inp.max = 1000; inp.step = 1; }
    else { inp.min = o.min; inp.max = o.max; inp.step = o.step || (o.max - o.min) / 100; }
    const toT = (v) => (1000 * Math.log(v / o.min)) / Math.log(o.max / o.min);
    const get = () => (o.log ? o.min * Math.pow(o.max / o.min, inp.value / 1000) : +inp.value);
    const show = () => { out.textContent = o.show ? o.show(get()) : fmt(get()); };
    inp.value = o.log ? toT(o.value) : o.value;
    show();
    inp.addEventListener("input", () => { show(); onChange && onChange(get()); });
    return { el: wrap, get, set(v) { inp.value = o.log ? toT(v) : v; show(); onChange && onChange(get()); } };
  }
  function toggle(labels, onPick, start = 0) {
    const r = el(`<div class="row" role="group"></div>`);
    labels.forEach((lab, i) => {
      const b = el(`<button type="button" class="btn small" aria-pressed="${i === start}">${lab}</button>`);
      b.addEventListener("click", () => { r.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); onPick(i); });
      r.appendChild(b);
    });
    return r;
  }
  const readout = (pairs) => `<div class="readout">${pairs.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join("")}</div>`;

  /* ---------- blocks ---------- */
  function mcq(b) {
    const n = el(`<div class="q">${b.q ? `<p class="qq">${b.q}</p>` : ""}${b.fig || ""}<div class="choices"></div><div class="feedback" aria-live="polite" hidden></div></div>`);
    const ch = n.querySelector(".choices"), fb = n.querySelector(".feedback");
    b.opts.forEach(([txt, ok, why]) => {
      const btn = el(`<button type="button" class="btn choice">${txt}</button>`);
      btn.addEventListener("click", () => {
        fb.hidden = false;
        fb.className = "feedback " + (ok ? "ok" : "no");
        fb.innerHTML = (ok ? "<b>Yes.</b> " : "<b>Not this one.</b> ") + (why || "");
        btn.classList.add(ok ? "right" : "wrong");
        if (ok) ch.querySelectorAll("button").forEach((x) => (x.disabled = x !== btn));
      });
      ch.appendChild(btn);
    });
    return n;
  }
  function num(b, id) {
    const n = el(`<div class="q"><p class="qq">${b.q}</p>${b.fig || ""}<form class="num" novalidate><input id="${id}" inputmode="decimal" autocomplete="off" aria-label="Your answer"><span class="mono">${b.unit || ""}</span><button class="btn primary" type="submit">Check</button></form><div class="feedback" aria-live="polite" hidden></div></div>`);
    const fb = n.querySelector(".feedback"), inp = n.querySelector("input");
    let tries = 0;
    n.querySelector("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const v = parseFloat(String(inp.value).replace(",", ".").replace("−", "-"));
      fb.hidden = false;
      if (isNaN(v)) { fb.className = "feedback"; fb.textContent = "Type a number first."; return; }
      const tol = b.tol != null ? b.tol : 0.02;
      const ok = b.a === 0 ? Math.abs(v) < 1e-9 : Math.abs(v - b.a) <= Math.abs(b.a) * tol;
      tries++;
      if (ok) { fb.className = "feedback ok"; fb.innerHTML = "<b>Yes.</b> " + (b.why || ""); }
      else { fb.className = "feedback no"; fb.innerHTML = "<b>Not yet.</b> " + (tries >= 2 && b.hint2 ? b.hint2 : b.hint || "Check your units and signs."); }
    });
    return n;
  }
  /* Say-it-back answers live in the chapter's progress state; start() points this at it. */
  let says = { get: (k) => store.get(k, ""), set: (k, v) => store.set(k, v) };
  function say(b, id, key) {
    const n = el(`<div class="q"><p class="qq">${b.q}</p><textarea id="${id}" placeholder="Type your answer in your own words. Rough is fine."></textarea><div class="row"><button type="button" class="btn primary">Compare with mine</button></div><div class="model" hidden><span class="lbl">One good answer</span><div>${b.model}</div><p class="aside">Did yours get the same core idea? Wording doesn't matter. If you're unsure, paste yours into the chat and ask for feedback.</p></div></div>`);
    const ta = n.querySelector("textarea");
    ta.value = says.get(key);
    ta.addEventListener("input", () => says.set(key, ta.value));
    n.querySelector("button").addEventListener("click", () => { n.querySelector(".model").hidden = false; });
    return n;
  }
  function sort(b) {
    const n = el(`<div class="q">${b.q ? `<p class="qq">${b.q}</p>` : ""}<div class="sort"></div><div class="row"><button type="button" class="btn primary sort-check">Check my sorting</button></div><div class="feedback" aria-live="polite" hidden></div></div>`);
    const box = n.querySelector(".sort"), picks = [];
    b.items.forEach(([label], i) => {
      const it = el(`<div class="sort-item"><span>${label}</span></div>`);
      it.appendChild(toggle(b.bins, (k) => (picks[i] = k), -1));
      it.appendChild(el(`<div class="why" hidden></div>`));
      box.appendChild(it);
    });
    n.querySelector(".sort-check").addEventListener("click", () => {
      let right = 0;
      b.items.forEach(([, bin, why], i) => {
        const it = box.children[i], ok = picks[i] === bin;
        if (ok) right++;
        it.classList.toggle("right", ok); it.classList.toggle("wrong", !ok);
        const w = it.querySelector(".why"); w.hidden = false;
        w.innerHTML = (picks[i] == null ? "<b>Not sorted yet.</b> " : "") + (ok ? "" : `<b>Belongs in “${b.bins[bin]}”.</b> `) + (why || "");
      });
      const fb = n.querySelector(".feedback"); fb.hidden = false;
      fb.className = "feedback " + (right === b.items.length ? "ok" : "no");
      fb.innerHTML = `<b>${right} of ${b.items.length}</b> sorted correctly. ${right === b.items.length ? "" : "Read the notes on the red ones."}`;
    });
    return n;
  }
  function reveal(b) {
    const n = el(`<div class="q"><div class="row"><button type="button" class="btn">${b.label || "Show me"}</button></div><div hidden>${b.html}</div></div>`);
    n.querySelector("button").addEventListener("click", (e) => { n.lastElementChild.hidden = false; e.currentTarget.disabled = true; });
    return n;
  }
  function renderBlock(b, id, key) {
    if (typeof b === "string") return el(`<div>${b}</div>`);
    if (typeof b === "function") { const h = el(`<div class="widget" style="display:grid;gap:12px;min-width:0"></div>`); b(h, id); return h; }
    if (b.t === "mcq") return mcq(b);
    if (b.t === "num") return num(b, id);
    if (b.t === "say") return say(b, id, key);
    if (b.t === "sort") return sort(b);
    if (b.t === "reveal") return reveal(b);
    return el(`<div>${b.html || ""}</div>`);
  }

  /* ---------- subscripts: "v_TH" in any text renders as v<sub>TH</sub> (tspan inside SVG).
     A subscript stops before a letter that starts the next subscripted name, so "g_mR_D" reads g<sub>m</sub>R<sub>D</sub>. ---------- */
  const SUBRE = /([A-Za-zΔβμαθωφτγ′])_([A-Za-z0-9]+?)(?=[A-Za-zΔβμαθωφτγ′]_|[^A-Za-z0-9]|$)/g, SVGNS = "http://www.w3.org/2000/svg";
  function subify(root) {
    if (!root || !document.createTreeWalker) return;
    const w = document.createTreeWalker(root, 4 /* text */), hits = [];
    for (let n = w.nextNode(); n; n = w.nextNode()) {
      const p = n.parentNode;
      if (n.nodeValue.indexOf("_") < 0 || !p || /^(script|style|textarea|sub|tspan|title|code|pre)$/i.test(p.nodeName) || (p.closest && p.closest("pre, code"))) continue;
      SUBRE.lastIndex = 0;
      if (SUBRE.test(n.nodeValue)) hits.push(n);
    }
    hits.forEach((n) => {
      const svg = n.parentNode.namespaceURI === SVGNS, s = n.nodeValue, frag = document.createDocumentFragment();
      let last = 0, m;
      SUBRE.lastIndex = 0;
      while ((m = SUBRE.exec(s))) {
        frag.appendChild(document.createTextNode(s.slice(last, m.index) + m[1]));
        const sub = svg ? document.createElementNS(SVGNS, "tspan") : document.createElement("sub");
        if (svg) { sub.setAttribute("baseline-shift", "sub"); sub.setAttribute("font-size", "75%"); }
        sub.textContent = m[2];
        frag.appendChild(sub);
        last = m.index + m[0].length;
      }
      frag.appendChild(document.createTextNode(s.slice(last)));
      n.parentNode.replaceChild(frag, n);
    });
  }
  function watchSubs(root) {
    subify(root);
    if (!window.MutationObserver) return;
    new MutationObserver((ms) => ms.forEach((m) => m.addedNodes.forEach((a) => subify(a.nodeType === 3 ? a.parentNode : a)))).observe(root, { childList: true, subtree: true });
  }

  /* ---------- app ---------- */
  const KIND = { learn: "Learn", play: "Play", predict: "Predict first", why: "Why?", whatif: "What if…", bug: "Spot the mistake", check: "Quick check", say: "Say it back", math: "Math boost" };

  function start(C) {
    const KEY = "course-" + C.id, P = window.Progress;
    const state = P ? P.load(C.id) : store.get(KEY, { done: {}, last: null, say: {} });
    state.say = state.say || {};
    const save = (delay) => (P ? P.save(C.id, state, delay) : store.set(KEY, state));
    says = {
      get: (k) => (k in state.say ? state.say[k] : store.get(k, "")), // older builds kept answers under their own keys
      set: (k, v) => { state.say[k] = v; save(1500); },
    };
    const root = document.getElementById("app");
    watchSubs(root);
    let view = { part: null, step: 0 };

    /* Book navigation: chapter pages sit in the book's folder, its contents page one level up. */
    const B = window.BOOK;
    const bookLink = () => (B ? `<a class="book-link" href="../${B.home}">← Contents</a> · ` : "");
    /* Where this chapter lives in the real book, so the problems are easy to find afterwards. */
    const U = (B && B.unit) || "Chapter", u = U.toLowerCase();
    /* Cross-book links: a math module lists the chapters that use it; a chapter lists the math modules it needs. */
    const BOOKS = Object.values(window.BOOKS || {});
    function chapterRef(id) {
      for (const K of BOOKS) {
        if (K.key === "math" || !K.find) continue;
        const c = K.find(id);
        if (c && c.file) return `<a href="../${K.dir}/${c.file}" title="${c.title}">${K.short} ${typeof c.n === "number" ? "Ch" : "App"} ${c.n}</a>`;
      }
      return "";
    }
    function mathLinks() {
      const M = window.BOOKS && window.BOOKS.math;
      if (!M || !M.all || (B && B.key === "math")) return "";
      const href = (m) => (m.file.startsWith("../") ? m.file : "../math/" + m.file);
      const list = (key) => M.all().filter((m) => m.file && (m[key] || []).includes(C.id)).map((m) => `<a href="${href(m)}">${m.title}</a>`).join(" · ");
      const need = list("needs"), also = list("also");
      return (need ? `<p class="aside where-book">Math you'll use: ${need}</p>` : "") + (also ? `<p class="aside where-book">Going further (optional): ${also}</p>` : "");
    }
    function whereInBook() {
      const me = B && B.find(C.id);
      if (me && B.noPdf) {
        const used = (me.needs || []).map(chapterRef).filter(Boolean), pairs = (me.also || []).map(chapterRef).filter(Boolean);
        return (used.length ? `<p class="aside where-book">Used in: ${used.join(" · ")}</p>` : "") + (pairs.length ? `<p class="aside where-book">Not in the books, but pairs with: ${pairs.join(" · ")}</p>` : "");
      }
      if (!me || !me.pdf) return mathLinks();
      return `<p class="aside where-book">${B.short}, ${typeof me.n === "number" ? "Chapter" : "Appendix"} ${me.n} · ${B.pagesLabel(me)}${B.pdfFile ? "" : ` · PDF file ending “-${me.pdf}.pdf”`}${me.probs ? ` · problems from ${B.probsLabel(me)}` : ""}</p>` + mathLinks();
    }
    function problemsNote() {
      const me = B && B.find(C.id);
      if (!me || !me.probs) return "";
      return `<div class="key"><b>Your book problems:</b> open <span class="mono">${B.pdfName(me)}</span> and go to ${B.probsLabel(me)}.</div>`;
    }
    const isAppPage = () => { const m = B && B.find(C.id); return !!m && typeof m.n !== "number"; };
    function nextChapter() {
      if (!B) return "";
      const me = B.find(C.id), isApp = !!me && typeof me.n !== "number";
      const list = isApp ? B.all().filter((c) => typeof c.n !== "number" && c.file) : B.chapters(), i = list.findIndex((c) => c.id === C.id), nx = list[i + 1];
      const ans = B.answers && !isApp ? `<p class="aside">The book has short answers to some problems (${B.answers.label}, pages ${B.answers.pdf.replace("-", "–")}). Look only after you've committed to your own answer.</p>` : "";
      if (!nx) return ans + `<p><a href="../${B.home}">← Back to the contents</a></p>`;
      return ans + (nx.file
        ? `<p>Then: <a href="${nx.file}">${isApp ? "Appendix" : U} ${nx.n} · ${nx.title} →</a></p>`
        : `<p>Next up: ${U} ${nx.n} · ${nx.title}. Its tutorial isn't built yet. Ask Claude for it when you're ready.</p>`);
    }

    function hub() {
      view = { part: null, step: 0 };
      const firstOpen = C.parts.findIndex((p) => !state.done[p.id]);
      const node = el(`<div class="wrap">
        <header class="top"><div class="eyebrow">${bookLink()}${C.eyebrow}</div><h1>${C.title}</h1>${whereInBook()}</header>
        <section class="card"><span class="tag">How this ${isAppPage() ? "appendix" : u} works</span>${C.intro}</section>
        <ol class="parts" aria-label="Parts of this ${u}"></ol>
        <section class="after"><h3 style="font-family:var(--display);margin:0">After the last part</h3>${problemsNote()}${C.after}${nextChapter()}</section>
        <p class="aside save-note"></p>
      </div>`);
      if (P) P.onStatus((s) => { const n = node.querySelector(".save-note"); if (n) n.textContent = s === "cloud" ? "Progress saves to your Claude account, so it follows you to any browser." : "Progress saves in this browser only."; });
      const list = node.querySelector(".parts");
      C.parts.forEach((p, i) => {
        const done = !!state.done[p.id];
        const cls = done ? "done" : i === firstOpen ? "next" : "";
        const b = el(`<li><button type="button" class="part-btn ${cls}"><span class="part-n">${done ? "✓" : i + 1}</span><span><span class="part-t">${p.title}</span><span class="part-d">${p.blurb}</span></span><span class="part-m">${p.mins} min</span></button></li>`);
        b.querySelector("button").addEventListener("click", () => openPart(i, state.last && state.last.part === i ? state.last.step : 0));
        list.appendChild(b);
      });
      const sum = el(`<li><button type="button" class="part-btn"><span class="part-n">Σ</span><span><span class="part-t">${U} summary</span><span class="part-d">Every key idea and formula on one page. Keep it open while you do the problems.</span></span><span class="part-m">ref</span></button></li>`);
      sum.querySelector("button").addEventListener("click", summary);
      list.appendChild(sum);
      if (state.last && state.last.part != null && C.parts[state.last.part]) {
        const p = C.parts[state.last.part];
        const cont = el(`<div class="row"><button type="button" class="btn primary">Continue: Part ${state.last.part + 1}, step ${state.last.step + 1}</button><span class="aside">${p.title}</span></div>`);
        cont.querySelector("button").addEventListener("click", () => openPart(state.last.part, state.last.step));
        node.querySelector(".card").after(cont);
      }
      root.replaceChildren(node);
      window.scrollTo(0, 0);
    }

    function summary() {
      view = { part: null, step: 0 };
      const node = el(`<div class="wrap"><header class="top"><div class="eyebrow"><button type="button">← ${C.eyebrow}</button></div><h1>${U} summary</h1></header><section class="card">${C.summary}</section><nav class="bottom"><button type="button" class="btn ghost">← ${U} map</button><span></span></nav></div>`);
      node.querySelectorAll(".eyebrow button, nav .btn").forEach((b) => b.addEventListener("click", hub));
      root.replaceChildren(node);
      window.scrollTo(0, 0);
    }

    function openPart(pi, si0 = 0) {
      const P = C.parts[pi];
      const node = el(`<div class="wrap">
        <header class="top"><div class="eyebrow"><button type="button">← ${C.eyebrow}</button> · Part ${pi + 1} of ${C.parts.length}</div><h1>${P.title}</h1>
        <div class="rail" aria-label="Steps"></div><div class="where"></div></header>
        <main></main>
        <nav class="bottom"><button type="button" class="btn ghost" data-back>← Back</button><button type="button" class="btn primary" data-next>Next →</button></nav></div>`);
      node.querySelector(".eyebrow button").addEventListener("click", hub);
      root.replaceChildren(node);
      const rail = node.querySelector(".rail"), where = node.querySelector(".where"), main = node.querySelector("main");
      const back = node.querySelector("[data-back]"), next = node.querySelector("[data-next]");
      const N = P.steps.length;

      function show(i) {
        i = Math.max(0, Math.min(N, i));
        view = { part: pi, step: i };
        if (i === N) return finish();
        state.last = { part: pi, step: i }; save();
        const st = P.steps[i];
        const card = el(`<section class="card"><span class="tag k-${st.k}">${KIND[st.k] || st.k}</span>${st.title ? `<h2>${st.title}</h2>` : ""}</section>`);
        (st.b || []).forEach((b, j) => card.appendChild(renderBlock(b, `${C.id}-${P.id}-s${i}-b${j}`, `${KEY}-say-${P.id}-${i}-${j}`)));
        main.replaceChildren(card);
        rail.innerHTML = P.steps.map((s, k) => `<button type="button" class="${k < i ? "done" : k === i ? "now" : ""}" aria-label="Step ${k + 1}" ${k === i ? 'aria-current="step"' : ""} data-i="${k}"></button>`).join("");
        rail.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => show(+b.dataset.i)));
        where.innerHTML = `Step <b>${i + 1}</b> of ${N} · ${KIND[st.k] || st.k}`;
        back.disabled = i === 0;
        next.hidden = false;
        next.textContent = i === N - 1 ? "Finish part ✓" : "Next →";
        window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
      }
      function finish() {
        state.done[P.id] = true;
        state.last = pi + 1 < C.parts.length ? { part: pi + 1, step: 0 } : null;
        save();
        const hasNext = pi + 1 < C.parts.length;
        const card = el(`<section class="card"><span class="tag k-check">Part ${pi + 1} complete</span><h2>Your takeaway</h2><div class="key">${P.takeaway}</div>
          <p class="aside">Good moment for a short break. Stand up, drink some water, then come back.</p>
          <div class="row">${hasNext ? `<button type="button" class="btn primary" data-np>Part ${pi + 2}: ${C.parts[pi + 1].title} →</button>` : `<button type="button" class="btn primary" data-sum>Open the ${u} summary</button>`}<button type="button" class="btn ghost" data-hub>Chapter map</button></div></section>`);
        main.replaceChildren(card);
        rail.querySelectorAll("button").forEach((b) => (b.className = "done"));
        where.innerHTML = `<b>Done</b> · ${N} steps`;
        back.disabled = false;
        next.hidden = true;
        card.querySelector("[data-hub]").addEventListener("click", hub);
        if (hasNext) card.querySelector("[data-np]").addEventListener("click", () => openPart(pi + 1, 0));
        else card.querySelector("[data-sum]").addEventListener("click", summary);
        window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
      }
      back.addEventListener("click", () => show(view.step - 1));
      next.addEventListener("click", () => show(view.step + 1));
      show(si0);
    }

    document.addEventListener("keydown", (e) => {
      if (view.part == null) return;
      if (e.target.closest && e.target.closest("input, textarea, select")) return;
      const nb = document.querySelector("[data-next]"), bb = document.querySelector("[data-back]");
      if (e.key === "ArrowRight" && nb && !nb.hidden) nb.click();
      if (e.key === "ArrowLeft" && bb && !bb.disabled) bb.click();
    });

    const m = /^#p(\d+)$/.exec(location.hash || "");
    /* #resume (from the library's Resume card): the saved step, else the first unfinished part, else the map. */
    const L = state.last, todo = C.parts.findIndex((p) => !state.done[p.id]);
    if (m && C.parts[+m[1] - 1]) openPart(+m[1] - 1, 0);
    else if (location.hash === "#resume" && L && C.parts[L.part]) openPart(L.part, L.step);
    else if (location.hash === "#resume" && todo >= 0) openPart(todo, 0);
    else hub();
    if (P) P.sync(C.id, state, () => { if (view.part == null) hub(); });
  }

  return { start, S, plot, slider, toggle, readout, fmt, si, el, reduce, store };
})();
</script>
<script>
(function () {
  const { S, plot, slider, toggle, readout, fmt, si, el } = Course;
  const fig = (svg) => `<div class="fig">${svg}</div>`;
  const cell = (v) => (typeof v === "number" ? fmt(Math.abs(v) < 1e-12 ? 0 : v, 3) : v);
  /* Matrix with brackets; entries may be numbers or HTML. rhs (optional) adds an augmented column after a bar. */
  const M = (rows, rhs) => {
    const n = rows[0].length;
    const cells = rows.map((r, i) => r.map((v) => `<span>${cell(v)}</span>`).join("") + (rhs ? `<span style="border-left:2px solid var(--muted);padding-left:12px">${cell(rhs[i])}</span>` : "")).join("");
    return `<span style="display:inline-grid;grid-template-columns:repeat(${n + (rhs ? 1 : 0)},auto);gap:2px 14px;padding:4px 10px;margin:0 4px;border-left:2px solid currentColor;border-right:2px solid currentColor;border-radius:7px;font-family:var(--mono);text-align:center;vertical-align:middle">${cells}</span>`;
  };
  const V = (xs) => M(xs.map((x) => [x]));
  const hl = (v) => `<b style="color:var(--accent)">${cell(v)}</b>`;
  const steps = (rows) => `<div class="tbl"><table><tr><th>Step</th><th>Result</th></tr>${rows.map(([a, b]) => `<tr><td>${a}</td><td class="mono">${b}</td></tr>`).join("")}</table></div>`;

  /* The three-node example used all module long (values in kΩ, mS, mA, V). */
  const ladder = (o = {}) => S.svg(580, 170,
    S.isrc(70, 95, "2 mA", { side: "left" }) + S.wire([70, 77], [70, 30], [160, 30]) +

  const p1 = {
    id: "p1", title: "Fill in the boxes: G by inspection", mins: 25,
    blurb: "Every resistor drops the same little pattern into the matrix. Add them up and you have the circuit's equations.",
    takeaway: "Number the nodes (ground is 0, not in the matrix). Each resistor of conductance G = 1/R between nodes i and j “stamps” +G on (i, i) and (j, j) and −G on (i, j) and (j, i). A resistor from node i to ground stamps only +G on (i, i). A current source pushing I into node i adds +I to row i of the right-hand side (−I to the node it leaves). The result: diagonal = total conductance touching the node; off-diagonal = minus the conductance joining two nodes. That's KCL for every node at once, and it's exactly how SPICE builds its matrix.",
    steps: [
      { k: "learn", title: "Our circuit for this module", b: [
        fig(ladder({ names: true })),
        `<p>Three nodes plus ground. Conductances in mS: a = 1, b = 1, c = 0.5, d = 1, e = 1. The source pushes 2 mA into node 1.</p>`,
        `<p>You could write KCL at each node by hand. Instead, let each element drop its own pattern into the matrix.</p>`,
      ]},
      { k: "learn", title: "The stamp", b: [
        `<div class="two"><div class="tile"><h3>Resistor between i and j</h3><div class="eq" style="font-size:20px">col i  col j<br>${M([["+G", "−G"], ["−G", "+G"]])}</div><p>rows i and j</p></div><div class="tile"><h3>Resistor from i to ground</h3><div class="eq" style="font-size:20px">+G on (i, i)</div><p>Ground isn't in the matrix, so only one box.</p></div></div>`,
        `<div class="tile"><h3>Current source into node i</h3><p>+I in row i of the right-hand side vector (and −I in the row of the node it pulls from, if that isn't ground).</p></div>`,
        { t: "reveal", label: "Why does a resistor stamp exactly that?", html: `<p>The current leaving node i through the resistor is G(vᵢ − vⱼ) = +G·vᵢ − G·vⱼ. That's row i: +G under column i, −G under column j. The same current enters node j, giving row j: −G·vᵢ + G·vⱼ. The stamp is just KCL for that one element.</p>` },
      ]},
      { k: "play", title: "Stamp it, element by element", b: [
        (host) => {
          const els = [["a: 1k, node 1 to ground", [[0, 0, 1]], null], ["b: 1k, between 1 and 2", [[0, 0, 1], [1, 1, 1], [0, 1, -1], [1, 0, -1]], null], ["c: 2k, node 2 to ground", [[1, 1, 0.5]], null], ["d: 1k, between 2 and 3", [[1, 1, 1], [2, 2, 1], [1, 2, -1], [2, 1, -1]], null], ["e: 1k, node 3 to ground", [[2, 2, 1]], null], ["source: 2 mA into node 1", [], [0, 2]]];

            box.innerHTML = `${M(G.map((r, i) => r.map((v, j) => (last.has(i + "," + j) ? hl(v) : v))))}${V(["v₁", "v₂", "v₃"])} = ${V(I.map((v, i) => (last.has("rhs" + i) ? hl(v) : v)))}`;

        `<div class="eq">${M([[2, -1, 0], [-1, 2.5, -1], [0, -1, 2]])}</div>`,
        `<ul><li><b>Diagonal:</b> everything touching that node. Node 2 sees 1 + 0.5 + 1 = 2.5 mS.</li><li><b>Off-diagonal:</b> −(conductance joining the two nodes). A 0 means “no resistor between these nodes”.</li><li><b>Symmetric:</b> every stamp is symmetric.</li><li><b>Row sums:</b> each row adds up to that node's conductance to ground. Row 2: −1 + 2.5 − 1 = 0.5 ✓.</li></ul>`,

      ]},
      { k: "say", title: "Say it back", b: [
        { t: "say", q: "Describe how to build a circuit's G matrix by inspection.", model: "Number the nodes, leave ground out. For each resistor, add its conductance to the diagonal entry of each node it touches, and if it joins two nodes, put minus its conductance in the two off-diagonal spots for that pair. Current sources go into the right-hand side vector of the node they push into." },
      ]},
    ],

  const p2 = {
    id: "p2", title: "Gaussian elimination", mins: 25,
    blurb: "Clear the numbers below the diagonal, then solve from the bottom up. The method every simulator uses.",
    takeaway: "Forward elimination: use row 1 to make zeros below it in column 1 (subtract a multiple m = entry/pivot of row 1 from each row below), then row 2 for column 2, and so on, until the matrix is upper-triangular. Do the same operations to the right-hand side. Back substitution: the last row has one unknown; solve it, then work upwards. For our ladder: v₃ = 1/3 V, v₂ = 2/3 V, v₁ = 4/3 V. Cost for a dense n×n matrix: about n³/3 multiplications. A zero pivot means swap rows (pivoting); a zero row means a singular matrix.",
    steps: [
      { k: "learn", title: "The idea", b: [
        `<p>A triangular system is easy: the last equation has one unknown, the one above it has two (but you already know one), and so on. <b>Elimination turns any system into a triangular one</b> using a single allowed move:</p>`,
        `<div class="key"><b>Subtract a multiple of one row from another.</b> (Including its right-hand side.) This doesn't change the solution: you're just combining true equations into another true equation.</div>`,
      ]},
      { k: "play", title: "Step through it", b: [
        (host) => {
          const S0 = [[[2, -1, 0], [-1, 2.5, -1], [0, -1, 2]], [2, 0, 0]];
          const ops = [
            ["Start: G | i", S0[0], S0[1], ""],
            ["Row 2 ← Row 2 − (−1/2)·Row 1", [[2, -1, 0], [0, 2, -1], [0, -1, 2]], [2, 1, 0], "The multiplier is (entry to kill)/(pivot) = −1/2. Column 1 below the pivot is now clear."],
            ["Row 3 ← Row 3 − (−1/2)·Row 2", [[2, -1, 0], [0, 2, -1], [0, 0, 1.5]], [2, 1, 0.5], "Pivot is now the 2 in row 2. Multiplier −1/2 again. The matrix is upper-triangular."],
            ["Back substitution: row 3", [[2, -1, 0], [0, 2, -1], [0, 0, 1.5]], [2, 1, 0.5], "1.5·v₃ = 0.5, so v₃ = 1/3 V."],
            ["Back substitution: row 2", [[2, -1, 0], [0, 2, -1], [0, 0, 1.5]], [2, 1, 0.5], "2v₂ − v₃ = 1, so v₂ = (1 + 1/3)/2 = 2/3 V."],
            ["Back substitution: row 1", [[2, -1, 0], [0, 2, -1], [0, 0, 1.5]], [2, 1, 0.5], "2v₁ − v₂ = 2, so v₁ = (2 + 2/3)/2 = 4/3 V. Done."],
          ];
          const box = el(`<div class="eq"></div>`), msg = el(`<p></p>`), row = el(`<div class="row"></div>`);
          const nb = el(`<button type="button" class="btn primary">Next operation</button>`), rb = el(`<button type="button" class="btn ghost">Start again</button>`);
          let k = 0;
          function draw() {
            const [t, A, b, why] = ops[k];
            box.innerHTML = M(A, b);
            msg.innerHTML = `<b>${t}.</b> ${why}`;
            nb.disabled = k === ops.length - 1;
          }
          nb.addEventListener("click", () => { k = Math.min(ops.length - 1, k + 1); draw(); });
          rb.addEventListener("click", () => { k = 0; draw(); });
          row.append(nb, rb);
          host.append(box, msg, row);
          draw();
        },
      ]},
      { k: "why", title: "Check it like an engineer", b: [
        fig(ladder()),
        `<p>v₁ = 4/3, v₂ = 2/3, v₃ = 1/3 V. Does KCL hold at node 2?</p>`,
        { t: "reveal", label: "Check", html: `<p>In from node 1: (4/3 − 2/3)/1k = 2/3 mA. Out to ground: (2/3)/2k = 1/3 mA. Out to node 3: (2/3 − 1/3)/1k = 1/3 mA. In = out ✓.</p><p class="aside">Also notice: node 3 sits on a 1k–1k divider from node 2, so v₃ = v₂/2. The matrix knew that without being told.</p>` },
      ]},
      { k: "learn", title: "Pivots and what can go wrong", b: [
        `<ul><li>The <b>pivot</b> is the diagonal entry you divide by at each stage.</li><li>A <b>zero pivot</b> (or a tiny one) means trouble. Fix: swap in a lower row with a bigger entry in that column. This is <b>pivoting</b>, and every real solver does it.</li><li>If a whole row turns into zeros, the matrix is <b>singular</b> (det = 0, Module 24): a floating node, or a loop of voltage sources.</li></ul>`,
        `<p class="aside">Cost: clearing column 1 touches about n² numbers, column 2 about (n − 1)², …, which adds to about n³/3 multiplications for a dense matrix.</p>`,
      ]},
      { k: "check", title: "Your turn", b: [
        { t: "num", q: "Eliminate: Row 2 = (4, 5 | 6) with pivot row Row 1 = (2, 1 | 3). Multiplier?", a: 2, why: "4/2 = 2. New row 2 = (4, 5 | 6) − 2·(2, 1 | 3) = (0, 3 | 0)." },
        { t: "num", q: "So the system 2x + y = 3, 4x + 5y = 6 has y = ?", a: 0, why: "After elimination, 3y = 0, so y = 0, then 2x = 3 gives x = 1.5." },
        { t: "num", q: "Dense elimination on 1000 unknowns: about how many multiplications? Give the number in millions.", a: 333, unit: "million", tol: 0.05, why: "n³/3 = 10⁹/3 ≈ 333 million. Fine for a laptop. For a million unknowns it would be 3×10¹⁷: hopeless without the trick in Part 3." },
      ]},
      { k: "say", title: "Say it back", b: [
        { t: "say", q: "Why is it allowed to subtract a multiple of one equation from another?", model: "Both equations are true for the solution, so any combination of them is also true for the solution. Subtracting a multiple just makes a new true equation with one fewer unknown in it, without changing what the answer is." },
      ]},
    ],
  };

  const p3 = {
    id: "p3", title: "LU and sparsity: how simulators go fast", mins: 20,
    blurb: "Record the elimination once and reuse it. And chip matrices are almost all zeros.",
    takeaway: "Elimination can be stored as G = L·U: U is the triangular result, L holds the multipliers. Factoring costs the n³/3; after that, each new right-hand side costs only about n² (two triangular sweeps). That's why a simulator can sweep sources or step through time cheaply when G doesn't change. Circuit matrices are sparse: each node touches only a few others, so almost every entry is 0. Sparse solvers store and work only on the non-zeros, which makes million-node chip simulations possible. Node ordering matters, because elimination can create new non-zeros (“fill-in”).",
    steps: [
      { k: "learn", title: "Record the recipe", b: [
        `<p>The elimination of Part 2 used two multipliers, both −1/2. Store them in a lower-triangular L; the result is U:</p>`,
        `<div class="eq">${M([[2, -1, 0], [-1, 2.5, -1], [0, -1, 2]])} = ${M([[1, 0, 0], [-0.5, 1, 0], [0, -0.5, 1]])}${M([[2, -1, 0], [0, 2, -1], [0, 0, 1.5]])}</div>`,
        `<p class="aside">G = L·U. Multiply it out to check row 2: −0.5·(2, −1, 0) + (0, 2, −1) = (−1, 2.5, −1) ✓.</p>`,
      ]},
      { k: "why", title: "Why bother?", b: [
        `<p>To solve G·v = i with the factors: first solve L·y = i (top down), then U·v = y (bottom up). Each sweep is about n²/2 work.</p>`,
        `<div class="two"><div class="tile"><h3>Factor once</h3><p>~n³/3. Paid when G changes.</p></div><div class="tile"><h3>Solve many</h3><p>~n² per right-hand side. A DC sweep of a current source, or a transient where the step stays fixed, reuses the same L and U.</p></div></div>`,
      ]},
      { k: "play", title: "How empty is a circuit matrix?", b: [
        (host, id) => {
          const f = el(`<div class="fig"></div>`), ro = el(`<div></div>`);
          let n = 20, extra = 0;
          function draw() {
            /* a ladder (tridiagonal) plus a few long-range links */
            const nz = new Set();
            for (let i = 0; i < n; i++) { nz.add(i + "," + i); if (i + 1 < n) { nz.add(i + "," + (i + 1)); nz.add(i + 1 + "," + i); } }
            for (let k = 0; k < extra; k++) { const a = (k * 7) % n, b = (k * 13 + 5) % n; if (a !== b) { nz.add(a + "," + b); nz.add(b + "," + a); } }
            const c = Math.min(14, 300 / n);
            let s = `<rect x="0" y="0" width="${n * c}" height="${n * c}" style="fill:none;stroke:var(--line)"/>`;
            nz.forEach((key) => { const [i, j] = key.split(",").map(Number); s += `<rect x="${j * c + 0.5}" y="${i * c + 0.5}" width="${c - 1}" height="${c - 1}" style="fill:${i === j ? "var(--accent)" : "var(--cool)"}"/>`; });
            f.innerHTML = S.svg(n * c, n * c, s, { label: "Pattern of non-zero entries in the matrix", max: 320 });
            ro.innerHTML = readout([["Entries", fmt(n * n, 4)], ["Non-zero", `${nz.size} (${fmt((100 * nz.size) / (n * n), 2)}%)`], ["At 1 million nodes, a ladder would be", "0.0003% non-zero"]]);
          }
          host.append(f, slider({ id: id + "-n", label: "Nodes in a ladder circuit", min: 5, max: 40, step: 1, value: n }, (v) => { n = v; draw(); }).el,
            slider({ id: id + "-x", label: "Extra cross-links", min: 0, max: 10, step: 1, value: extra }, (v) => { extra = v; draw(); }).el, ro);
          draw();
        },
        `<p class="aside">Each coloured square is a non-zero entry; everything else is 0. A real chip node connects to a handful of neighbours, so the matrix looks like this: a thin band plus scattered dots.</p>`,
      ]},
      { k: "learn", title: "Sparse solvers and fill-in", b: [
        `<ul><li>A sparse solver stores only the non-zeros and skips arithmetic on zeros. For circuit matrices the work grows roughly in proportion to n, not n³.</li><li><b>Fill-in:</b> eliminating a node can create new non-zeros (a new “connection” between its neighbours). Solvers reorder the nodes first to keep fill-in small.</li></ul>`,
        { t: "reveal", label: "See fill-in happen", html: `<p>A star: node 1 in the middle, joined to nodes 2, 3 and 4, which aren't joined to each other. Eliminate node 1 first and every pair of 2, 3, 4 gets a new non-zero entry: the matrix fills in. Eliminate 2, 3 and 4 first and node 1 last, and no new entries appear. Same answer, much less work.</p>` },
      ]},
      { k: "check", title: "Your turn", b: [
        { t: "mcq", q: "A simulator runs a transient with a fixed time step, and the circuit is linear. Why is each step cheap after the first?", opts: [["G stays the same, so L and U are reused; only a new right-hand side is solved", true, "Factor once, solve many."], ["Because the voltages don't change much", false, "Even if they changed a lot, the cost would be the same."], ["Because it skips elimination entirely", false, "It skips re-factoring, not solving."]] },
        { t: "mcq", q: "In a ladder circuit with 10 000 nodes, roughly what fraction of G is non-zero?", opts: [["About 0.03%", true, "≈ 3n non-zeros out of n²: 3/10 000."], ["About 3%", false, "That's 3/100: the fraction for a 100-node ladder."], ["About half", false, "Each row has at most 3 non-zeros."]] },
      ]},
      { k: "say", title: "Say it back", b: [
        { t: "say", q: "Why can a simulator handle a matrix with a million rows?", model: "Because a circuit matrix is sparse: each node only connects to a few others, so nearly every entry is zero. A sparse solver stores and works on just the non-zeros, reorders nodes to keep fill-in small, and factors once to reuse the factors. The work grows roughly with the number of nodes instead of its cube." },
      ]},
    ],
  };

  const p4 = {
    id: "p4", title: "Voltage sources: Modified Nodal Analysis", mins: 25,
    blurb: "A voltage source has no conductance to stamp. Give its current a name and add one equation.",
    takeaway: "An ideal voltage source can't be stamped as a conductance (it would be infinite). Modified Nodal Analysis (MNA) adds its current i_V as an extra unknown and its law vᵢ − vⱼ = V as an extra equation. Stamp: +1 in row i and −1 in row j of the new column (i_V leaves node i into the source's + terminal); +1, −1 in the new row under columns i and j; V on the right. The new diagonal entry is 0, so solvers must pivot. A negative i_V means current comes out of the + terminal: the source is delivering power.",
    steps: [
      { k: "why", title: "The problem", b: [
        `<p>A resistor says i = G·Δv. A voltage source says Δv = V, whatever the current. There's no G to stamp: you'd need G = ∞.</p>`,

      ]},
      { k: "learn", title: "A worked MNA system", b: [
        fig(S.svg(420, 160, S.vsrc(50, 90, "5 V", { side: "left" }) + S.wire([50, 72], [50, 30], [130, 30]) + S.res(130, 30, 290, 30, "1k", {}) + S.res(290, 30, 290, 140, "1k", {}) + S.wire([50, 108], [50, 140], [290, 140]) + S.dot(130, 30) + S.dot(290, 30) + S.t(130, 18, "1", { cls: "lab" }) + S.t(300, 18, "2", { a: "start", cls: "lab" }) + S.gnd(170, 140) + S.arrow(72, 38, 72, 64, "i_V", { lx: 80, ly: 54, a: "start" }), { label: "A 5 V source at node 1, 1k from node 1 to node 2, 1k from node 2 to ground" })),
        `<p>Unknowns: v₁, v₂ and i<sub>V</sub> (taken as flowing from node 1 into the source's + terminal). Units mS, V, mA.</p>`,

        `<p class="aside">Highlighted: the source's stamp. Rows 1–2 are KCL (with i<sub>V</sub> leaving node 1). Row 3 is the source's own law, v₁ = 5.</p>`,

      ]},
      { k: "why", title: "The zero on the diagonal", b: [
        `<p>Entry (3, 3) is 0. Plain elimination would divide by it at the last stage, or earlier if the source were numbered first. That's why MNA solvers always pivot (swap rows).</p>`,
        `<div class="key"><b>Chip-design echo.</b> Two ideal voltage sources in parallel, or a loop made only of voltage sources and inductors, make the MNA matrix singular. SPICE reports a “voltage source loop”: the same det = 0 idea as the floating node.</div>`,
      ]},
      { k: "play", title: "Try it", b: [
        (host, id) => {
          const ro = el(`<div></div>`);
          let Vs = 5, R1 = 1, R2 = 1;
          function draw() {
            const G1 = 1 / R1, G2 = 1 / R2, v1 = Vs, v2 = (G1 * v1) / (G1 + G2), iV = -G1 * (v1 - v2);
            ro.innerHTML = readout([["MNA matrix", M([[G1, -G1, 1], [-G1, G1 + G2, 0], [1, 0, 0]])], ["v₁, v₂", `${fmt(v1, 3)} V, ${fmt(v2, 3)} V`], ["i_V", fmt(iV, 3) + " mA"], ["Source power delivered", fmt(-iV * Vs, 3) + " mW"]]);
          }
          host.append(slider({ id: id + "-v", label: "V", min: -10, max: 10, step: 0.5, value: Vs, show: (v) => fmt(v, 3) + " V" }, (v) => { Vs = v; draw(); }).el,
            slider({ id: id + "-1", label: "R between 1 and 2", min: 0.1, max: 10, step: 0.1, value: R1, show: (v) => fmt(v, 3) + " kΩ" }, (v) => { R1 = v; draw(); }).el,
            slider({ id: id + "-2", label: "R from 2 to ground", min: 0.1, max: 10, step: 0.1, value: R2, show: (v) => fmt(v, 3) + " kΩ" }, (v) => { R2 = v; draw(); }).el, ro);
          draw();
        },
        `<p class="aside">Whatever the sign of V, i<sub>V</sub> has the opposite sign: a source driving resistors always delivers power.</p>`,
      ]},
      { k: "check", title: "Your turn", b: [
        { t: "mcq", q: "How many unknowns does MNA have for a circuit with 6 non-ground nodes and 2 voltage sources?", opts: [["8", true, "6 node voltages + 2 source currents."], ["6", false, "Each voltage source adds its current as an unknown."], ["4", false, "Sources add unknowns; they don't remove them."]] },
        { t: "num", q: "A 3 V source drives a single 1.5 kΩ resistor to ground. MNA's i_V (mA, with i_V flowing into the + terminal)?", a: -2, unit: "mA", why: "2 mA flows out of the + terminal through the resistor, so i_V = −2 mA." },
      ]},
      { k: "say", title: "Say it back", b: [
        { t: "say", q: "How does Modified Nodal Analysis handle a voltage source?", model: "It can't be written as a conductance, so its current becomes an extra unknown, and its defining law, the voltage difference across it equals V, becomes an extra equation. The source's current appears in the KCL rows of the two nodes it touches." },
      ]},
    ],
  };

  const p5 = {
    id: "p5", title: "Transistors in the matrix", mins: 25,
    blurb: "A small-signal MOSFET is a controlled current source. Its stamp breaks the symmetry, which is what makes amplifiers one-way.",
    takeaway: "A voltage-controlled current source (VCCS) i = g_m(v_c+ − v_c−) flowing from node a to node b stamps +g_m at (a, c+), −g_m at (a, c−), −g_m at (b, c+), +g_m at (b, c−). It sits off the diagonal on one side only, so G is no longer symmetric: the gate controls the drain, but the drain doesn't control the gate. Lost symmetry = lost reciprocity = gain. Small-signal analysis of any transistor circuit is just MNA with g_m and r_o stamps; that's what SPICE's AC analysis does.",
    steps: [
      { k: "learn", title: "The small-signal MOSFET as a stamp", b: [
        `<p>From 6.002 Chapter 8: the small-signal MOSFET (source grounded) is a current g<sub>m</sub>v<sub>gs</sub> flowing from drain to source, plus r<sub>o</sub> from drain to source.</p>`,
        `<div class="two"><div class="tile"><h3>VCCS: g<sub>m</sub>·v<sub>c</sub> leaving node a</h3><p>Row a: +g<sub>m</sub> under the control node's column.<br>Row b: −g<sub>m</sub> there (if b isn't ground).</p></div><div class="tile"><h3>Why only one side?</h3><p>The current depends on v<sub>c</sub>, so the entry goes in <b>column c</b>, <b>row a</b>. Nothing puts a matching entry in row c, column a.</p></div></div>`,
      ]},
      { k: "math", title: "An amplifier with feedback", b: [
        fig(S.svg(560, 215, S.vsrc(70, 130, "v_in", { side: "left" }) + S.wire([70, 112], [70, 80], [110, 80]) + S.res(110, 80, 210, 80, "R_S", {}) + S.wire([210, 80], [250, 80]) + S.dot(250, 80) + S.t(240, 100, "g", { cls: "lab" }) +
          S.wire([250, 80], [250, 40], [300, 40]) + S.res(300, 40, 420, 40, "R_F", {}) + S.wire([420, 40], [460, 40], [460, 80]) + S.dot(460, 80) + S.t(472, 84, "d", { a: "start", cls: "lab" }) +
          S.wire([460, 80], [380, 80], [380, 108]) + S.dep(380, 130, "g_m·v_g", { down: true, side: "left" }) + S.wire([380, 152], [380, 190]) + S.res(460, 80, 460, 190, "R_D", {}) + S.wire([70, 148], [70, 190], [460, 190]) + S.gnd(300, 190), { label: "Small-signal amplifier: source through R_S into gate node g; R_F from g to drain node d; dependent current g_m times v_g from d to ground; R_D from d to ground" })),
        `<p class="aside">The gate draws no current, so node g only has R<sub>S</sub> and R<sub>F</sub> attached.</p>`,
        `<p>Node g: (v<sub>g</sub> − v<sub>in</sub>)G<sub>S</sub> + (v<sub>g</sub> − v<sub>d</sub>)G<sub>F</sub> = 0. Node d: (v<sub>d</sub> − v<sub>g</sub>)G<sub>F</sub> + G<sub>D</sub>v<sub>d</sub> + g<sub>m</sub>v<sub>g</sub> = 0.</p>`,
        `<div class="eq">${M([["G_S+G_F", "−G_F"], [hl("g_m") + "−G_F", "G_F+G_D"]])}${V(["v_g", "v_d"])} = ${V(["G_S·v_in", "0"])}</div>`,
        `<p class="aside">The g<sub>m</sub> sits in row d, column g: the drain current depends on the gate voltage. The matrix is no longer symmetric.</p>`,
      ]},
      { k: "math", title: "Numbers", b: [
        `<p>R<sub>S</sub> = 10 kΩ, R<sub>F</sub> = 100 kΩ, R<sub>D</sub> = 10 kΩ, g<sub>m</sub> = 1 mS, v<sub>in</sub> = 1 (small-signal units). In mS:</p>`,
        `<div class="eq">${M([[0.11, -0.01], [0.99, 0.11]])}${V(["v_g", "v_d"])} = ${V([0.1, 0])}</div>`,
        { t: "reveal", label: "det", html: `<div class="eq">0.11·0.11 − (−0.01)(0.99) = 0.0121 + 0.0099 = 0.022</div>` },
        { t: "reveal", label: "Solve (Cramer, or the 2×2 inverse)", html: `<div class="eq">v_g = 0.1·0.11/0.022 = 0.5     v_d = −0.99·0.1/0.022 = −4.5</div><p>Gain v<sub>d</sub>/v<sub>in</sub> = <b>−4.5</b>. Check KCL at d: −4.5/10k − 5/100k + 1m·0.5 = −0.45 − 0.05 + 0.5 = 0 mA ✓.</p>` },
      ]},
      { k: "play", title: "Turn up g_m", b: [
        (host, id) => {
          const ro = el(`<div></div>`);
          let gm = 1, RF = 100;
          const GS = 0.1, GD = 0.1;
          function draw() {
            const GF = 1 / RF, a = GS + GF, b = -GF, c = gm - GF, d = GF + GD, D = a * d - b * c;
            const vg = (GS * d) / D, vd = (-c * GS) / D;
            ro.innerHTML = readout([["Matrix (mS)", M([[a, b], [c, d]])], ["Gain v_d/v_in", fmt(vd, 3)], ["Ideal-op-amp limit −R_F/R_S", fmt(-RF / 10, 3)], ["v_g (the “virtual ground” gets closer to 0)", fmt(vg, 3)]]);
          }
          host.append(slider({ id: id + "-g", label: "g_m", min: 0.1, max: 100, log: true, value: gm, show: (v) => fmt(v, 3) + " mS" }, (v) => { gm = v; draw(); }).el,
            slider({ id: id + "-f", label: "R_F", min: 20, max: 500, step: 10, value: RF, show: (v) => fmt(v, 3) + " kΩ" }, (v) => { RF = v; draw(); }).el, ro);
          draw();
        },
        `<p class="aside">As g<sub>m</sub> grows, the gain heads for −R<sub>F</sub>/R<sub>S</sub> and the gate voltage heads for 0: the inverting op-amp result, now derived from the matrix. Feedback (Module 37) explains why.</p>`,
      ]},
      { k: "why", title: "Symmetry, reciprocity and gain", b: [
        `<p>Module 24 showed a resistor network's G is symmetric, so “push here, measure there” = “push there, measure here”. A passive network can't amplify.</p>`,
        `<div class="key"><b>Gain needs broken symmetry.</b> The g<sub>m</sub> stamp is one-sided: the input steers the output, but the output barely steers the input. Every amplifier, from one transistor to a whole op amp, shows up in the matrix as a lopsided pair of off-diagonal entries.</div>`,
      ]},
      { k: "check", title: "Your turn", b: [
        { t: "mcq", q: "Common-source stage, no feedback: input node g driven directly, drain node d with R_D and r_o to ground. The KCL row for d is (G_D + g_o)v_d + g_m v_g = 0. Gain v_d/v_g?", opts: [["−g_m(R_D ∥ r_o)", true, "v_d = −g_m v_g/(G_D + g_o), and 1/(G_D + g_o) = R_D ∥ r_o."], ["+g_m R_D", false, "The current flows out of the drain node, so the sign is negative."], ["−g_m(R_D + r_o)", false, "Conductances add, so resistances combine in parallel."]] },
        { t: "num", q: "With g_m = 2 mS, R_D = 20 kΩ, r_o = 20 kΩ: gain magnitude?", a: 20, why: "R_D ∥ r_o = 10 kΩ; 2 mS × 10 kΩ = 20." },
      ]},
      { k: "say", title: "Say it back", b: [
        { t: "say", q: "Why does a transistor make the circuit matrix non-symmetric, and why does that matter?", model: "The transistor's current source depends on the gate voltage but feeds the drain node, so its entry sits in the drain row under the gate column with nothing matching in the gate row. That lost symmetry means the circuit is no longer reciprocal: signals go one way more than the other, which is exactly what lets it amplify." },
      ]},
    ],
  };

  const p6 = {
    id: "p6", title: "Master it", mins: 30,
    blurb: "Build, eliminate, interpret. Paper first.",
    takeaway: "You can build G and MNA matrices by inspection, solve them by elimination, explain LU reuse and sparsity, stamp a transistor, and read singular-matrix errors. That's how a simulator sees your schematic.",
    steps: [
      { k: "check", title: "Problem 1: build and solve", b: [
        `<p>Node 1: 2 kΩ to ground, 2 kΩ to node 2. Node 2: 1 kΩ to ground. A 3 mA source pushes into node 1.</p>`,
        { t: "num", q: "v₂ (V)?", a: 1.2, hint: "G = [[1, −0.5], [−0.5, 1.5]] mS, i = (3, 0) mA.", hint2: "Eliminate: row 2 + 0.5·row 1 gives (0, 1.25 | 1.5).", why: "v₂ = 1.5/1.25 = 1.2 V, then v₁ = 3 + 0.5 × 1.2 = 3.6 V. KCL at node 2: in (3.6 − 1.2)/2k = 1.2 mA, out 1.2/1k = 1.2 mA ✓." },
      ]},
      { k: "check", title: "Problem 2: a bridge row", b: [
        { t: "mcq", q: "A G matrix has row 3 = (−1, −2, 3, 0) mS and symmetric partners. What does node 3 connect to?", opts: [["1 mS to node 1, 2 mS to node 2, nothing to node 4, nothing to ground", true, "Off-diagonals give the links; row sum 0 means no path to ground from node 3 itself."], ["3 mS to ground", false, "The diagonal is everything touching node 3, not just ground."], ["It's floating", false, "It's connected to nodes 1 and 2; a node is only floating if its whole group has no path to ground."]] },
      ]},
      { k: "check", title: "Problem 3: MNA size", b: [
        { t: "num", q: "A circuit has 40 non-ground nodes, 3 independent voltage sources and 2 inductors (SPICE treats each inductor's current as an unknown too). How many unknowns?", a: 45, hint: "Node voltages, plus one current for each voltage source and each inductor.", why: "40 + 3 + 2 = 45." },
      ]},
      { k: "check", title: "Problem 4: the source-follower stamp", b: [
        `<p>Source follower, small-signal: gate driven by v<sub>in</sub>, drain at ac ground, output node s with R<sub>S</sub> to ground. Transistor current g<sub>m</sub>(v<sub>in</sub> − v<sub>s</sub>) flows into node s.</p>`,
        { t: "num", q: "KCL at s: G_S v_s − g_m(v_in − v_s) = 0. With g_m = 4 mS, R_S = 1 kΩ, gain v_s/v_in?", a: 0.8, hint: "Collect v_s terms: (G_S + g_m)v_s = g_m v_in.", why: "4/(1 + 4) = 0.8. Always a bit under 1: the follower's familiar result." },
      ]},
      { k: "check", title: "Problem 5: why it failed", b: [
        { t: "mcq", q: "A netlist has two ideal 1.8 V sources both connected from VDD to ground. DC analysis fails. Why?", opts: [["Two voltage sources in parallel: the MNA rows are identical and the matrix is singular", true, "Their currents can split any way at all, so there's no unique answer."], ["1.8 V is too low for SPICE", false, "Voltage level doesn't matter."], ["The nodes float", false, "VDD is pinned, very firmly; the problem is the currents."]] },
      ]},
      { k: "say", title: "Problem 6: explain it", b: [
        { t: "say", q: "Walk through what a circuit simulator does with a linear netlist to get the DC node voltages.", model: "It numbers the nodes, then stamps every element into an MNA matrix: conductances for resistors, extra rows and columns for voltage sources and inductors, one-sided gm entries for controlled sources, and sources into the right-hand side. Then it reorders for sparsity, factors the matrix into L and U with pivoting, and solves by forward and back substitution. A singular matrix means a floating node or a source loop." },
      ]},
    ],
  };

  window.CHAPTER = {
    id: "m25", eyebrow: "Math Toolkit · Module 25", title: "Solving Circuits with Matrices",
    intro: `<p>Six parts: building the conductance matrix by inspection, Gaussian elimination, LU and sparsity, voltage sources (Modified Nodal Analysis), transistors as matrix stamps, and mastery problems.</p><p>By the end you'll know exactly what SPICE does with your schematic, and what its error messages mean.</p><p class="aside">Before this: Module 24 (matrices). Connects to 6.002 Chapters 2–3 (node method) and 8 (small-signal models).</p>`,
    after: `<p>Next: Module 26 asks which directions a matrix leaves unturned. Its answer, eigenvalues, is the same thing as a circuit's natural frequencies.</p>`,
    parts: [p1, p2, p3, p4, p5, p6],
    summary: `
      <p><b>Stamps:</b> resistor i–j: +G at (i,i), (j,j); −G at (i,j), (j,i). To ground: +G at (i,i). Current source into i: +I in row i of RHS.</p>
      <p>G: diagonal = total conductance at the node; off-diagonal = −link; symmetric; row sum = conductance to ground.</p>
      <p><b>Elimination:</b> multiplier = entry/pivot; subtract to clear below each pivot; back-substitute. Dense cost ≈ n³/3. Zero pivot → swap rows. Zero row → singular.</p>
      <p><b>LU:</b> G = LU; factor once (n³/3), solve each RHS in ~n². <b>Sparse:</b> few non-zeros per row; reorder to limit fill-in.</p>
      <p><b>MNA:</b> voltage source adds unknown i_V and row vᵢ − vⱼ = V. Zero diagonal → pivoting. i_V &lt; 0 (into +) = source delivers power.</p>
      <p><b>VCCS</b> g_m·v_c from a to b: +g_m at (a, c), −g_m at (b, c) (and opposite signs under c−). Non-symmetric → non-reciprocal → gain. CS gain −g_m(R_D ∥ r_o); follower g_mR_S/(1 + g_mR_S).</p>
      <p><b>Singular matrix</b> = floating node (no DC path to ground) or a loop of voltage sources/inductors.</p>`,
  };
  Course.start(window.CHAPTER);
})();
</script>
