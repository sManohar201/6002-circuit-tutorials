<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: a chapter map (hub) that opens one part at a time; each part is a rail of single-card steps on graph paper. */
:root {
  --paper: #eaf0f4;
  --grid: rgba(40, 90, 140, 0.08);
  --card: #ffffff;
  --ink: #142238;
  --muted: #56677d;
  --line: #d2dce6;
  --accent: #e39a0b;
  --accent-soft: #fdf1d8;
  --accent-ink: #7a4d00;
  --cool: #2b67a3;
  --cool-soft: #e1ecf7;
  --good: #1d8656;
  --good-soft: #def4e9;
  --bad: #c2412a;
  --bad-soft: #fbe5e0;
  --on-accent: #1b1300;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1520; --grid: rgba(120, 170, 220, 0.07); --card: #16212f; --ink: #e5edf6; --muted: #98a8bc;
    --line: #2a3a4e; --accent: #f3b53c; --accent-soft: #3a2d10; --accent-ink: #f8d68f; --cool: #7db3ea;
    --cool-soft: #15283d; --good: #43c88d; --good-soft: #123426; --bad: #f2735a; --bad-soft: #3d1c16;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1520; --grid: rgba(120, 170, 220, 0.07); --card: #16212f; --ink: #e5edf6; --muted: #98a8bc;
  --line: #2a3a4e; --accent: #f3b53c; --accent-soft: #3a2d10; --accent-ink: #f8d68f; --cool: #7db3ea;
  --cool-soft: #15283d; --good: #43c88d; --good-soft: #123426; --bad: #f2735a; --bad-soft: #3d1c16;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.55;
}
.wrap {
  max-width: 700px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
  display: grid; gap: 16px;
}
header.top { display: grid; gap: 10px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.eyebrow button { font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--cool); background: none; border: 0; padding: 0; cursor: pointer; }
.eyebrow a.book-link { color: var(--cool); text-decoration: none; }
.eyebrow a.book-link:hover, .eyebrow a.book-link:focus-visible { text-decoration: underline; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 6.5vw, 40px); line-height: 1.05; margin: 0; text-wrap: balance; }
.rail { display: flex; gap: 5px; align-items: center; }
.rail button { flex: 1; height: 8px; border-radius: 4px; border: 0; padding: 0; cursor: pointer; background: var(--line); }
.rail button.done { background: var(--accent); opacity: 0.5; }
.rail button.now { background: var(--accent); }
.rail button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.where { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.where b { color: var(--ink); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 20px; display: grid; gap: 16px; min-width: 0; }
.card > * { min-width: 0; }
.card h2 { font-family: var(--display); font-weight: 600; font-size: 24px; line-height: 1.18; margin: 0; text-wrap: balance; }
.card h3 { font-family: var(--display); font-weight: 600; font-size: 19px; margin: 0; }
.card p { margin: 0; max-width: 62ch; }
.card ul, .card ol { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.tag { justify-self: start; font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--line); color: var(--ink); }
.k-predict, .k-play { background: var(--accent-soft); color: var(--accent-ink); }
.k-why, .k-math { background: var(--cool-soft); color: var(--cool); }
.k-bug { background: var(--bad-soft); color: var(--bad); }
.k-whatif, .k-check { background: var(--good-soft); color: var(--good); }
.k-say { background: transparent; color: var(--ink); border: 1px solid var(--ink); }

.mono, code { font-family: var(--mono); font-weight: 700; font-size: 0.92em; }
.eq { font-family: var(--mono); font-weight: 700; font-size: clamp(20px, 5.4vw, 28px); text-align: center; padding: 8px 0; overflow-x: auto; }
.eq .a { color: var(--accent); }
.key { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 10px 10px 0; }
.key b { color: var(--accent-ink); }
.aside { font-size: 15px; color: var(--muted); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.two > * { min-width: 0; }
.tile { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; }
.tile h3 { font-size: 17px; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 16px; }
.tbl th, .tbl td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
.tbl th { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* controls */
.btn { font: inherit; font-size: 16px; padding: 10px 16px; border-radius: 10px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn.ghost { background: transparent; }
.btn.small { font-size: 14px; padding: 6px 12px; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); font-weight: 700; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn:focus-visible, input:focus-visible, textarea:focus-visible, .hit:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.choices { display: grid; gap: 8px; }
.choice { text-align: left; width: 100%; }
.choice.right { border-color: var(--good); background: var(--good-soft); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.q { display: grid; gap: 10px; }
.qq { font-weight: 700; }
.feedback { border-radius: 10px; padding: 12px 14px; font-size: 16px; background: var(--paper); border: 1px solid var(--line); }
.feedback.ok { background: var(--good-soft); border-color: var(--good); }
.feedback.no { background: var(--bad-soft); border-color: var(--bad); }
.num { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.num input { font: inherit; font-family: var(--mono); font-size: 19px; width: 8em; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
textarea { font: inherit; font-size: 17px; width: 100%; min-height: 96px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); resize: vertical; }
select { font: inherit; font-family: var(--mono); font-size: 15px; max-width: 100%; padding: 8px 10px; margin: 4px 0 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.model { border: 2px dashed var(--good); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.model .lbl { font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--good); }
.sort { display: grid; gap: 8px; }
.sort-item { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.sort-item > span { min-width: 0; }
.sort-item.right { border-color: var(--good); background: var(--good-soft); }
.sort-item.wrong { border-color: var(--bad); background: var(--bad-soft); }
.sort-item .why { grid-column: 1 / -1; font-size: 15px; }
@media (max-width: 480px) { .sort-item { grid-template-columns: 1fr; } }

/* sliders + readouts */
.sliders { display: grid; gap: 10px; }
.sl { display: grid; gap: 2px; }
.sl label { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; color: var(--muted); }
.sl output { font-family: var(--mono); font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.sl input[type="range"] { width: 100%; accent-color: var(--accent); }
.readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.readout > div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--paper); min-width: 0; }
.readout span { display: block; font-size: 13px; color: var(--muted); }
.readout b { font-family: var(--mono); font-size: 19px; font-variant-numeric: tabular-nums; }
.verdict { justify-self: start; font-weight: 700; font-size: 15px; padding: 4px 14px; border-radius: 999px; }
.verdict.ok { background: var(--good-soft); color: var(--good); }
.verdict.mid { background: var(--accent-soft); color: var(--accent-ink); }
.verdict.no { background: var(--bad-soft); color: var(--bad); }

/* schematics + plots */
.fig { overflow-x: auto; }
.sch, .plot { width: 100%; height: auto; display: block; margin: 0 auto; }
.sch .w { stroke: var(--ink); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.sch .w.hl { stroke: var(--accent); stroke-width: 3.5; }
.sch .w.dim { stroke: var(--line); }
.sch .el { fill: var(--card); stroke: var(--ink); stroke-width: 2.5; }
.sch .el.hl { stroke: var(--accent); stroke-width: 3.5; }
.sch .nd { fill: var(--ink); }
.sch text { fill: var(--ink); font-family: var(--mono); font-size: 14px; }
.sch text.s { font-size: 12px; }
.sch text.big { font-size: 18px; font-weight: 700; }
.sch .m { fill: var(--muted); }
.sch .a { fill: var(--accent-ink); }
.sch .c { fill: var(--cool); }
.sch .g { fill: var(--good); }
.sch .b { fill: var(--bad); }
.sch .cur { stroke: var(--cool); stroke-width: 2.2; fill: none; }
.sch .curh { fill: var(--cool); }
.sch .flow { stroke: var(--accent); stroke-width: 4; fill: none; stroke-dasharray: 3 13; stroke-linecap: round; animation: flow var(--dur, 1s) linear infinite; }
.sch .zone { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 4; }
.sch .box { fill: var(--paper); stroke: var(--ink); stroke-width: 2.5; }
.sch .hit { cursor: pointer; fill: transparent; stroke: transparent; stroke-width: 18; }
@keyframes flow { to { stroke-dashoffset: -16; } }
.plot .grid { stroke: var(--line); stroke-width: 1; }
.plot .axis { stroke: var(--muted); stroke-width: 1.5; }
.plot text { fill: var(--muted); font-family: var(--mono); font-size: 12px; }
.plot text.lab { fill: var(--ink); font-size: 13px; font-weight: 700; }
.plot .s1 { stroke: var(--accent); stroke-width: 3; fill: none; }
.plot .s2 { stroke: var(--cool); stroke-width: 3; fill: none; }
.plot .s3 { stroke: var(--good); stroke-width: 3; fill: none; }
.plot .s4 { stroke: var(--bad); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.plot .s5 { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 4 4; }
.plot .ar1 { fill: var(--accent); opacity: 0.22; }
.plot .ar2 { fill: var(--cool); opacity: 0.18; }
.plot .ar3 { fill: var(--good); opacity: 0.16; }
.plot .mk { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
.plot .mk2 { fill: var(--cool); stroke: var(--card); stroke-width: 2; }
.plot .mkb { fill: var(--bad); stroke: var(--card); stroke-width: 2; }

/* hub */
.parts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.part-btn { width: 100%; text-align: left; display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.part-btn:hover { border-color: var(--ink); }
.part-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.part-btn > span { min-width: 0; }
.part-n { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-weight: 700; border: 2px solid var(--line); }
.part-btn.done .part-n { background: var(--good); border-color: var(--good); color: var(--card); }
.part-btn.next .part-n { border-color: var(--accent); color: var(--accent-ink); }
.part-t { font-weight: 700; display: block; }
.part-d { font-size: 15px; color: var(--muted); display: block; }
.part-m { font-family: var(--mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
.after { border: 2px solid var(--ink); border-radius: 14px; padding: 16px 18px; display: grid; gap: 8px; background: var(--card); }

nav.bottom { display: flex; justify-content: space-between; gap: 8px; }
nav.bottom .btn { min-width: 120px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
.ov { text-decoration: overline; }
.bits { display: flex; flex-wrap: wrap; gap: 6px; }
.bits .btn { min-width: 44px; font-family: var(--mono); font-weight: 700; }

/* code (HDL and assembly listings) */
pre.code { font-family: var(--mono); font-size: 14px; line-height: 1.5; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 0; overflow-x: auto; white-space: pre; color: var(--ink); }
pre.code .kw { color: var(--accent-ink); font-weight: 700; }
pre.code .cm { color: var(--muted); font-style: italic; }
pre.code .nm { color: var(--cool); }
pre.code .hl { background: var(--accent-soft); border-radius: 4px; }
code { font-family: var(--mono); font-size: .92em; background: var(--paper); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
</style>
</head>

  key: "edc", short: "Boylestad", home: "edc.html", dir: "edc",

  pdfFolder: "electroinc_devices_circuit_theory / ilovepdf_split-range",

   adds the shared helpers and sets window.BOOK to the book this page belongs to (window.BOOK_KEY). */
(function () {
  const all = window.BOOKS || {};
  Object.values(all).forEach((B) => {
    B.all = () => B.groups.flatMap((g) => g.items);
    B.chapters = () => B.all().filter((c) => typeof c.n === "number");
    B.find = (id) => B.all().find((c) => c.id === id);
    B.pdfName = (c) => B.pdfFile || B.pdfPrefix + c.pdf + ".pdf"; /* one-file books name the whole PDF */
    /* "pp. 26–75" for books whose file names are PDF pages, "pp. 1–54" (printed pages) when a chapter lists `pages`. */
    B.pagesLabel = (c) => (c.pages ? "book pp. " + c.pages : "pp. " + c.pdf).replace("-", "–") + (B.pdfFile && c.pages ? ", PDF pp. " + c.pdf.replace("-", "–") : "");
    B.probsLabel = (c) => (c.probs ? `page ${c.probs} of that PDF${c.probsBook && c.probsBook !== c.probs ? ` (book page ${c.probsBook})` : ""}` : "");
  });
  window.BOOK = all[window.BOOK_KEY] || null;
})();

<script>
/* Progress store shared by the contents page and every chapter page.
   Each chapter's state is { done: {p1: true}, last: {part, step} | null, say: {key: text}, t: ms }.
   It lives in two places:
     - localStorage "course-<id>": instant first paint, and the fallback when nothing else works.
     - the artifact's db, at data/users/<viewer id>/<chapter id>: private to the viewer, follows them
       across browsers and sessions. Only available when the page runs inside the claude.ai viewer. */
window.Progress = (function () {
  const LKEY = (id) => "course-" + id;
  const local = {
    get(id) { try { const v = localStorage.getItem(LKEY(id)); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
    set(id, v) { try { localStorage.setItem(LKEY(id), JSON.stringify(v)); } catch (e) {} },
  };
  const blank = () => ({ done: {}, last: null, say: {}, t: 0 });
  const norm = (s) => Object.assign(blank(), s || {}, { done: Object.assign({}, s && s.done), say: Object.assign({}, s && s.say) });

  /* Combine two copies: parts finished anywhere stay finished; the newer copy wins for position and text. */
  function merge(a, b) {
    a = norm(a); b = norm(b);
    const [old, neu] = a.t >= b.t ? [b, a] : [a, b];
    return { done: Object.assign({}, old.done, neu.done), last: neu.last, say: Object.assign({}, old.say, neu.say), t: neu.t };
  }
  const same = (a, b) => JSON.stringify(norm(a)) === JSON.stringify(norm(b));

  /* ---------- cloud ---------- */
  let status = "local"; // "local" | "cloud"
  const statusFns = [];
  const setStatus = (s) => { status = s; statusFns.forEach((f) => f(s)); };
  const cloud = (async () => {
    try {
      if (!window.claude || !window.claude.use) return null;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return null;
      const uid = await user.id();
      if (!uid) return null;
      const col = db.collection("data/users/" + uid);
      await col.limit(1).get(); // proves the store answers before we claim "saved to your account"
      setStatus("cloud");
      return col;
    } catch (e) { return null; }
  })();

  /* One write in flight per chapter; bursts collapse into the latest state. */
  const pending = {}, busy = {};
  async function flush(id) {
    const col = await cloud;
    if (!col || busy[id] || !pending[id]) return;
    busy[id] = true;
    const body = pending[id]; pending[id] = null;
    try { await col.doc(id).set(body); }
    catch (e) {
      if (e && e.code === "unavailable") { pending[id] = pending[id] || body; setTimeout(() => flush(id), 1500 + Math.random() * 1500); }
      else if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) setStatus("local");
    }
    busy[id] = false;
    if (pending[id]) flush(id);
  }
  const timers = {};
  function push(id, state, delay) {
    pending[id] = JSON.parse(JSON.stringify(norm(state)));
    clearTimeout(timers[id]);
    timers[id] = setTimeout(() => flush(id), delay);
  }

  return {
    /* Synchronous best guess from this browser. */
    load(id) { return norm(local.get(id)); },
    /* Save locally now, to the account shortly after. `delay` batches typing. */
    save(id, state, delay = 400) {
      state.t = Date.now();
      local.set(id, state);

    onStatus(fn) { statusFns.push(fn); fn(status); },

    });
    (o.texts || []).forEach((tx) => { s += `<text class="lab" x="${X(tx.x)}" y="${Y(tx.y)}" text-anchor="${tx.a || "start"}">${tx.s}</text>`; });
    return `<svg class="plot" viewBox="0 0 ${W} ${H}" style="max-width:${W}px" role="img" aria-label="${o.label || "Graph"}">${s}</svg>`;
  }

  /* ---------- UI helpers for widgets ---------- */
  function slider(o, onChange) {
    const wrap = el(`<div class="sl"><label for="${o.id}"><span>${o.label}</span><output></output></label><input type="range" id="${o.id}"></div>`);
    const inp = wrap.querySelector("input"), out = wrap.querySelector("output");
    if (o.log) { inp.min = 0; inp.max = 1000; inp.step = 1; }
    else { inp.min = o.min; inp.max = o.max; inp.step = o.step || (o.max - o.min) / 100; }
    const toT = (v) => (1000 * Math.log(v / o.min)) / Math.log(o.max / o.min);
    const get = () => (o.log ? o.min * Math.pow(o.max / o.min, inp.value / 1000) : +inp.value);
    const show = () => { out.textContent = o.show ? o.show(get()) : fmt(get()); };
    inp.value = o.log ? toT(o.value) : o.value;
    show();
    inp.addEventListener("input", () => { show(); onChange && onChange(get()); });
    return { el: wrap, get, set(v) { inp.value = o.log ? toT(v) : v; show(); onChange && onChange(get()); } };
  }
  function toggle(labels, onPick, start = 0) {
    const r = el(`<div class="row" role="group"></div>`);
    labels.forEach((lab, i) => {
      const b = el(`<button type="button" class="btn small" aria-pressed="${i === start}">${lab}</button>`);
      b.addEventListener("click", () => { r.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); onPick(i); });
      r.appendChild(b);
    });
    return r;
  }
  const readout = (pairs) => `<div class="readout">${pairs.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join("")}</div>`;

  /* ---------- blocks ---------- */
  function mcq(b) {
    const n = el(`<div class="q">${b.q ? `<p class="qq">${b.q}</p>` : ""}${b.fig || ""}<div class="choices"></div><div class="feedback" aria-live="polite" hidden></div></div>`);
    const ch = n.querySelector(".choices"), fb = n.querySelector(".feedback");
    b.opts.forEach(([txt, ok, why]) => {
      const btn = el(`<button type="button" class="btn choice">${txt}</button>`);
      btn.addEventListener("click", () => {
        fb.hidden = false;
        fb.className = "feedback " + (ok ? "ok" : "no");
        fb.innerHTML = (ok ? "<b>Yes.</b> " : "<b>Not this one.</b> ") + (why || "");
        btn.classList.add(ok ? "right" : "wrong");
        if (ok) ch.querySelectorAll("button").forEach((x) => (x.disabled = x !== btn));
      });
      ch.appendChild(btn);
    });
    return n;
  }
  function num(b, id) {
    const n = el(`<div class="q"><p class="qq">${b.q}</p>${b.fig || ""}<form class="num" novalidate><input id="${id}" inputmode="decimal" autocomplete="off" aria-label="Your answer"><span class="mono">${b.unit || ""}</span><button class="btn primary" type="submit">Check</button></form><div class="feedback" aria-live="polite" hidden></div></div>`);
    const fb = n.querySelector(".feedback"), inp = n.querySelector("input");
    let tries = 0;
    n.querySelector("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const v = parseFloat(String(inp.value).replace(",", ".").replace("−", "-"));
      fb.hidden = false;
      if (isNaN(v)) { fb.className = "feedback"; fb.textContent = "Type a number first."; return; }
      const tol = b.tol != null ? b.tol : 0.02;
      const ok = b.a === 0 ? Math.abs(v) < 1e-9 : Math.abs(v - b.a) <= Math.abs(b.a) * tol;
      tries++;
      if (ok) { fb.className = "feedback ok"; fb.innerHTML = "<b>Yes.</b> " + (b.why || ""); }
      else { fb.className = "feedback no"; fb.innerHTML = "<b>Not yet.</b> " + (tries >= 2 && b.hint2 ? b.hint2 : b.hint || "Check your units and signs."); }
    });
    return n;
  }
  /* Say-it-back answers live in the chapter's progress state; start() points this at it. */
  let says = { get: (k) => store.get(k, ""), set: (k, v) => store.set(k, v) };
  function say(b, id, key) {
    const n = el(`<div class="q"><p class="qq">${b.q}</p><textarea id="${id}" placeholder="Type your answer in your own words. Rough is fine."></textarea><div class="row"><button type="button" class="btn primary">Compare with mine</button></div><div class="model" hidden><span class="lbl">One good answer</span><div>${b.model}</div><p class="aside">Did yours get the same core idea? Wording doesn't matter. If you're unsure, paste yours into the chat and ask for feedback.</p></div></div>`);
    const ta = n.querySelector("textarea");
    ta.value = says.get(key);
    ta.addEventListener("input", () => says.set(key, ta.value));
    n.querySelector("button").addEventListener("click", () => { n.querySelector(".model").hidden = false; });
    return n;
  }
  function sort(b) {
    const n = el(`<div class="q">${b.q ? `<p class="qq">${b.q}</p>` : ""}<div class="sort"></div><div class="row"><button type="button" class="btn primary sort-check">Check my sorting</button></div><div class="feedback" aria-live="polite" hidden></div></div>`);
    const box = n.querySelector(".sort"), picks = [];
    b.items.forEach(([label], i) => {
      const it = el(`<div class="sort-item"><span>${label}</span></div>`);
      it.appendChild(toggle(b.bins, (k) => (picks[i] = k), -1));
      it.appendChild(el(`<div class="why" hidden></div>`));
      box.appendChild(it);
    });
    n.querySelector(".sort-check").addEventListener("click", () => {
      let right = 0;
      b.items.forEach(([, bin, why], i) => {
        const it = box.children[i], ok = picks[i] === bin;
        if (ok) right++;
        it.classList.toggle("right", ok); it.classList.toggle("wrong", !ok);
        const w = it.querySelector(".why"); w.hidden = false;
        w.innerHTML = (picks[i] == null ? "<b>Not sorted yet.</b> " : "") + (ok ? "" : `<b>Belongs in “${b.bins[bin]}”.</b> `) + (why || "");
      });
      const fb = n.querySelector(".feedback"); fb.hidden = false;
      fb.className = "feedback " + (right === b.items.length ? "ok" : "no");
      fb.innerHTML = `<b>${right} of ${b.items.length}</b> sorted correctly. ${right === b.items.length ? "" : "Read the notes on the red ones."}`;
    });
    return n;
  }
  function reveal(b) {
    const n = el(`<div class="q"><div class="row"><button type="button" class="btn">${b.label || "Show me"}</button></div><div hidden>${b.html}</div></div>`);
    n.querySelector("button").addEventListener("click", (e) => { n.lastElementChild.hidden = false; e.currentTarget.disabled = true; });
    return n;
  }
  function renderBlock(b, id, key) {
    if (typeof b === "string") return el(`<div>${b}</div>`);
    if (typeof b === "function") { const h = el(`<div class="widget" style="display:grid;gap:12px;min-width:0"></div>`); b(h, id); return h; }
    if (b.t === "mcq") return mcq(b);
    if (b.t === "num") return num(b, id);
    if (b.t === "say") return say(b, id, key);
    if (b.t === "sort") return sort(b);
    if (b.t === "reveal") return reveal(b);
    return el(`<div>${b.html || ""}</div>`);
  }

  /* ---------- subscripts: "v_TH" in any text renders as v<sub>TH</sub> (tspan inside SVG).
     A subscript stops before a letter that starts the next subscripted name, so "g_mR_D" reads g<sub>m</sub>R<sub>D</sub>. ---------- */
  const SUBRE = /([A-Za-zΔβμαθωφτγ′])_([A-Za-z0-9]+?)(?=[A-Za-zΔβμαθωφτγ′]_|[^A-Za-z0-9]|$)/g, SVGNS = "http://www.w3.org/2000/svg";
  function subify(root) {
    if (!root || !document.createTreeWalker) return;
    const w = document.createTreeWalker(root, 4 /* text */), hits = [];
    for (let n = w.nextNode(); n; n = w.nextNode()) {
      const p = n.parentNode;
      if (n.nodeValue.indexOf("_") < 0 || !p || /^(script|style|textarea|sub|tspan|title|code|pre)$/i.test(p.nodeName) || (p.closest && p.closest("pre, code"))) continue;
      SUBRE.lastIndex = 0;
      if (SUBRE.test(n.nodeValue)) hits.push(n);
    }
    hits.forEach((n) => {
      const svg = n.parentNode.namespaceURI === SVGNS, s = n.nodeValue, frag = document.createDocumentFragment();
      let last = 0, m;
      SUBRE.lastIndex = 0;
      while ((m = SUBRE.exec(s))) {
        frag.appendChild(document.createTextNode(s.slice(last, m.index) + m[1]));
        const sub = svg ? document.createElementNS(SVGNS, "tspan") : document.createElement("sub");
        if (svg) { sub.setAttribute("baseline-shift", "sub"); sub.setAttribute("font-size", "75%"); }
        sub.textContent = m[2];
        frag.appendChild(sub);
        last = m.index + m[0].length;
      }
      frag.appendChild(document.createTextNode(s.slice(last)));
      n.parentNode.replaceChild(frag, n);
    });
  }
  function watchSubs(root) {
    subify(root);
    if (!window.MutationObserver) return;
    new MutationObserver((ms) => ms.forEach((m) => m.addedNodes.forEach((a) => subify(a.nodeType === 3 ? a.parentNode : a)))).observe(root, { childList: true, subtree: true });
  }

  /* ---------- app ---------- */
  const KIND = { learn: "Learn", play: "Play", predict: "Predict first", why: "Why?", whatif: "What if…", bug: "Spot the mistake", check: "Quick check", say: "Say it back", math: "Math boost" };

  function start(C) {
    const KEY = "course-" + C.id, P = window.Progress;
    const state = P ? P.load(C.id) : store.get(KEY, { done: {}, last: null, say: {} });
    state.say = state.say || {};
    const save = (delay) => (P ? P.save(C.id, state, delay) : store.set(KEY, state));
    says = {
      get: (k) => (k in state.say ? state.say[k] : store.get(k, "")), // older builds kept answers under their own keys
      set: (k, v) => { state.say[k] = v; save(1500); },
    };
    const root = document.getElementById("app");
    watchSubs(root);
    let view = { part: null, step: 0 };

    /* Book navigation: chapter pages sit in the book's folder, its contents page one level up. */
    const B = window.BOOK;
    const bookLink = () => (B ? `<a class="book-link" href="../${B.home}">← Contents</a> · ` : "");
    /* Where this chapter lives in the real book, so the problems are easy to find afterwards. */
    const U = (B && B.unit) || "Chapter", u = U.toLowerCase();
    /* Cross-book links: a math module lists the chapters that use it; a chapter lists the math modules it needs. */
    const BOOKS = Object.values(window.BOOKS || {});
    function chapterRef(id) {
      for (const K of BOOKS) {
        if (K.key === "math" || !K.find) continue;
        const c = K.find(id);
        if (c && c.file) return `<a href="../${K.dir}/${c.file}" title="${c.title}">${K.short} ${typeof c.n === "number" ? "Ch" : "App"} ${c.n}</a>`;
      }
      return "";
    }
    function mathLinks() {
      const M = window.BOOKS && window.BOOKS.math;
      if (!M || !M.all || (B && B.key === "math")) return "";
      const href = (m) => (m.file.startsWith("../") ? m.file : "../math/" + m.file);
      const list = (key) => M.all().filter((m) => m.file && (m[key] || []).includes(C.id)).map((m) => `<a href="${href(m)}">${m.title}</a>`).join(" · ");
      const need = list("needs"), also = list("also");
      return (need ? `<p class="aside where-book">Math you'll use: ${need}</p>` : "") + (also ? `<p class="aside where-book">Going further (optional): ${also}</p>` : "");
    }
    function whereInBook() {
      const me = B && B.find(C.id);
      if (me && B.noPdf) {
        const used = (me.needs || []).map(chapterRef).filter(Boolean), pairs = (me.also || []).map(chapterRef).filter(Boolean);
        return (used.length ? `<p class="aside where-book">Used in: ${used.join(" · ")}</p>` : "") + (pairs.length ? `<p class="aside where-book">Not in the books, but pairs with: ${pairs.join(" · ")}</p>` : "");
      }
      if (!me || !me.pdf) return mathLinks();
      return `<p class="aside where-book">${B.short}, ${typeof me.n === "number" ? "Chapter" : "Appendix"} ${me.n} · ${B.pagesLabel(me)}${B.pdfFile ? "" : ` · PDF file ending “-${me.pdf}.pdf”`}${me.probs ? ` · problems from ${B.probsLabel(me)}` : ""}</p>` + mathLinks();
    }
    function problemsNote() {
      const me = B && B.find(C.id);
      if (!me || !me.probs) return "";
      return `<div class="key"><b>Your book problems:</b> open <span class="mono">${B.pdfName(me)}</span> and go to ${B.probsLabel(me)}.</div>`;
    }
    const isAppPage = () => { const m = B && B.find(C.id); return !!m && typeof m.n !== "number"; };
    function nextChapter() {
      if (!B) return "";
      const me = B.find(C.id), isApp = !!me && typeof me.n !== "number";
      const list = isApp ? B.all().filter((c) => typeof c.n !== "number" && c.file) : B.chapters(), i = list.findIndex((c) => c.id === C.id), nx = list[i + 1];
      const ans = B.answers && !isApp ? `<p class="aside">The book has short answers to some problems (${B.answers.label}, pages ${B.answers.pdf.replace("-", "–")}). Look only after you've committed to your own answer.</p>` : "";
      if (!nx) return ans + `<p><a href="../${B.home}">← Back to the contents</a></p>`;
      return ans + (nx.file
        ? `<p>Then: <a href="${nx.file}">${isApp ? "Appendix" : U} ${nx.n} · ${nx.title} →</a></p>`
        : `<p>Next up: ${U} ${nx.n} · ${nx.title}. Its tutorial isn't built yet. Ask Claude for it when you're ready.</p>`);
    }

    function hub() {
      view = { part: null, step: 0 };
      const firstOpen = C.parts.findIndex((p) => !state.done[p.id]);
      const node = el(`<div class="wrap">
        <header class="top"><div class="eyebrow">${bookLink()}${C.eyebrow}</div><h1>${C.title}</h1>${whereInBook()}</header>
        <section class="card"><span class="tag">How this ${isAppPage() ? "appendix" : u} works</span>${C.intro}</section>
        <ol class="parts" aria-label="Parts of this ${u}"></ol>
        <section class="after"><h3 style="font-family:var(--display);margin:0">After the last part</h3>${problemsNote()}${C.after}${nextChapter()}</section>
        <p class="aside save-note"></p>
      </div>`);
      if (P) P.onStatus((s) => { const n = node.querySelector(".save-note"); if (n) n.textContent = s === "cloud" ? "Progress saves to your Claude account, so it follows you to any browser." : "Progress saves in this browser only."; });
      const list = node.querySelector(".parts");
      C.parts.forEach((p, i) => {
        const done = !!state.done[p.id];
        const cls = done ? "done" : i === firstOpen ? "next" : "";
        const b = el(`<li><button type="button" class="part-btn ${cls}"><span class="part-n">${done ? "✓" : i + 1}</span><span><span class="part-t">${p.title}</span><span class="part-d">${p.blurb}</span></span><span class="part-m">${p.mins} min</span></button></li>`);
        b.querySelector("button").addEventListener("click", () => openPart(i, state.last && state.last.part === i ? state.last.step : 0));
        list.appendChild(b);
      });
      const sum = el(`<li><button type="button" class="part-btn"><span class="part-n">Σ</span><span><span class="part-t">${U} summary</span><span class="part-d">Every key idea and formula on one page. Keep it open while you do the problems.</span></span><span class="part-m">ref</span></button></li>`);
      sum.querySelector("button").addEventListener("click", summary);
      list.appendChild(sum);
      if (state.last && state.last.part != null && C.parts[state.last.part]) {
        const p = C.parts[state.last.part];
        const cont = el(`<div class="row"><button type="button" class="btn primary">Continue: Part ${state.last.part + 1}, step ${state.last.step + 1}</button><span class="aside">${p.title}</span></div>`);
        cont.querySelector("button").addEventListener("click", () => openPart(state.last.part, state.last.step));
        node.querySelector(".card").after(cont);
      }
      root.replaceChildren(node);
      window.scrollTo(0, 0);
    }

    function summary() {
      view = { part: null, step: 0 };
      const node = el(`<div class="wrap"><header class="top"><div class="eyebrow"><button type="button">← ${C.eyebrow}</button></div><h1>${U} summary</h1></header><section class="card">${C.summary}</section><nav class="bottom"><button type="button" class="btn ghost">← ${U} map</button><span></span></nav></div>`);
      node.querySelectorAll(".eyebrow button, nav .btn").forEach((b) => b.addEventListener("click", hub));
      root.replaceChildren(node);
      window.scrollTo(0, 0);
    }

    function openPart(pi, si0 = 0) {
      const P = C.parts[pi];
      const node = el(`<div class="wrap">
        <header class="top"><div class="eyebrow"><button type="button">← ${C.eyebrow}</button> · Part ${pi + 1} of ${C.parts.length}</div><h1>${P.title}</h1>
        <div class="rail" aria-label="Steps"></div><div class="where"></div></header>
        <main></main>
        <nav class="bottom"><button type="button" class="btn ghost" data-back>← Back</button><button type="button" class="btn primary" data-next>Next →</button></nav></div>`);
      node.querySelector(".eyebrow button").addEventListener("click", hub);
      root.replaceChildren(node);
      const rail = node.querySelector(".rail"), where = node.querySelector(".where"), main = node.querySelector("main");
      const back = node.querySelector("[data-back]"), next = node.querySelector("[data-next]");
      const N = P.steps.length;

      function show(i) {
        i = Math.max(0, Math.min(N, i));
        view = { part: pi, step: i };
        if (i === N) return finish();
        state.last = { part: pi, step: i }; save();
        const st = P.steps[i];
        const card = el(`<section class="card"><span class="tag k-${st.k}">${KIND[st.k] || st.k}</span>${st.title ? `<h2>${st.title}</h2>` : ""}</section>`);
        (st.b || []).forEach((b, j) => card.appendChild(renderBlock(b, `${C.id}-${P.id}-s${i}-b${j}`, `${KEY}-say-${P.id}-${i}-${j}`)));
        main.replaceChildren(card);
        rail.innerHTML = P.steps.map((s, k) => `<button type="button" class="${k < i ? "done" : k === i ? "now" : ""}" aria-label="Step ${k + 1}" ${k === i ? 'aria-current="step"' : ""} data-i="${k}"></button>`).join("");
        rail.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => show(+b.dataset.i)));
        where.innerHTML = `Step <b>${i + 1}</b> of ${N} · ${KIND[st.k] || st.k}`;
        back.disabled = i === 0;
        next.hidden = false;
        next.textContent = i === N - 1 ? "Finish part ✓" : "Next →";
        window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
      }
      function finish() {
        state.done[P.id] = true;
        state.last = pi + 1 < C.parts.length ? { part: pi + 1, step: 0 } : null;
        save();
        const hasNext = pi + 1 < C.parts.length;
        const card = el(`<section class="card"><span class="tag k-check">Part ${pi + 1} complete</span><h2>Your takeaway</h2><div class="key">${P.takeaway}</div>
          <p class="aside">Good moment for a short break. Stand up, drink some water, then come back.</p>
          <div class="row">${hasNext ? `<button type="button" class="btn primary" data-np>Part ${pi + 2}: ${C.parts[pi + 1].title} →</button>` : `<button type="button" class="btn primary" data-sum>Open the ${u} summary</button>`}<button type="button" class="btn ghost" data-hub>Chapter map</button></div></section>`);
        main.replaceChildren(card);
        rail.querySelectorAll("button").forEach((b) => (b.className = "done"));
        where.innerHTML = `<b>Done</b> · ${N} steps`;
        back.disabled = false;
        next.hidden = true;
        card.querySelector("[data-hub]").addEventListener("click", hub);
        if (hasNext) card.querySelector("[data-np]").addEventListener("click", () => openPart(pi + 1, 0));
        else card.querySelector("[data-sum]").addEventListener("click", summary);
        window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
      }
      back.addEventListener("click", () => show(view.step - 1));
      next.addEventListener("click", () => show(view.step + 1));
      show(si0);
    }

    document.addEventListener("keydown", (e) => {
      if (view.part == null) return;
      if (e.target.closest && e.target.closest("input, textarea, select")) return;
      const nb = document.querySelector("[data-next]"), bb = document.querySelector("[data-back]");
      if (e.key === "ArrowRight" && nb && !nb.hidden) nb.click();
      if (e.key === "ArrowLeft" && bb && !bb.disabled) bb.click();
    });

    const m = /^#p(\d+)$/.exec(location.hash || "");
    /* #resume (from the library's Resume card): the saved step, else the first unfinished part, else the map. */
    const L = state.last, todo = C.parts.findIndex((p) => !state.done[p.id]);
    if (m && C.parts[+m[1] - 1]) openPart(+m[1] - 1, 0);
    else if (location.hash === "#resume" && L && C.parts[L.part]) openPart(L.part, L.step);
    else if (location.hash === "#resume" && todo >= 0) openPart(todo, 0);
    else hub();
    if (P) P.sync(C.id, state, () => { if (view.part == null) hub(); });
  }

  return { start, S, plot, slider, toggle, readout, fmt, si, el, reduce, store };
})();
</script>
<script>
/* Shared drawing and logic helpers for the digital books (Patt & Patel, Harris & Harris, CMOS VLSI).
   Loaded after engine.js on those books' chapter pages: window.Digital. */
window.Digital = (function () {
  const { S, el } = Course;

  /* ---------- bit patterns ---------- */
  const bits = (v, k) => { const m = 2 ** k; return (((v % m) + m) % m).toString(2).padStart(k, "0"); };
  const uval = (b) => parseInt(b, 2);
  const sval = (b) => (b[0] === "1" ? uval(b) - 2 ** b.length : uval(b));
  const flip = (b) => b.replace(/[01]/g, (c) => (c === "0" ? "1" : "0"));
  const hex = (b) => b.padStart(Math.ceil(b.length / 4) * 4, "0").match(/.{4}/g).map((g) => uval(g).toString(16).toUpperCase()).join("");

  /* Row of bit boxes (SVG string). o.top: labels above; o.hot: highlighted indices from the left; o.sign: tint the leftmost box;
     o.w box size; o.W svg width to centre in; o.y top edge; o.x0 left edge (overrides centring). */
  function bitRow(b, o = {}) {
    const k = b.length, w = o.w || Math.min(40, 400 / k), x0 = o.x0 != null ? o.x0 : (o.W || 420) / 2 - (k * w) / 2, y = o.y || 34;
    let s = "";
    b.split("").forEach((c, i) => {
      const hot = o.hot && o.hot.includes(i), sg = o.sign && i === 0;
      s += `<rect x="${x0 + i * w}" y="${y}" width="${w}" height="${w}" style="fill:${hot ? "var(--accent-soft)" : sg ? "var(--cool-soft)" : "var(--card)"};stroke:var(--ink)"/>`;
      s += S.t(x0 + i * w + w / 2, y + w * 0.68, c, { cls: (w > 30 ? "big " : w < 20 ? "s " : "") + "m" });

  /* Clickable bit buttons: { el, get(), set(str) }. onChange(str) after each click. */

  /* ---------- truth tables ---------- */
  /* Every input combination of n variables in counting order, as arrays of 0/1. */
  const combos = (n) => Array.from({ length: 2 ** n }, (_, r) => bits(r, n).split("").map(Number));
  /* HTML truth table. ins: input names; outs: output names; f(row) -> array of outputs (or one value). o.hot: highlighted row. */

  }

  /* ---------- gate symbols ---------- */
  /* Gate symbol with input leads. kind: and|or|nand|nor|xor|xnor|not|buf. Left edge of the body at x, centre y, n inputs.

  function gate(kind, x, y, n = 2, o = {}) {

    let s = "";

      s += `<path class="w${c}" d="M${x} ${y - 20} Q${x + 12} ${y} ${x} ${y + 20}" style="fill:none"/>`;
      if (kind === "xnor") s += `<circle class="el${c}" cx="${x + 68}" cy="${y}" r="5"/>`;

  /* ---------- timing diagrams ---------- */
  /* sigs: [{ name, v: [0/1 or string per slot] , cls }]. o.dx slot width, o.x0 left edge for waves, o.h row height, o.marks: [{t, label}] vertical lines at slot t.

  /* ---------- CMOS gate schematics ---------- */
  /* Each takes input values (0/1) and returns an SVG string with ON transistors and the conducting path highlighted.

  /* ---------- state diagrams ---------- */
  /* nodes: [{ id, x, y, label, sub }]; edges: [{ from, to, label, bend (px, + bends left of travel), ang (self-loop direction in degrees, default −90 = up) }].

  /* ---------- logic minimization (Quine–McCluskey + smallest cover) ---------- */
  /* n variables; ones, dcs: arrays of minterm numbers. Returns implicant patterns like "1-0" (one char per variable, msb first),
     the smallest set that covers every 1, ties broken by fewest literals. */
  function minimize(n, ones, dcs = []) {
    if (!ones.length) return [];
    if (ones.length + dcs.length === 2 ** n) return ["-".repeat(n)];
    let cur = [...new Set([...ones, ...dcs])].map((m) => bits(m, n));
    const primes = new Set();
    while (cur.length) {
      const used = new Set(), next = new Set();
      for (let i = 0; i < cur.length; i++) for (let j = i + 1; j < cur.length; j++) {
        const a = cur[i], b = cur[j];
        let d = -1, ok = true;
        for (let k = 0; k < n && ok; k++) if (a[k] !== b[k]) { if (a[k] === "-" || b[k] === "-" || d >= 0) ok = false; else d = k; }
        if (ok && d >= 0) { next.add(a.slice(0, d) + "-" + a.slice(d + 1)); used.add(a); used.add(b); }
      }
      cur.forEach((t) => { if (!used.has(t)) primes.add(t); });
      cur = [...next];
    }
    const covers = (p, m) => { const b = bits(m, n); for (let k = 0; k < n; k++) if (p[k] !== "-" && p[k] !== b[k]) return false; return true; };
    const P = [...primes].filter((p) => ones.some((m) => covers(p, m)));
    const lits = (p) => p.replace(/-/g, "").length;
    let best = null;
    for (let mask = 1; mask < 1 << P.length; mask++) {
      const pick = P.filter((_, i) => mask & (1 << i));
      if (best && pick.length > best.length) continue;
      if (!ones.every((m) => pick.some((p) => covers(p, m)))) continue;
      if (!best || pick.length < best.length || pick.reduce((s, p) => s + lits(p), 0) < best.reduce((s, p) => s + lits(p), 0)) best = pick;

  /* Implicant pattern → text with combining overlines: "1-0" with names ABC → "AC̅". */
  const implText = (p, names) => p.split("").map((c, i) => (c === "-" ? "" : names[i] + (c === "0" ? "̅" : ""))).join("") || "1";
  const implCovers = (p, m) => { const b = bits(m, p.length); for (let k = 0; k < p.length; k++) if (p[k] !== "-" && p[k] !== b[k]) return false; return true; };

  /* ---------- code listings ---------- */
  const SVKW = /\b(module|endmodule|input|output|logic|tri|assign|always_ff|always_comb|always_latch|always|posedge|negedge|if|else|case|casez|endcase|default|begin|end|typedef|enum|parameter|genvar|generate|endgenerate|for|initial|signed|assert|integer)\b/g;
  const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  /* SystemVerilog listing with keywords, numbers and // comments coloured. o.hl: line numbers (1-based) to highlight. */
  function sv(code, o = {}) {
    const lines = code.replace(/^\n/, "").split("\n").map((ln, i) => {
      const k = ln.indexOf("//"), body = k >= 0 ? ln.slice(0, k) : ln, cm = k >= 0 ? ln.slice(k) : "";
      let h = esc(body).replace(SVKW, '<span class="kw">$1</span>').replace(/(\d+'[bodh][0-9a-fA-FxzXZ_?]+|'[01])/g, '<span class="nm">$1</span>');

  }

  function listing(code, o = {}) {

      return o.hl && o.hl.includes(i + 1) ? `<span class="hl">${h}</span>` : h;
    });

  }

  /* ---------- series–parallel switch networks (static CMOS) ----------
     tree: "A" (one transistor driven by input A) | { s: [...] } (series) | { p: [...] } (parallel).
     v: { A: 0/1, ... }. isP: pMOS (ON when its input is 0). */
  const spOn = (t, v, isP) => (typeof t === "string" ? (isP ? !v[t] : !!v[t]) : t.s ? t.s.every((c) => spOn(c, v, isP)) : t.p.some((c) => spOn(c, v, isP)));

  const spCount = (t) => (typeof t === "string" ? 1 : (t.s || t.p).reduce((n, c) => n + spCount(c), 0));
  function spSize(t) {
    if (typeof t === "string") return { w: 50, h: 46 };
    const cs = (t.s || t.p).map(spSize);
    return t.s ? { w: Math.max(...cs.map((c) => c.w)), h: cs.reduce((a, c) => a + c.h, 0) } : { w: cs.reduce((a, c) => a + c.w, 0), h: Math.max(...cs.map((c) => c.h)) };
  }
  const ln = (x1, y1, x2, y2, cls) => `<line class="w${cls ? " " + cls : ""}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  /* Draw the network with its top terminal at (cx, y). */
  function spDraw(t, cx, y, v, isP) {
    const sz = spSize(t);
    if (typeof t === "string") {
      const on = isP ? !v[t] : !!v[t], cls = on ? "hl" : "dim";
      let s = ln(cx, y, cx, y + 8, cls) + `<rect x="${cx - 17}" y="${y + 8}" width="34" height="30" rx="5" style="fill:${on ? "var(--accent-soft)" : "var(--card)"};stroke:${on ? "var(--accent)" : "var(--line)"};stroke-width:2"/>` + ln(cx, y + 38, cx, y + 46, cls);
      s += S.t(cx + (isP ? 4 : 0), y + 28, t, { cls: on ? "b" : "m" });

    let s = "", x = cx - sz.w / 2;

    t.p.forEach((c) => { const cs = spSize(c), ccx = x + cs.w / 2; xs.push(ccx); s += spDraw(c, ccx, y, v, isP); if (cs.h < sz.h) s += ln(ccx, y + cs.h, ccx, y + sz.h); x += cs.w; });

  /* A static CMOS gate: pull-up (pMOS, default = dual of pd) from V_DD to Y, pull-down (nMOS) from Y to GND.
     Returns { svg, y } where y is 1, 0, "Z" (both off) or "X" (both on). */
  function cmosGate(pd, v, o = {}) {
    const pu = o.pu || spDual(pd), su = spSize(pu), sd = spSize(pd), W = Math.max(300, Math.max(su.w, sd.w) + 200), cx = W / 2 - 20;
    const upOn = spOn(pu, v, true), dnOn = spOn(pd, v, false), y = upOn && !dnOn ? 1 : dnOn && !upOn ? 0 : upOn ? "X" : "Z";
    const top = 34, yo = top + su.h + 14, bot = yo + 14 + sd.h;
    let s = `<line class="w" x1="${cx - 60}" y1="20" x2="${cx + 60}" y2="20" style="stroke-width:3"/>` + S.t(cx + 66, 25, "V_DD", { a: "start", cls: "s" }) + ln(cx, 20, cx, top);
    s += spDraw(pu, cx, top, v, true) + ln(cx, top + su.h, cx, yo) + ln(cx, yo, cx, yo + 14) + spDraw(pd, cx, yo + 14, v, false) + ln(cx, bot, cx, bot + 6) + S.gnd(cx, bot + 6);
    s += S.dot(cx, yo) + ln(cx, yo, cx + Math.max(su.w, sd.w) / 2 + 40, yo) + S.t(cx + Math.max(su.w, sd.w) / 2 + 46, yo + 6, "Y = " + y, { a: "start", cls: "big" + (y === "X" || y === "Z" ? " b" : "") });
    s += S.t(16, top + su.h / 2, "pull-up", { a: "start", cls: "s c" }) + S.t(16, top + su.h / 2 + 15, "(pMOS)", { a: "start", cls: "s m" }) + S.t(16, yo + 14 + sd.h / 2, "pull-down", { a: "start", cls: "s c" }) + S.t(16, yo + 14 + sd.h / 2 + 15, "(nMOS)", { a: "start", cls: "s m" });
    return { svg: S.svg(W, bot + 30, s, { max: W, label: "Static CMOS gate with ON transistors highlighted" }), y };
  }

  return { spOn, spDual, spCount, cmosGate, sv, listing, bits, uval, sval, flip, hex, bitRow, bitButtons, combos, truthTable, gate, wave, inverter, nand2, nor2, fsm, minimize, implText, implCovers };
})();
</script>
<script>
(function () {
  const { S, plot, slider, toggle, readout, fmt, si, el } = Course;
  const seenV = (html, href, where) => `<div class="key"><b>Seen earlier:</b> ${html} <a href="${href}">${where} →</a></div>`;
  const mathLink = (html, href, where) => `<p class="aside">${html} <a href="../math/${href}">${where} →</a></p>`;
  const fig = (s) => `<div class="fig">${s}</div>`;

  /* ---------- widgets ---------- */
  function capZ(host) {
    let C = 1e-6, L = 0.25e-9, R = 0.03;
    const out = el(`<div></div>`);
    const draw = () => {
      const Z = (lf) => { const w = 2 * Math.PI * 10 ** lf; const x = w * L - 1 / (w * C); return Math.log10(Math.sqrt(R * R + x * x)); };
      const fr = 1 / (2 * Math.PI * Math.sqrt(L * C));
      out.innerHTML = fig(plot({ x: [4, 10], y: [-3, 2], xt: [4, 5, 6, 7, 8, 9, 10], xtf: (v) => "10^" + v, yt: [-3, -2, -1, 0, 1, 2], ytf: (v) => "10^" + v, xl: "f (Hz)", yl: "|Z| (Ω)", h: 240, series: [{ f: Z, cls: "s1" }], marks: [{ x: Math.log10(fr), y: Math.log10(R), label: "self-resonance " + si(fr, "Hz", 2) }], label: "Impedance of a real bypass capacitor" })) +
        readout([["Below resonance", "behaves like C: |Z| = 1/(2πfC)"], ["At resonance", "|Z| = ESR = " + R + " Ω"], ["Above resonance", "behaves like an inductor: |Z| = 2πfL"]]);
    };
    host.append(slider({ id: "v13c", label: "C", min: 1e-9, max: 1e-4, log: true, value: C, show: (x) => si(x, "F", 2) }, (x) => { C = x; draw(); }).el,
      slider({ id: "v13l", label: "ESL", min: 1e-11, max: 1e-8, log: true, value: L, show: (x) => si(x, "H", 2) }, (x) => { L = x; draw(); }).el,
      slider({ id: "v13r", label: "ESR", min: 0.001, max: 0.3, log: true, value: R, show: (x) => fmt(x, 2) + " Ω" }, (x) => { R = x; draw(); }).el, out); draw();
  }
  function pllStep(host) {
    let zeta = 0.7;
    const out = el(`<div></div>`);
    const y = (t) => { // closed-loop phase step response of a type-2 PLL with ω_n = 1
      const z = zeta;
      if (Math.abs(z - 1) < 1e-6) return 1 - Math.exp(-t) * (1 - t);
      if (z < 1) { const wd = Math.sqrt(1 - z * z); return 1 - Math.exp(-z * t) * (Math.cos(wd * t) - (z / wd) * Math.sin(wd * t)); }
      const wp = Math.sqrt(z * z - 1); return 1 - Math.exp(-z * t) * (Math.cosh(wp * t) - (z / wp) * Math.sinh(wp * t));
    };
    const draw = () => {
      let peak = 0; for (let t = 0; t < 20; t += 0.01) peak = Math.max(peak, y(t));
      out.innerHTML = fig(plot({ x: [0, 15], y: [0, 1.6], xt: [0, 5, 10, 15], yt: [0, 0.5, 1, 1.5], xl: "ω_n t", yl: "Δφ_out / Δφ_in", h: 230, series: [{ f: () => 1, cls: "s4" }, { f: y, cls: "s1" }], label: "PLL response to a step in input phase" })) +
        readout([["Damping ζ", zeta.toFixed(2)], ["Peak", (100 * (peak - 1)).toFixed(0) + "% overshoot"], ["Verdict", zeta < 0.5 ? "rings: more jitter" : zeta <= 1.05 ? "the usual target range (0.7–1)" : "sluggish"]]);
    };
    host.append(slider({ id: "v13z", label: "Damping factor ζ", min: 0.2, max: 2, step: 0.05, value: zeta, show: (x) => x.toFixed(2) }, (x) => { zeta = x; draw(); }).el, out); draw();
  }
  function reflectWidget(host) {
    let ZL = 100;
    const out = el(`<div></div>`);
    const draw = () => {
      const Z0 = 50, g = isFinite(ZL) ? (ZL - Z0) / (ZL + Z0) : 1;
      out.innerHTML = readout([["Load Z<sub>L</sub>", isFinite(ZL) ? Math.round(ZL) + " Ω" : "open"], ["Reflection coefficient Γ = (Z<sub>L</sub> − Z<sub>0</sub>)/(Z<sub>L</sub> + Z<sub>0</sub>)", g.toFixed(2)], ["A 1 V incident wave reflects as", (g >= 0 ? "+" : "") + g.toFixed(2) + " V"], ["Meaning", Math.abs(g) < 0.02 ? "matched: no reflection" : g > 0 ? "same polarity: overshoot" : "inverted: undershoot"]]);
    };
    host.append(slider({ id: "v13zl", label: "Z_L (Z_0 = 50 Ω)", min: 0, max: 1000, step: 1, value: ZL, show: (x) => (x >= 1000 ? "open (∞)" : Math.round(x) + " Ω") }, (x) => { ZL = x >= 1000 ? Infinity : x; draw(); }).el, out); draw();
  }
  function deemph(host) {
    let a = 0, tau = 1.5;
    const out = el(`<div></div>`);
    const draw = () => {
      const tx = (t) => (t >= 1 && t < 2 ? 1 : t >= 2 && t < 3 ? -a : 0) * 1;
      const pts = []; let v = 0; const dt = 0.01;
      for (let t = 0; t <= 10; t += dt) { pts.push([t, v]); v += ((tx(t) - v) / tau) * dt; }
      const pk = Math.max(...pts.map((p) => p[1])), tailAt = pts.find((p) => p[0] >= 3.5)[1];
      out.innerHTML = fig(plot({ x: [0, 10], y: [-0.5, 1.1], xt: [0, 2, 4, 6, 8, 10], yt: [-0.5, 0, 0.5, 1], xl: "time (bit intervals)", yl: "V", h: 230, series: [{ f: tx, cls: "s3", n: 1000 }, { pts, cls: "s1" }], label: "One pulse through a lossy channel" })) +
        readout([["Received peak", pk.toFixed(2)], ["Leftover 1.5 bits later (ISI)", tailAt.toFixed(2)]]);
    };
    host.append(slider({ id: "v13t", label: "Channel loss (time constant)", min: 0.3, max: 3, step: 0.1, value: tau, show: (x) => x.toFixed(1) + " UI" }, (x) => { tau = x; draw(); }).el,
      slider({ id: "v13a", label: "De-emphasis α", min: 0, max: 0.8, step: 0.05, value: a, show: (x) => x.toFixed(2) }, (x) => { a = x; draw(); }).el, out); draw();
  }
  function vonNeumann(host) {
    let p = 0.8;
    const out = el(`<div></div>`);
    const draw = () => {
      let seed = 12345; const rnd = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
      const raw = Array.from({ length: 4000 }, () => (rnd() < p ? 1 : 0)), outb = [];
      for (let i = 0; i + 1 < raw.length; i += 2) if (raw[i] !== raw[i + 1]) outb.push(raw[i] === 0 ? 1 : 0);
      const ones = (a) => a.filter((x) => x).length / a.length;
      out.innerHTML = readout([["Raw bits that are 1", (100 * ones(raw)).toFixed(1) + "%"], ["Output bits kept", outb.length + " of " + raw.length + " (" + (100 * outb.length / raw.length).toFixed(0) + "%)"], ["Output bits that are 1", (100 * ones(outb)).toFixed(1) + "%"]]) + `<p class="mono" style="word-break:break-all">raw: ${raw.slice(0, 40).join("")}…<br>out: ${outb.slice(0, 40).join("")}…</p>`;
    };
    host.append(slider({ id: "v13p", label: "Bias of the noise source P(1)", min: 0.5, max: 0.95, step: 0.01, value: p, show: (x) => (100 * x).toFixed(0) + "%" }, (x) => { p = x; draw(); }).el, out); draw();
  }

  /* =============== PART 1 =============== */
  const p1 = {
    id: "p1", title: "Packages and how the chip connects to them", mins: 20,
    blurb: "From DIPs to flip-chip LGAs: connections, parasitics, and why half the pins carry power.",
    takeaway: "Special-purpose subsystems (packaging, power, clocks, PLLs, I/O, random circuits) are usually built by specialists or bought, but a digital designer must understand their impact. Ideal package: connects signals and power with little delay or distortion, removes heat, protects against mechanical and thermal-expansion stress, cheap to make and test; short, low-R, low-L wires. Options (Table 13.1): DIP (through-hole, 100 mil), PGA (through-hole array, low θ), SOIC, TSOP (DRAMs), PLCC (J-leads, socketable), QFP (fine-pitch SMT on four sides), BGA (solder-ball array, high density, low parasitics, special assembly), LGA (gold pads to a socket), CSP (≤ 1.2× die; flip-chip; mobile). Pitches in mils (25.4 µm); plastic is cheaper but removes less heat. Through-hole pins add inductance and limit density; SMT avoids this. Wire bonding: 25 µm gold wires to a peripheral pad frame at 100–200 µm pitch → a few hundred I/Os on 1 cm²; pad-limited chips. Lead frame, heat spreader; advanced packages are like PCBs with planes and controlled-impedance lines. Flip-chip / C4 (IBM 1960s): area array of solder bumps on top metal (wafer bumping), chip flipped and reflowed; no bond-wire inductance; ≤ 150 µm pitch → thousands of connections (Xeon: 13,164 bumps, mostly power/ground for 120 A); harder to probe for debug. Core i7 LGA: 1366 pads, bypass caps under the die. Package model: signal L, mutual L and C (crosstalk), V_DD/GND L and R, package bypass capacitors with their own parasitics.",
    steps: [
      { k: "learn", title: "What a package must do", b: [
        `<ul><li>Carry signals and power with little delay or distortion</li><li>Remove heat</li><li>Protect the die from damage and thermal-expansion stress</li><li>Be cheap to make and test</li></ul>`,
        `<p>Most of this means: <b>short, low-resistance, low-inductance</b> connections.</p>`,
      ]},
      { k: "learn", title: "A tour of packages", b: [
        `<div class="tbl"><table><tbody><tr><td>DIP, PGA</td><td>through-hole pins (100 mil); easy to socket; pins add inductance</td></tr><tr><td>SOIC, TSOP, QFP, PLCC</td><td>surface-mount leads on two or four sides</td></tr><tr><td><b>BGA</b></td><td>an array of solder balls underneath: many I/Os, low parasitics</td></tr><tr><td>LGA</td><td>like BGA but gold pads into a socket (desktop CPUs)</td></tr><tr><td>CSP</td><td>barely bigger than the die; phones</td></tr></tbody></table></div>`,
      ]},
      { k: "learn", title: "Wire bonds versus flip-chip", b: [
        `<div class="two"><div class="tile"><h3>Wire bonding</h3><p>Gold wires from a ring of pads round the edge. Pads 100–200 µm apart: a few hundred I/Os on a 1 cm² chip. Big I/O counts make a chip <b>pad-limited</b>. Each wire ≈ 1 nH/mm.</p></div><div class="tile"><h3>Flip-chip (C4)</h3><p>Solder bumps all over the top surface, chip flipped onto the package. ≤150 µm pitch: thousands of connections (a Xeon has 13,164 bumps, mostly power and ground for 120 A). ~100 pH each. But you can no longer probe the top metal.</p></div></div>`,
      ]},
      { k: "check", title: "Your turn", b: [
        { t: "num", q: "A 1 cm × 1 cm die with peripheral pads at 150 µm pitch. Roughly how many pads fit around the edge?", a: 267, tol: 0.03, why: "Perimeter 40 mm / 0.15 mm ≈ 267. An area array at the same pitch would allow (10/0.15)² ≈ 4400." },
      ]},
      { k: "learn", title: "The package is part of the circuit", b: [
        `<p>Every signal lead has inductance and couples to its neighbours (crosstalk). Power and ground leads add R and L in series with the supply. Package bypass capacitors help, but carry their own parasitics. Neglecting the package is one of the chapter's pitfalls.</p>`,
        seenV("Inductance and crosstalk.", "06-interconnect.html", "Chapter 6"),
      ]},
      { k: "say", title: "Say it back", b: [
        { t: "say", q: "Why have high-performance chips moved from wire bonding to flip-chip packaging?", model: "Wire bonding can only place pads around the chip's edge, limiting I/O count and making the long bond wires add significant inductance. Flip-chip puts solder bumps across the whole surface, giving thousands of short, low-inductance connections. Many of them can deliver power and ground right where the current is needed, which cuts supply noise and IR drop." },
      ]},
    ],
  };

  /* =============== PART 2 =============== */
  const p2 = {
    id: "p2", title: "Heat and temperature sensors", mins: 20,
    blurb: "A thermal Ohm's law, why forced air is running out, and measuring temperature with two bipolar transistors.",
    takeaway: "A 60 W bulb spreads heat over ~120 cm²; a 150 W CPU over 1.6 cm²: 180× the power density. Heat flows junction → substrate → package → heat sink → air (convection). Thermal Ohm's law: ΔT = θ_ja·P (EQ 13.1), θ_ja = θ_jp + θ_pa (EQ 13.2); θ_pa usually dominates in cheap packages. Still air ≈ 0.001 W/(cm²·°C) → 10 cm² package ≈ 100 °C/W (~1 W max); forced air 0.01–0.03 W/(cm²·°C). 72-pin ceramic PGA θ_pa: 34 °C/W still air, 18 at 400 ft/min, 10 with a good heat sink; liquid cooling down to 0.3 °C/W; microchannels promising. Example 13.1: θ_ja = 0.9 + 0.1 + 4.0 = 5 °C/W, ΔT = 100 − 55 = 45 °C → 9 W. Practical low-cost limit grew from ~8 W (1985) to ~130 W (2008); forced air is near its limit. Temperature sensors at hot spots drive DVFS or throttling. Bipolar: I_c = I_s e^(qV_BE/kT); V_BE depends on I_s (temperature-dependent), but ΔV_BE between identical transistors at currents mI and I is (kT/q) ln m: proportional to absolute temperature (PTAT). Built from the parasitic vertical pnp (p+ diffusion / n-well / p-substrate); diodes suffer recombination errors. Example 13.2: m = 10 → (k/q) ln 10 = 198 µV/K. Nonlinearity → calibrate at a known temperature (1 s calibration ≈ 0.5 °C accuracy; two-point too slow); I ≈ 1 µA.",
    steps: [
      { k: "learn", title: "Thermal Ohm's law", b: [
        `<p>Heat flow is like current, temperature difference like voltage:</p>`,
        `<p class="eq">ΔT = θ<sub>ja</sub> · P &nbsp;&nbsp; θ<sub>ja</sub> = θ<sub>jp</sub> + θ<sub>pa</sub></p>`,
        `<p>θ in °C/W. Junction-to-package θ<sub>jp</sub> is small; package-to-air θ<sub>pa</sub> usually dominates. A heat sink and fan attack θ<sub>pa</sub>.</p>`,
      ]},
      { k: "learn", title: "Example 13.1", b: [
        `<p>A BGA with a passive heat sink in a box with a fan: θ<sub>jp</sub> = 0.9, adhesive 0.1, heat sink 4.0 °C/W. Ambient up to 55 °C; junction limit 100 °C.</p>`,
        `<p class="eq">P<sub>max</sub> = (100 − 55) / (0.9 + 0.1 + 4.0) = 45 / 5 = 9 W</p>`,
      ]},
      { k: "check", title: "Your turn", b: [
        { t: "num", q: "Still air removes about 0.001 W/(cm²·°C). What is θ_pa (°C/W) for a package with 25 cm² of surface?", a: 40, tol: 0.01, why: "1 / (0.001 × 25) = 40 °C/W: about 1–2 W before it gets too hot." },
      ]},
      { k: "learn", title: "Cooling is running out", b: [
        `<p>A 150 W processor on 1.6 cm² has 180× the power density of a light bulb. Practical cheap cooling grew from ~8 W (1985) to ~130 W (2008), and forced air is near its limit. That cap on power shapes everything from Chapter 5 onward.</p>`,
        seenV("Why power limits performance.", "05-power.html", "Chapter 5"),
      ]},
      { k: "learn", title: "A thermometer from two transistors", b: [
        `<p>A bipolar transistor's V<sub>BE</sub> depends on temperature in a messy way. But run two identical ones at currents mI and I, and the messy part cancels:</p>`,
        `<p class="eq">ΔV<sub>BE</sub> = (kT/q) ln m</p>`,
        `<p>Exactly proportional to absolute temperature (PTAT). Every CMOS process has a parasitic vertical pnp to use. Chips put these sensors at hot spots to throttle or lower V<sub>DD</sub> before overheating.</p>`,
        mathLink("Exponentials and logarithms:", "08-exp-log.html", "Math 8"),
      ]},
      { k: "check", title: "Example 13.2", b: [
        { t: "num", q: "Current ratio m = 10. Temperature coefficient of ΔV_BE in µV/K? (k/q = 86.17 µV/K)", a: 198, tol: 0.01, why: "86.17 µV/K × ln 10 = 86.17 × 2.303 ≈ 198 µV/K." },
      ]},
      { k: "say", title: "Say it back", b: [
        { t: "say", q: "Why measure the difference of two V_BE values instead of one V_BE?", model: "A single V_BE depends on the saturation current I_s, which varies strongly and unpredictably with temperature and processing. Two matched transistors have the same I_s, so in the difference of their V_BE values it cancels, leaving (kT/q) times the log of their current ratio. That's a clean voltage proportional to absolute temperature." },
      ]},
    ],
  };

  /* =============== PART 3 =============== */
  const p3 = {
    id: "p3", title: "Power distribution: IR, L di/dt, bypass capacitance", mins: 25,
    blurb: "Keep V_DD within ±10% while the current jumps by tens of amps. The worked examples show why grids and decoupling capacitors are essential.",
    takeaway: "Power distribution: on-chip wires, package, board, bypass capacitors. Goals: stable voltage, average and peak current, signal return paths, no electromigration or self-heating, little area, easy layout; noise target typically ±10%. Power varies over many time scales (operations, clock edges, clock gating). Noise sources: IR drop and L di/dt. On-chip: cell power buses (e.g., 8λ metal1) connected by abutment; small designs strap rows; large ones use a grid on all metal layers with top metal carrying most current, many vias; interdigitate with signals for return paths; mirror alternate rows. Pad-ring supplies give worst IR drop at the chip center; C4 bumps deliver current where needed. IR: on-chip resistance dominates; well-bypassed grids need only carry the average current. Example 13.3: 64 repeaters on a 320 µm × 1 µm metal2 bus (0.05 Ω/□ → 16 Ω), each drawing C·ΔV/Δt = 0.4 pF × 1.8 V / 200 ps = 3.6 mA → 64IR/2 = 1.85 V (impossible: in reality ~30% droop and doubled delay); give each repeater its own grid wire. L di/dt: bond wire ~1 nH/mm, C4 ~100 pH; packages devote ≥ 50% of pins to power; transients from I/O switching and idle↔active changes. Example 13.4: 20 A → 60 A in 1 ns through 20 pH → 0.8 V; some chips ramp power over many cycles. Bypass (decoupling) capacitance supplies current locally: Example 13.5: 40 A for 1 ns with 0.2 V droop → C = IΔt/ΔV = 200 nF. Symbiotic bypass: about half of all quiescent gate capacitance; Example 13.6: 1 fF/µm, 9% gate coverage → 0.045/f nF/mm² ≈ 0.7 nF/mm² at 65 nm. High-power chips add explicit decaps (Niagara2: 700 nF), nMOS with gate to V_DD; thick oxide to cut gate leakage (Rock: −20% density).",
    steps: [
      { k: "learn", title: "Two kinds of supply noise", b: [
        `<p>The target: V<sub>DD</sub> within about <b>±10%</b> everywhere, always.</p>`,
        `<div class="two"><div class="tile"><h3>IR drop</h3><p>Current through the resistance of the on-chip grid (and pins, package, board). Worst where wires are longest.</p></div><div class="tile"><h3>L di/dt</h3><p>A changing current through the inductance of bumps, bond wires and package. Worst when activity jumps.</p></div></div>`,
        seenV("Supply noise as a variation source.", "07-robustness.html", "Chapter 7"),
      ]},
      { k: "learn", title: "Example 13.3: a starved row of repeaters", b: [
        `<p>64 repeaters share one metal2 power bus, 320 µm × 1 µm at 0.05 Ω/□: R = 16 Ω. Each repeater drives 0.4 pF with a 200 ps edge:</p>`,
        `<p class="eq">I = C·ΔV/Δt = 0.4 pF × 1.8 V / 200 ps = 3.6 mA</p>`,
        `<p>Distributed along the wire, the droop is about 64·I·R/2 = <b>1.85 V</b>: more than V<sub>DD</sub>! In reality the repeaters starve, droop ~30%, and run twice as slow. The fix: a <b>grid</b>, so each repeater gets its own supply wire.</p>`,
      ]},
      { k: "check", title: "Example 13.4", b: [
        { t: "num", q: "A 1 GHz chip jumps from 20 A to 60 A in one cycle. Supply inductance 20 pH, no on-chip bypass. L·di/dt noise in volts?", a: 0.8, tol: 0.01, why: "di/dt = 40 A / 1 ns = 4×10¹⁰ A/s; × 20 pH = 0.8 V. Hopeless at a 1 V supply." },
      ]},
      { k: "learn", title: "Bypass capacitors", b: [
        `<p>Capacitance between V<sub>DD</sub> and GND, spread across the chip, supplies sudden current locally, before any inductance has to respond:</p>`,
        `<p class="eq">C = I·Δt / ΔV</p>`,
        `<p>Example 13.5: 40 A for 1 ns with at most 0.2 V droop needs <b>200 nF</b>.</p>`,
      ]},
      { k: "learn", title: "Free capacitance", b: [
        `<p>Every quiescent gate is a capacitor between a node held at V<sub>DD</sub> and one at GND. About <b>half</b> of all gate capacitance works as <b>symbiotic bypass</b> at any moment.</p>`,
        `<p>Example 13.6: gate capacitance 1 fF/µm, gates cover 9% of the area → 0.045/f nF/mm², ≈ 0.7 nF/mm² at f = 65 nm.</p>`,
        `<p>High-power chips add explicit decaps (Niagara2: 700 nF): nMOS transistors with gate on V<sub>DD</sub>, source and drain on GND. Thick oxide reduces their leakage at some loss of density.</p>`,
      ]},
      { k: "check", title: "Your turn", b: [
        { t: "num", q: "A 1 cm² die at 65 nm with 0.7 nF/mm² of symbiotic bypass. Total, in nF?", a: 70, tol: 0.01, why: "100 mm² × 0.7 nF/mm² = 70 nF. Compare Example 13.5's 200 nF for a 40 A spike: high-power chips need explicit decaps." },
      ]},
      { k: "say", title: "Say it back", b: [
        { t: "say", q: "Why does a well-bypassed power grid only need low enough resistance for the average current?", model: "Sudden current spikes, for example at clock edges, are supplied by nearby bypass capacitance, which then recharges slowly between spikes. So the grid's resistance only has to deliver the average current without excessive IR drop, not the peak current." },
      ]},
    ],
  };

  /* =============== PART 4 =============== */
  const p4 = {
    id: "p4", title: "Supply impedance, droops, and odd jobs", mins: 25,
    blurb: "A target impedance, capacitors that turn into inductors, three droops, and then supply filters, charge pumps, substrate noise and energy scavenging.",
    takeaway: "Lumped model (Figure 13.10): regulator, bulk cap, board planes, ceramic caps, package and pins, package caps, bumps, on-chip caps, current source; external caps have ESR and ESL (bigger caps → more ESL); each stage toward the regulator ~10× more C and ~10× more L (e.g., 1 µF on die, 10s of µF package, 100s of µF board, 1 mF regulator; ~1 pH die–package, 10 pH package–board, 100 pH board–regulator; fractions of mΩ). Target impedance Z = rV_DD²/P (EQ 13.10): 1.0 V, 100 W, 10% → 1 mΩ; falls quadratically with V_DD and with power; drove flip-chip packages, more metal and on-chip decap. Without bypass, Z = R + jωL is too high above ~1 MHz. Capacitor with ESR/ESL: Z = 1/(jωC) + R + jωL (EQ 13.11), minimum R at f = 1/(2π√LC) (EQ 13.12): 1 µF, 0.25 nH, 0.03 Ω → 10 MHz. Use many capacitor sizes; bulk/ceramic 1–10 MHz, package 10–200 MHz, above a few hundred MHz only on-chip decap works; Pentium 4 impedance peak near 100 MHz from the package. Step response: first droop (on-chip caps drain until bump current rises; ringing from bump L), second droop (package caps), third droop (board caps) before the regulator catches up; minimize with enough low-ESL caps at each stage. Pentium 4 experiment: removing decap raised first droop by 8% V_DD but slowed frequency only 1% (noise modulates the clock in a way that tracks the path). Distributed mesh models: SPICE netlists, days of simulation, maps of droop (Itanium 2 IEU). Supply filtering: RC filter with one wire/bump + big capacitor for PLLs, clock buffers, analog (Pentium 4 clock buffers: pMOS resistor, 2.5 ns RC, 70 mV IR drop, noise 10% → 2%). Charge pumps (Dickson): nodes pumped by alternating nonoverlapping clocks through capacitors and diode-connected nMOS; V_out ≈ N[(C·V_DD/(C + C_s)) − V_t − I_out/(f(C + C_s))] (EQ 13.13); negative pumps with pMOS (bodies to GND); for Flash 20 V or negative body bias. Substrate noise: coupling through junctions and impact ionization modulates V_t via body effect; hurts mixed-signal; plenty of substrate/well contacts, guard rings, separation, quiet analog supplies, triple-well or SOI. Energy scavenging: solar, thermoelectric, piezoelectric, RF (RFID): tens–hundreds of µW/cm²; thin-film microbatteries ~100 µW·h/cm².",
    steps: [
      { k: "learn", title: "A target impedance", b: [
        `<p>If the chip draws P watts and supply noise must stay below r·V<sub>DD</sub>, the supply network's impedance must be below</p>`,

        `<p>1.0 V, 100 W, 10% → <b>1 mΩ</b>, at every frequency the chip's current contains. Lower voltage and higher power both shrink it quadratically/linearly.</p>`,

      { k: "play", title: "Real capacitors aren't capacitors", b: [
        `<p>Every capacitor has series resistance (ESR) and inductance (ESL). Above its self-resonant frequency it behaves like an inductor. Predict: bigger C moves the dip which way?</p>`,
        capZ,
        `<p>So a supply uses many sizes, each covering a frequency band: bulk and ceramic caps 1–10 MHz, package caps 10–200 MHz, and above a few hundred MHz only <b>on-chip</b> capacitance helps, because the bumps' inductance blocks everything else.</p>`,

        `<p class="aside">A surprise from the book: Pentium 4 wafers built without decap had an 8% deeper first droop but ran only 1% slower, because the noise stretched the clock period along with the logic delay.</p>`,

        `<div class="tbl"><table><tbody>

          <tr><td><b>Charge pump</b></td><td>capacitors pumped by two clock phases ratchet a node above V<sub>DD</sub> (Flash's 20 V) or below GND (body bias).</td></tr>

  const p5 = {
    id: "p5", title: "Clocks: skew, its sources, and clock generation", mins: 20,
    blurb: "What clock skew really means, where it comes from, and why chips use a PLL or DLL as a zero-delay buffer.",
    takeaway: "Clocks must reach latches, flops, memories and dynamic gates at nearly the same time; the challenge is skew vs power, metal and design effort. Logical clocks (ideal, HDL) vs physical clocks (actual, skewed). Distribute a single global clock; local clock gaters (buffers, enable ANDs, inverters, pulse generators) make the physical clocks over short wires. Skew = difference between nominal and actual interarrival times (Figure 13.18: clk1 arrives 25 ps before clk2 → 25 ps skew; with 30 ps intentional delay, skew is 5 ps; prefer “intentional delay” over “intentional skew”). Skew between different edges and across cycles (Figure 13.19); hold checks use the same edge, setup checks the next cycle's edge; networks add more skew cycle-to-cycle. Skew budget: larger than any actual skew on any working chip, but no larger. Clock domains (e.g., within 500 µm) get local vs global budgets. Sources: systematic (nominal mismatch, predictable by simulation, tunable), random (manufacturing; could be calibrated once), drift (slow environmental, e.g., temperature; needs periodic recalibration), jitter (high-frequency, mainly supply noise; can't be compensated). Clock system: external clock → pads → generation (PLL/DLL) → global distribution → gaters → elements. Pad, buffer and gater delay (0.5–1 ns on a large chip) varies with PVT and noise, desynchronizing internal and external clocks; PLLs and DLLs regulate the delay to an integer number of periods: zero-delay buffers. Phase detector → loop filter → oscillator (PLL: adjusts frequency, hence phase) or delay line (DLL: adjusts delay). PLL can multiply frequency (divider N in feedback, M in input: f_out = (N/M)f_in); its loop filter is more complex. Bandwidth (fast response to supply noise vs slow to reject input jitter) and stability; PLLs need more care.",

        `<div class="two"><div class="tile"><h3>PLL</h3><p>Adjusts an oscillator's <i>frequency</i> (and so its phase). Can multiply frequency: f<sub>out</sub> = (N/M)·f<sub>in</sub>. Harder to keep stable.</p></div><div class="tile"><h3>DLL</h3><p>Adjusts a delay line. Simpler and more stable, but can't change frequency.</p></div></div>`,

    takeaway: "Clock wire RC across a 15 mm die ≈ 1 ns, so routing must equalize flight time; random skew, drift and jitter scale with distribution delay, so keep it short. Network styles (Restle98): grids (mesh of horizontal and vertical wires driven from the middle or edges), H-trees (recursive H from the center, equal wire lengths), spines (rows of buffers driving length-matched serpentines), ad hoc (tools balance nominal delays; ASICs at hundreds of MHz), and hybrids (H-tree driving many points of a grid). Itanium 2: modified H-tree with differential primary driver and repeaters, custom-routed to second-level clock buffers (SLCBs) with adjustable delay, few stages, filtered supply. Pentium II/III two spines, Pentium 4 three spines feeding 47 gated domains with adjustable delay buffers. IBM Power4/PowerPC/S/390: primary H-tree to 16–64 sector buffers, tunable trees driving the global grid at up to 1024 points. Layout: uniform and fast; 10% variation on an 800 ps tree = 80 ps jitter, on 1600 ps = 160 ps; thick top metal, shielded with V_DD/GND, model as transmission lines (field solver), split wide wires interdigitated with returns. Gaters: < 1 mm output wires; short gater delay limits skew; crisp edges (fanout ≤ 4); matching a 2-inverter clk path to a 3-inverter clkb path: equal second-stage effort (h2 = hb) keeps them matched in all corners; minimum delay with h_a = h_c = h* = 1 + √(1 + p_inv) (EQ 13.16) → h1 = h*² ≈ 5.8, h2 = hb = F/5.8, ha = hc ≈ 2.4 for p_inv = 1; or inverter + TG vs two inverters. Skew budgets: ignore (conservative hold, slow flops), worst-case everywhere (design to T_c − skew, e.g., 3.5 ns for 4 ns), or multiple local/global budgets below ~25 FO4 cycles (needs a good timing analyzer). Separate setup (include cycle-to-cycle jitter) and hold budgets. Worst-case sum too pessimistic; sources aren't Gaussian (RSS inappropriate); Monte Carlo; hold budget so 95–99% of chips pass; include data-path variation. In practice ~10% of cycle; published measurements (avg 3.2%) are optimistic. Adaptive deskewing: digitally adjustable delay lines (thermometer-coded), phase comparators (Pentium II loop; Pentium 4 via scan: 46 comparators, skew ~64 ps → ±8 ps; Itanium 2 blows fuses at test); extra delay adds jitter unless supplies are filtered.",
