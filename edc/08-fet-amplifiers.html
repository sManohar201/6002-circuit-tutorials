<style>

/* Layout: a chapter map (hub) that opens one part at a time; each part is a rail of single-card steps on graph paper. */
:root {
  --paper: #eaf0f4;
  --grid: rgba(40, 90, 140, 0.08);
  --card: #ffffff;
  --ink: #142238;
  --muted: #56677d;
  --line: #d2dce6;
  --accent: #e39a0b;
  --accent-soft: #fdf1d8;
  --accent-ink: #7a4d00;
  --cool: #2b67a3;
  --cool-soft: #e1ecf7;
  --good: #1d8656;
  --good-soft: #def4e9;
  --bad: #c2412a;
  --bad-soft: #fbe5e0;
  --on-accent: #1b1300;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1520; --grid: rgba(120, 170, 220, 0.07); --card: #16212f; --ink: #e5edf6; --muted: #98a8bc;
    --line: #2a3a4e; --accent: #f3b53c; --accent-soft: #3a2d10; --accent-ink: #f8d68f; --cool: #7db3ea;
    --cool-soft: #15283d; --good: #43c88d; --good-soft: #123426; --bad: #f2735a; --bad-soft: #3d1c16;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1520; --grid: rgba(120, 170, 220, 0.07); --card: #16212f; --ink: #e5edf6; --muted: #98a8bc;
  --line: #2a3a4e; --accent: #f3b53c; --accent-soft: #3a2d10; --accent-ink: #f8d68f; --cool: #7db3ea;
  --cool-soft: #15283d; --good: #43c88d; --good-soft: #123426; --bad: #f2735a; --bad-soft: #3d1c16;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.55;
}
.wrap {
  max-width: 700px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
  display: grid; gap: 16px;
}
header.top { display: grid; gap: 10px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.eyebrow button { font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--cool); background: none; border: 0; padding: 0; cursor: pointer; }
.eyebrow a.book-link { color: var(--cool); text-decoration: none; }
.eyebrow a.book-link:hover, .eyebrow a.book-link:focus-visible { text-decoration: underline; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 6.5vw, 40px); line-height: 1.05; margin: 0; text-wrap: balance; }
.rail { display: flex; gap: 5px; align-items: center; }
.rail button { flex: 1; height: 8px; border-radius: 4px; border: 0; padding: 0; cursor: pointer; background: var(--line); }
.rail button.done { background: var(--accent); opacity: 0.5; }
.rail button.now { background: var(--accent); }
.rail button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.where { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.where b { color: var(--ink); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 20px; display: grid; gap: 16px; min-width: 0; }
.card > * { min-width: 0; }
.card h2 { font-family: var(--display); font-weight: 600; font-size: 24px; line-height: 1.18; margin: 0; text-wrap: balance; }
.card h3 { font-family: var(--display); font-weight: 600; font-size: 19px; margin: 0; }
.card p { margin: 0; max-width: 62ch; }
.card ul, .card ol { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.tag { justify-self: start; font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--line); color: var(--ink); }
.k-predict, .k-play { background: var(--accent-soft); color: var(--accent-ink); }
.k-why, .k-math { background: var(--cool-soft); color: var(--cool); }
.k-bug { background: var(--bad-soft); color: var(--bad); }
.k-whatif, .k-check { background: var(--good-soft); color: var(--good); }
.k-say { background: transparent; color: var(--ink); border: 1px solid var(--ink); }

.mono, code { font-family: var(--mono); font-weight: 700; font-size: 0.92em; }
.eq { font-family: var(--mono); font-weight: 700; font-size: clamp(20px, 5.4vw, 28px); text-align: center; padding: 8px 0; overflow-x: auto; }
.eq .a { color: var(--accent); }
.key { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 10px 10px 0; }
.key b { color: var(--accent-ink); }
.aside { font-size: 15px; color: var(--muted); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.two > * { min-width: 0; }
.tile { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; }
.tile h3 { font-size: 17px; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 16px; }
.tbl th, .tbl td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
.tbl th { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* controls */
.btn { font: inherit; font-size: 16px; padding: 10px 16px; border-radius: 10px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn.ghost { background: transparent; }
.btn.small { font-size: 14px; padding: 6px 12px; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); font-weight: 700; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn:focus-visible, input:focus-visible, textarea:focus-visible, .hit:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.choices { display: grid; gap: 8px; }
.choice { text-align: left; width: 100%; }
.choice.right { border-color: var(--good); background: var(--good-soft); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.q { display: grid; gap: 10px; }
.qq { font-weight: 700; }
.feedback { border-radius: 10px; padding: 12px 14px; font-size: 16px; background: var(--paper); border: 1px solid var(--line); }
.feedback.ok { background: var(--good-soft); border-color: var(--good); }
.feedback.no { background: var(--bad-soft); border-color: var(--bad); }
.num { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.num input { font: inherit; font-family: var(--mono); font-size: 19px; width: 8em; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
textarea { font: inherit; font-size: 17px; width: 100%; min-height: 96px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); resize: vertical; }
select { font: inherit; font-family: var(--mono); font-size: 15px; max-width: 100%; padding: 8px 10px; margin: 4px 0 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.model { border: 2px dashed var(--good); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.model .lbl { font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--good); }
.sort { display: grid; gap: 8px; }
.sort-item { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.sort-item > span { min-width: 0; }
.sort-item.right { border-color: var(--good); background: var(--good-soft); }
.sort-item.wrong { border-color: var(--bad); background: var(--bad-soft); }
.sort-item .why { grid-column: 1 / -1; font-size: 15px; }
@media (max-width: 480px) { .sort-item { grid-template-columns: 1fr; } }

/* sliders + readouts */
.sliders { display: grid; gap: 10px; }
.sl { display: grid; gap: 2px; }
.sl label { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; color: var(--muted); }
.sl output { font-family: var(--mono); font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.sl input[type="range"] { width: 100%; accent-color: var(--accent); }
.readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.readout > div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--paper); min-width: 0; }
.readout span { display: block; font-size: 13px; color: var(--muted); }
.readout b { font-family: var(--mono); font-size: 19px; font-variant-numeric: tabular-nums; }
.verdict { justify-self: start; font-weight: 700; font-size: 15px; padding: 4px 14px; border-radius: 999px; }
.verdict.ok { background: var(--good-soft); color: var(--good); }
.verdict.mid { background: var(--accent-soft); color: var(--accent-ink); }
.verdict.no { background: var(--bad-soft); color: var(--bad); }

/* schematics + plots */
.fig { overflow-x: auto; }
.sch, .plot { width: 100%; height: auto; display: block; margin: 0 auto; }
.sch .w { stroke: var(--ink); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.sch .w.hl { stroke: var(--accent); stroke-width: 3.5; }
.sch .w.dim { stroke: var(--line); }
.sch .el { fill: var(--card); stroke: var(--ink); stroke-width: 2.5; }
.sch .el.hl { stroke: var(--accent); stroke-width: 3.5; }
.sch .nd { fill: var(--ink); }
.sch text { fill: var(--ink); font-family: var(--mono); font-size: 14px; }
.sch text.s { font-size: 12px; }
.sch text.big { font-size: 18px; font-weight: 700; }
.sch .m { fill: var(--muted); }
.sch .a { fill: var(--accent-ink); }
.sch .c { fill: var(--cool); }
.sch .g { fill: var(--good); }
.sch .b { fill: var(--bad); }
.sch .cur { stroke: var(--cool); stroke-width: 2.2; fill: none; }
.sch .curh { fill: var(--cool); }
.sch .flow { stroke: var(--accent); stroke-width: 4; fill: none; stroke-dasharray: 3 13; stroke-linecap: round; animation: flow var(--dur, 1s) linear infinite; }
.sch .zone { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 4; }
.sch .box { fill: var(--paper); stroke: var(--ink); stroke-width: 2.5; }
.sch .hit { cursor: pointer; fill: transparent; stroke: transparent; stroke-width: 18; }
@keyframes flow { to { stroke-dashoffset: -16; } }
.plot .grid { stroke: var(--line); stroke-width: 1; }
.plot .axis { stroke: var(--muted); stroke-width: 1.5; }
.plot text { fill: var(--muted); font-family: var(--mono); font-size: 12px; }
.plot text.lab { fill: var(--ink); font-size: 13px; font-weight: 700; }
.plot .s1 { stroke: var(--accent); stroke-width: 3; fill: none; }
.plot .s2 { stroke: var(--cool); stroke-width: 3; fill: none; }
.plot .s3 { stroke: var(--good); stroke-width: 3; fill: none; }
.plot .s4 { stroke: var(--bad); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.plot .s5 { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 4 4; }
.plot .ar1 { fill: var(--accent); opacity: 0.22; }
.plot .ar2 { fill: var(--cool); opacity: 0.18; }
.plot .ar3 { fill: var(--good); opacity: 0.16; }
.plot .mk { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
.plot .mk2 { fill: var(--cool); stroke: var(--card); stroke-width: 2; }
.plot .mkb { fill: var(--bad); stroke: var(--card); stroke-width: 2; }

/* hub */
.parts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.part-btn { width: 100%; text-align: left; display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.part-btn:hover { border-color: var(--ink); }
.part-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.part-btn > span { min-width: 0; }
.part-n { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-weight: 700; border: 2px solid var(--line); }
.part-btn.done .part-n { background: var(--good); border-color: var(--good); color: var(--card); }
.part-btn.next .part-n { border-color: var(--accent); color: var(--accent-ink); }
.part-t { font-weight: 700; display: block; }
.part-d { font-size: 15px; color: var(--muted); display: block; }
.part-m { font-family: var(--mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
.after { border: 2px solid var(--ink); border-radius: 14px; padding: 16px 18px; display: grid; gap: 8px; background: var(--card); }

nav.bottom { display: flex; justify-content: space-between; gap: 8px; }
nav.bottom .btn { min-width: 120px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
.ov { text-decoration: overline; }
.bits { display: flex; flex-wrap: wrap; gap: 6px; }
.bits .btn { min-width: 44px; font-family: var(--mono); font-weight: 700; }

/* code (HDL and assembly listings) */
pre.code { font-family: var(--mono); font-size: 14px; line-height: 1.5; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 0; overflow-x: auto; white-space: pre; color: var(--ink); }
pre.code .kw { color: var(--accent-ink); font-weight: 700; }
pre.code .cm { color: var(--muted); font-style: italic; }
pre.code .nm { color: var(--cool); }
pre.code .hl { background: var(--accent-soft); border-radius: 4px; }
code { font-family: var(--mono); font-size: .92em; background: var(--paper); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
</style>

   adds the shared helpers and sets window.BOOK to the book this page belongs to (window.BOOK_KEY). */
(function () {
  const all = window.BOOKS || {};
  Object.values(all).forEach((B) => {
    B.all = () => B.groups.flatMap((g) => g.items);
    B.chapters = () => B.all().filter((c) => typeof c.n === "number");
    B.find = (id) => B.all().find((c) => c.id === id);
    B.pdfName = (c) => B.pdfFile || B.pdfPrefix + c.pdf + ".pdf"; /* one-file books name the whole PDF */
    /* "pp. 26–75" for books whose file names are PDF pages, "pp. 1–54" (printed pages) when a chapter lists `pages`. */
    B.pagesLabel = (c) => (c.pages ? "book pp. " + c.pages : "pp. " + c.pdf).replace("-", "–") + (B.pdfFile && c.pages ? ", PDF pp. " + c.pdf.replace("-", "–") : "");
    B.probsLabel = (c) => (c.probs ? `page ${c.probs} of that PDF${c.probsBook && c.probsBook !== c.probs ? ` (book page ${c.probsBook})` : ""}` : "");
  });
  window.BOOK = all[window.BOOK_KEY] || null;
})();

<script>
/* Progress store shared by the contents page and every chapter page.
   Each chapter's state is { done: {p1: true}, last: {part, step} | null, say: {key: text}, t: ms }.
   It lives in two places:
     - localStorage "course-<id>": instant first paint, and the fallback when nothing else works.
     - the artifact's db, at data/users/<viewer id>/<chapter id>: private to the viewer, follows them
       across browsers and sessions. Only available when the page runs inside the claude.ai viewer. */
window.Progress = (function () {
  const LKEY = (id) => "course-" + id;
  const local = {
    get(id) { try { const v = localStorage.getItem(LKEY(id)); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
    set(id, v) { try { localStorage.setItem(LKEY(id), JSON.stringify(v)); } catch (e) {} },
  };
  const blank = () => ({ done: {}, last: null, say: {}, t: 0 });
  const norm = (s) => Object.assign(blank(), s || {}, { done: Object.assign({}, s && s.done), say: Object.assign({}, s && s.say) });

  /* Combine two copies: parts finished anywhere stay finished; the newer copy wins for position and text. */
  function merge(a, b) {
    a = norm(a); b = norm(b);
    const [old, neu] = a.t >= b.t ? [b, a] : [a, b];
    return { done: Object.assign({}, old.done, neu.done), last: neu.last, say: Object.assign({}, old.say, neu.say), t: neu.t };
  }
  const same = (a, b) => JSON.stringify(norm(a)) === JSON.stringify(norm(b));

  /* ---------- cloud ---------- */
  let status = "local"; // "local" | "cloud"
  const statusFns = [];
  const setStatus = (s) => { status = s; statusFns.forEach((f) => f(s)); };
  const cloud = (async () => {
    try {
      if (!window.claude || !window.claude.use) return null;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return null;
      const uid = await user.id();
      if (!uid) return null;
      const col = db.collection("data/users/" + uid);
      await col.limit(1).get(); // proves the store answers before we claim "saved to your account"
      setStatus("cloud");
      return col;
    } catch (e) { return null; }
  })();

  /* One write in flight per chapter; bursts collapse into the latest state. */
  const pending = {}, busy = {};
  async function flush(id) {
    const col = await cloud;
    if (!col || busy[id] || !pending[id]) return;
    busy[id] = true;
    const body = pending[id]; pending[id] = null;
    try { await col.doc(id).set(body); }
    catch (e) {
      if (e && e.code === "unavailable") { pending[id] = pending[id] || body; setTimeout(() => flush(id), 1500 + Math.random() * 1500); }
      else if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) setStatus("local");
    }
    busy[id] = false;
    if (pending[id]) flush(id);
  }
  const timers = {};
  function push(id, state, delay) {
    pending[id] = JSON.parse(JSON.stringify(norm(state)));
    clearTimeout(timers[id]);
    timers[id] = setTimeout(() => flush(id), delay);
  }

  return {
    /* Synchronous best guess from this browser. */
    load(id) { return norm(local.get(id)); },
    /* Save locally now, to the account shortly after. `delay` batches typing. */
    save(id, state, delay = 400) {
      state.t = Date.now();
      local.set(id, state);

    onStatus(fn) { statusFns.push(fn); fn(status); },

    });
    (o.texts || []).forEach((tx) => { s += `<text class="lab" x="${X(tx.x)}" y="${Y(tx.y)}" text-anchor="${tx.a || "start"}">${tx.s}</text>`; });
    return `<svg class="plot" viewBox="0 0 ${W} ${H}" style="max-width:${W}px" role="img" aria-label="${o.label || "Graph"}">${s}</svg>`;
  }

  /* ---------- UI helpers for widgets ---------- */
  function slider(o, onChange) {
    const wrap = el(`<div class="sl"><label for="${o.id}"><span>${o.label}</span><output></output></label><input type="range" id="${o.id}"></div>`);
    const inp = wrap.querySelector("input"), out = wrap.querySelector("output");
    if (o.log) { inp.min = 0; inp.max = 1000; inp.step = 1; }
    else { inp.min = o.min; inp.max = o.max; inp.step = o.step || (o.max - o.min) / 100; }
    const toT = (v) => (1000 * Math.log(v / o.min)) / Math.log(o.max / o.min);
    const get = () => (o.log ? o.min * Math.pow(o.max / o.min, inp.value / 1000) : +inp.value);
    const show = () => { out.textContent = o.show ? o.show(get()) : fmt(get()); };
    inp.value = o.log ? toT(o.value) : o.value;
    show();
    inp.addEventListener("input", () => { show(); onChange && onChange(get()); });
    return { el: wrap, get, set(v) { inp.value = o.log ? toT(v) : v; show(); onChange && onChange(get()); } };
  }
  function toggle(labels, onPick, start = 0) {
    const r = el(`<div class="row" role="group"></div>`);
    labels.forEach((lab, i) => {
      const b = el(`<button type="button" class="btn small" aria-pressed="${i === start}">${lab}</button>`);
      b.addEventListener("click", () => { r.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); onPick(i); });
      r.appendChild(b);
    });
    return r;
  }
  const readout = (pairs) => `<div class="readout">${pairs.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join("")}</div>`;

  /* ---------- blocks ---------- */
  function mcq(b) {
    const n = el(`<div class="q">${b.q ? `<p class="qq">${b.q}</p>` : ""}${b.fig || ""}<div class="choices"></div><div class="feedback" aria-live="polite" hidden></div></div>`);
    const ch = n.querySelector(".choices"), fb = n.querySelector(".feedback");
    b.opts.forEach(([txt, ok, why]) => {
      const btn = el(`<button type="button" class="btn choice">${txt}</button>`);
      btn.addEventListener("click", () => {
        fb.hidden = false;
        fb.className = "feedback " + (ok ? "ok" : "no");
        fb.innerHTML = (ok ? "<b>Yes.</b> " : "<b>Not this one.</b> ") + (why || "");
        btn.classList.add(ok ? "right" : "wrong");
        if (ok) ch.querySelectorAll("button").forEach((x) => (x.disabled = x !== btn));
      });
      ch.appendChild(btn);
    });
    return n;
  }
  function num(b, id) {
    const n = el(`<div class="q"><p class="qq">${b.q}</p>${b.fig || ""}<form class="num" novalidate><input id="${id}" inputmode="decimal" autocomplete="off" aria-label="Your answer"><span class="mono">${b.unit || ""}</span><button class="btn primary" type="submit">Check</button></form><div class="feedback" aria-live="polite" hidden></div></div>`);
    const fb = n.querySelector(".feedback"), inp = n.querySelector("input");
    let tries = 0;
    n.querySelector("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const v = parseFloat(String(inp.value).replace(",", ".").replace("−", "-"));
      fb.hidden = false;
      if (isNaN(v)) { fb.className = "feedback"; fb.textContent = "Type a number first."; return; }
      const tol = b.tol != null ? b.tol : 0.02;
      const ok = b.a === 0 ? Math.abs(v) < 1e-9 : Math.abs(v - b.a) <= Math.abs(b.a) * tol;
      tries++;
      if (ok) { fb.className = "feedback ok"; fb.innerHTML = "<b>Yes.</b> " + (b.why || ""); }
      else { fb.className = "feedback no"; fb.innerHTML = "<b>Not yet.</b> " + (tries >= 2 && b.hint2 ? b.hint2 : b.hint || "Check your units and signs."); }
    });
    return n;
  }
  /* Say-it-back answers live in the chapter's progress state; start() points this at it. */
  let says = { get: (k) => store.get(k, ""), set: (k, v) => store.set(k, v) };
  function say(b, id, key) {
    const n = el(`<div class="q"><p class="qq">${b.q}</p><textarea id="${id}" placeholder="Type your answer in your own words. Rough is fine."></textarea><div class="row"><button type="button" class="btn primary">Compare with mine</button></div><div class="model" hidden><span class="lbl">One good answer</span><div>${b.model}</div><p class="aside">Did yours get the same core idea? Wording doesn't matter. If you're unsure, paste yours into the chat and ask for feedback.</p></div></div>`);
    const ta = n.querySelector("textarea");
    ta.value = says.get(key);
    ta.addEventListener("input", () => says.set(key, ta.value));
    n.querySelector("button").addEventListener("click", () => { n.querySelector(".model").hidden = false; });
    return n;
  }
  function sort(b) {
    const n = el(`<div class="q">${b.q ? `<p class="qq">${b.q}</p>` : ""}<div class="sort"></div><div class="row"><button type="button" class="btn primary sort-check">Check my sorting</button></div><div class="feedback" aria-live="polite" hidden></div></div>`);
    const box = n.querySelector(".sort"), picks = [];
    b.items.forEach(([label], i) => {
      const it = el(`<div class="sort-item"><span>${label}</span></div>`);
      it.appendChild(toggle(b.bins, (k) => (picks[i] = k), -1));
      it.appendChild(el(`<div class="why" hidden></div>`));
      box.appendChild(it);
    });
    n.querySelector(".sort-check").addEventListener("click", () => {
      let right = 0;
      b.items.forEach(([, bin, why], i) => {
        const it = box.children[i], ok = picks[i] === bin;
        if (ok) right++;
        it.classList.toggle("right", ok); it.classList.toggle("wrong", !ok);
        const w = it.querySelector(".why"); w.hidden = false;
        w.innerHTML = (picks[i] == null ? "<b>Not sorted yet.</b> " : "") + (ok ? "" : `<b>Belongs in “${b.bins[bin]}”.</b> `) + (why || "");
      });
      const fb = n.querySelector(".feedback"); fb.hidden = false;
      fb.className = "feedback " + (right === b.items.length ? "ok" : "no");
      fb.innerHTML = `<b>${right} of ${b.items.length}</b> sorted correctly. ${right === b.items.length ? "" : "Read the notes on the red ones."}`;
    });
    return n;
  }
  function reveal(b) {
    const n = el(`<div class="q"><div class="row"><button type="button" class="btn">${b.label || "Show me"}</button></div><div hidden>${b.html}</div></div>`);
    n.querySelector("button").addEventListener("click", (e) => { n.lastElementChild.hidden = false; e.currentTarget.disabled = true; });
    return n;
  }
  function renderBlock(b, id, key) {
    if (typeof b === "string") return el(`<div>${b}</div>`);
    if (typeof b === "function") { const h = el(`<div class="widget" style="display:grid;gap:12px;min-width:0"></div>`); b(h, id); return h; }
    if (b.t === "mcq") return mcq(b);
    if (b.t === "num") return num(b, id);
    if (b.t === "say") return say(b, id, key);
    if (b.t === "sort") return sort(b);
    if (b.t === "reveal") return reveal(b);
    return el(`<div>${b.html || ""}</div>`);
  }

  /* ---------- subscripts: "v_TH" in any text renders as v<sub>TH</sub> (tspan inside SVG).
     A subscript stops before a letter that starts the next subscripted name, so "g_mR_D" reads g<sub>m</sub>R<sub>D</sub>. ---------- */
  const SUBRE = /([A-Za-zΔβμαθωφτγ′])_([A-Za-z0-9]+?)(?=[A-Za-zΔβμαθωφτγ′]_|[^A-Za-z0-9]|$)/g, SVGNS = "http://www.w3.org/2000/svg";
  function subify(root) {
    if (!root || !document.createTreeWalker) return;
    const w = document.createTreeWalker(root, 4 /* text */), hits = [];
    for (let n = w.nextNode(); n; n = w.nextNode()) {
      const p = n.parentNode;
      if (n.nodeValue.indexOf("_") < 0 || !p || /^(script|style|textarea|sub|tspan|title|code|pre)$/i.test(p.nodeName) || (p.closest && p.closest("pre, code"))) continue;
      SUBRE.lastIndex = 0;
      if (SUBRE.test(n.nodeValue)) hits.push(n);
    }
    hits.forEach((n) => {
      const svg = n.parentNode.namespaceURI === SVGNS, s = n.nodeValue, frag = document.createDocumentFragment();
      let last = 0, m;
      SUBRE.lastIndex = 0;
      while ((m = SUBRE.exec(s))) {
        frag.appendChild(document.createTextNode(s.slice(last, m.index) + m[1]));
        const sub = svg ? document.createElementNS(SVGNS, "tspan") : document.createElement("sub");
        if (svg) { sub.setAttribute("baseline-shift", "sub"); sub.setAttribute("font-size", "75%"); }
        sub.textContent = m[2];
        frag.appendChild(sub);
        last = m.index + m[0].length;
      }
      frag.appendChild(document.createTextNode(s.slice(last)));
      n.parentNode.replaceChild(frag, n);
    });
  }
  function watchSubs(root) {
    subify(root);
    if (!window.MutationObserver) return;
    new MutationObserver((ms) => ms.forEach((m) => m.addedNodes.forEach((a) => subify(a.nodeType === 3 ? a.parentNode : a)))).observe(root, { childList: true, subtree: true });
  }

  /* ---------- app ---------- */
  const KIND = { learn: "Learn", play: "Play", predict: "Predict first", why: "Why?", whatif: "What if…", bug: "Spot the mistake", check: "Quick check", say: "Say it back", math: "Math boost" };

  function start(C) {
    const KEY = "course-" + C.id, P = window.Progress;
    const state = P ? P.load(C.id) : store.get(KEY, { done: {}, last: null, say: {} });
    state.say = state.say || {};
    const save = (delay) => (P ? P.save(C.id, state, delay) : store.set(KEY, state));
    says = {
      get: (k) => (k in state.say ? state.say[k] : store.get(k, "")), // older builds kept answers under their own keys
      set: (k, v) => { state.say[k] = v; save(1500); },
    };
    const root = document.getElementById("app");
    watchSubs(root);
    let view = { part: null, step: 0 };

    /* Book navigation: chapter pages sit in the book's folder, its contents page one level up. */
    const B = window.BOOK;
    const bookLink = () => (B ? `<a class="book-link" href="../${B.home}">← Contents</a> · ` : "");
    /* Where this chapter lives in the real book, so the problems are easy to find afterwards. */
    const U = (B && B.unit) || "Chapter", u = U.toLowerCase();
    /* Cross-book links: a math module lists the chapters that use it; a chapter lists the math modules it needs. */
    const BOOKS = Object.values(window.BOOKS || {});
    function chapterRef(id) {
      for (const K of BOOKS) {
        if (K.key === "math" || !K.find) continue;
        const c = K.find(id);
        if (c && c.file) return `<a href="../${K.dir}/${c.file}" title="${c.title}">${K.short} ${typeof c.n === "number" ? "Ch" : "App"} ${c.n}</a>`;
      }
      return "";
    }
    function mathLinks() {
      const M = window.BOOKS && window.BOOKS.math;
      if (!M || !M.all || (B && B.key === "math")) return "";
      const href = (m) => (m.file.startsWith("../") ? m.file : "../math/" + m.file);
      const list = (key) => M.all().filter((m) => m.file && (m[key] || []).includes(C.id)).map((m) => `<a href="${href(m)}">${m.title}</a>`).join(" · ");
      const need = list("needs"), also = list("also");
      return (need ? `<p class="aside where-book">Math you'll use: ${need}</p>` : "") + (also ? `<p class="aside where-book">Going further (optional): ${also}</p>` : "");
    }
    function whereInBook() {
      const me = B && B.find(C.id);
      if (me && B.noPdf) {
        const used = (me.needs || []).map(chapterRef).filter(Boolean), pairs = (me.also || []).map(chapterRef).filter(Boolean);
        return (used.length ? `<p class="aside where-book">Used in: ${used.join(" · ")}</p>` : "") + (pairs.length ? `<p class="aside where-book">Not in the books, but pairs with: ${pairs.join(" · ")}</p>` : "");
      }
      if (!me || !me.pdf) return mathLinks();
      return `<p class="aside where-book">${B.short}, ${typeof me.n === "number" ? "Chapter" : "Appendix"} ${me.n} · ${B.pagesLabel(me)}${B.pdfFile ? "" : ` · PDF file ending “-${me.pdf}.pdf”`}${me.probs ? ` · problems from ${B.probsLabel(me)}` : ""}</p>` + mathLinks();
    }
    function problemsNote() {
      const me = B && B.find(C.id);
      if (!me || !me.probs) return "";
      return `<div class="key"><b>Your book problems:</b> open <span class="mono">${B.pdfName(me)}</span> and go to ${B.probsLabel(me)}.</div>`;
    }
    const isAppPage = () => { const m = B && B.find(C.id); return !!m && typeof m.n !== "number"; };
    function nextChapter() {
      if (!B) return "";
      const me = B.find(C.id), isApp = !!me && typeof me.n !== "number";
      const list = isApp ? B.all().filter((c) => typeof c.n !== "number" && c.file) : B.chapters(), i = list.findIndex((c) => c.id === C.id), nx = list[i + 1];
      const ans = B.answers && !isApp ? `<p class="aside">The book has short answers to some problems (${B.answers.label}, pages ${B.answers.pdf.replace("-", "–")}). Look only after you've committed to your own answer.</p>` : "";
      if (!nx) return ans + `<p><a href="../${B.home}">← Back to the contents</a></p>`;
      return ans + (nx.file
        ? `<p>Then: <a href="${nx.file}">${isApp ? "Appendix" : U} ${nx.n} · ${nx.title} →</a></p>`
        : `<p>Next up: ${U} ${nx.n} · ${nx.title}. Its tutorial isn't built yet. Ask Claude for it when you're ready.</p>`);
    }

    function hub() {
      view = { part: null, step: 0 };
      const firstOpen = C.parts.findIndex((p) => !state.done[p.id]);
      const node = el(`<div class="wrap">
        <header class="top"><div class="eyebrow">${bookLink()}${C.eyebrow}</div><h1>${C.title}</h1>${whereInBook()}</header>
        <section class="card"><span class="tag">How this ${isAppPage() ? "appendix" : u} works</span>${C.intro}</section>
        <ol class="parts" aria-label="Parts of this ${u}"></ol>
        <section class="after"><h3 style="font-family:var(--display);margin:0">After the last part</h3>${problemsNote()}${C.after}${nextChapter()}</section>
        <p class="aside save-note"></p>
      </div>`);
      if (P) P.onStatus((s) => { const n = node.querySelector(".save-note"); if (n) n.textContent = s === "cloud" ? "Progress saves to your Claude account, so it follows you to any browser." : "Progress saves in this browser only."; });
      const list = node.querySelector(".parts");
      C.parts.forEach((p, i) => {
        const done = !!state.done[p.id];
        const cls = done ? "done" : i === firstOpen ? "next" : "";
        const b = el(`<li><button type="button" class="part-btn ${cls}"><span class="part-n">${done ? "✓" : i + 1}</span><span><span class="part-t">${p.title}</span><span class="part-d">${p.blurb}</span></span><span class="part-m">${p.mins} min</span></button></li>`);
        b.querySelector("button").addEventListener("click", () => openPart(i, state.last && state.last.part === i ? state.last.step : 0));
        list.appendChild(b);
      });
      const sum = el(`<li><button type="button" class="part-btn"><span class="part-n">Σ</span><span><span class="part-t">${U} summary</span><span class="part-d">Every key idea and formula on one page. Keep it open while you do the problems.</span></span><span class="part-m">ref</span></button></li>`);
      sum.querySelector("button").addEventListener("click", summary);
      list.appendChild(sum);
      if (state.last && state.last.part != null && C.parts[state.last.part]) {
        const p = C.parts[state.last.part];
        const cont = el(`<div class="row"><button type="button" class="btn primary">Continue: Part ${state.last.part + 1}, step ${state.last.step + 1}</button><span class="aside">${p.title}</span></div>`);
        cont.querySelector("button").addEventListener("click", () => openPart(state.last.part, state.last.step));
        node.querySelector(".card").after(cont);
      }
      root.replaceChildren(node);
      window.scrollTo(0, 0);
    }

    function summary() {
      view = { part: null, step: 0 };
      const node = el(`<div class="wrap"><header class="top"><div class="eyebrow"><button type="button">← ${C.eyebrow}</button></div><h1>${U} summary</h1></header><section class="card">${C.summary}</section><nav class="bottom"><button type="button" class="btn ghost">← ${U} map</button><span></span></nav></div>`);
      node.querySelectorAll(".eyebrow button, nav .btn").forEach((b) => b.addEventListener("click", hub));
      root.replaceChildren(node);
      window.scrollTo(0, 0);
    }

    function openPart(pi, si0 = 0) {
      const P = C.parts[pi];
      const node = el(`<div class="wrap">
        <header class="top"><div class="eyebrow"><button type="button">← ${C.eyebrow}</button> · Part ${pi + 1} of ${C.parts.length}</div><h1>${P.title}</h1>
        <div class="rail" aria-label="Steps"></div><div class="where"></div></header>
        <main></main>
        <nav class="bottom"><button type="button" class="btn ghost" data-back>← Back</button><button type="button" class="btn primary" data-next>Next →</button></nav></div>`);
      node.querySelector(".eyebrow button").addEventListener("click", hub);
      root.replaceChildren(node);
      const rail = node.querySelector(".rail"), where = node.querySelector(".where"), main = node.querySelector("main");
      const back = node.querySelector("[data-back]"), next = node.querySelector("[data-next]");
      const N = P.steps.length;

      function show(i) {
        i = Math.max(0, Math.min(N, i));
        view = { part: pi, step: i };
        if (i === N) return finish();
        state.last = { part: pi, step: i }; save();
        const st = P.steps[i];
        const card = el(`<section class="card"><span class="tag k-${st.k}">${KIND[st.k] || st.k}</span>${st.title ? `<h2>${st.title}</h2>` : ""}</section>`);
        (st.b || []).forEach((b, j) => card.appendChild(renderBlock(b, `${C.id}-${P.id}-s${i}-b${j}`, `${KEY}-say-${P.id}-${i}-${j}`)));
        main.replaceChildren(card);
        rail.innerHTML = P.steps.map((s, k) => `<button type="button" class="${k < i ? "done" : k === i ? "now" : ""}" aria-label="Step ${k + 1}" ${k === i ? 'aria-current="step"' : ""} data-i="${k}"></button>`).join("");
        rail.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => show(+b.dataset.i)));
        where.innerHTML = `Step <b>${i + 1}</b> of ${N} · ${KIND[st.k] || st.k}`;
        back.disabled = i === 0;
        next.hidden = false;
        next.textContent = i === N - 1 ? "Finish part ✓" : "Next →";
        window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
      }
      function finish() {
        state.done[P.id] = true;
        state.last = pi + 1 < C.parts.length ? { part: pi + 1, step: 0 } : null;
        save();
        const hasNext = pi + 1 < C.parts.length;
        const card = el(`<section class="card"><span class="tag k-check">Part ${pi + 1} complete</span><h2>Your takeaway</h2><div class="key">${P.takeaway}</div>
          <p class="aside">Good moment for a short break. Stand up, drink some water, then come back.</p>
          <div class="row">${hasNext ? `<button type="button" class="btn primary" data-np>Part ${pi + 2}: ${C.parts[pi + 1].title} →</button>` : `<button type="button" class="btn primary" data-sum>Open the ${u} summary</button>`}<button type="button" class="btn ghost" data-hub>Chapter map</button></div></section>`);
        main.replaceChildren(card);
        rail.querySelectorAll("button").forEach((b) => (b.className = "done"));
        where.innerHTML = `<b>Done</b> · ${N} steps`;
        back.disabled = false;
        next.hidden = true;
        card.querySelector("[data-hub]").addEventListener("click", hub);
        if (hasNext) card.querySelector("[data-np]").addEventListener("click", () => openPart(pi + 1, 0));
        else card.querySelector("[data-sum]").addEventListener("click", summary);
        window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
      }
      back.addEventListener("click", () => show(view.step - 1));
      next.addEventListener("click", () => show(view.step + 1));
      show(si0);
    }

    document.addEventListener("keydown", (e) => {
      if (view.part == null) return;
      if (e.target.closest && e.target.closest("input, textarea, select")) return;
      const nb = document.querySelector("[data-next]"), bb = document.querySelector("[data-back]");
      if (e.key === "ArrowRight" && nb && !nb.hidden) nb.click();
      if (e.key === "ArrowLeft" && bb && !bb.disabled) bb.click();
    });

    const m = /^#p(\d+)$/.exec(location.hash || "");
    /* #resume (from the library's Resume card): the saved step, else the first unfinished part, else the map. */
    const L = state.last, todo = C.parts.findIndex((p) => !state.done[p.id]);
    if (m && C.parts[+m[1] - 1]) openPart(+m[1] - 1, 0);
    else if (location.hash === "#resume" && L && C.parts[L.part]) openPart(L.part, L.step);
    else if (location.hash === "#resume" && todo >= 0) openPart(todo, 0);
    else hub();
    if (P) P.sync(C.id, state, () => { if (view.part == null) hub(); });
  }

  return { start, S, plot, slider, toggle, readout, fmt, si, el, reduce, store };
})();
</script>
<script>
(function () {
  const { S, plot, slider, toggle, readout, fmt, si, el } = Course;
  const fig = (svg) => `<div class="fig">${svg}</div>`;
  const seen = (html, href, where) => `<div class="key"><b>Seen in 6.002:</b> ${html} <a href="../chapters/${href}">${where} →</a></div>`;
  const ch = (n, file, part, where, html) => `<p class="aside">${html} <a href="${file}#${part}">Boylestad Chapter ${n}, ${where} →</a></p>`;
  const par = (...r) => 1 / r.reduce((a, x) => a + 1 / x, 0);
  const ohm = (r) => si(r, "Ω");
  const kohm = (k) => si(k * 1000, "Ω");
  const shock = (IDSS, VP) => (v) => (v / VP >= 1 ? 0 : IDSS * Math.pow(1 - v / VP, 2));

  /* Small-signal common-source model between a top rail (y=40) and a bottom rail (y=170).
     o.rin: label of the gate resistor (R_G, R_1 ∥ R_2).  o.rd: draw r_d.  o.rl: add a load.  o.rs: add V_s and R_sig. */
  function csFig(o = {}) {
    const T = 40, B = 170, M = 105;
    let s = S.vsrc(60, M, o.rs ? "V_s" : "V_i") + S.wire([60, M - 18], [60, T]) + S.wire([60, M + 18], [60, B]), x = 60;
    if (o.rs) { s += S.res(60, T, 140, T, "R_sig"); x = 140; s += S.t(146, T + 18, "V_i", { a: "start", cls: "a s" }); }
    const xr = x + 50, xg = xr + 70;
    s += S.wire([x, T], [xg, T]) + S.res(xr, T, xr, B, o.rin || "R_G", { side: "right" }) + S.dot(xr, T) + S.dot(xr, B);
    s += S.dot(xg, T) + S.t(xg, T - 8, "G", { cls: "s m" }) + S.t(xg + 6, M - 4, "+", { cls: "s" }) + S.t(xg + 4, M + 14, "V_gs", { a: "start", cls: "s c" }) + S.t(xg + 6, B - 14, "−", { cls: "s" }) + S.dot(xg, B) + S.t(xg, B + 18, "S", { cls: "s m" });
    const xi = xg + 90;
    s += S.isrc(xi, M, "g_m·V_gs", { down: true, side: "right" }) + S.wire([xi, M - 18], [xi, T]) + S.wire([xi, M + 18], [xi, B]) + S.t(xi, T - 8, "D", { cls: "s m" });
    let xe = xi + 30;
    const add = (lab, cls) => { xe += 75; s += S.res(xe, T, xe, B, lab, { side: "right", cls }) + S.dot(xe, T) + S.dot(xe, B); };
    if (o.rd !== false) add("r_d");
    add(o.rdLab || "R_D");
    if (o.rl) add("R_L", "hl");
    s += S.wire([xi, T], [xe + 40, T]) + S.dot(xe + 40, T) + S.t(xe + 40, T - 10, "V_o", { cls: "a" }) + S.wire([60, B], [xg - 20, B]) + S.wire([xi - 30, B], [xe + 40, B]);
    s += S.wire([xg - 20, B], [xi - 30, B]);
    return S.svg(xe + 70, 205, s, { max: xe + 70, label: o.label || "Small-signal model of a common-source FET amplifier" });
  }
  function waves(gain, o = {}) {
    const inv = gain < 0, A = 0.85, ai = o.ai != null ? o.ai : 0.3;

  }

  /* =============== PART 1 =============== */
  const p1 = {

    takeaway: "ΔI_D = g_mΔV_GS, so g_m = ΔI_D/ΔV_GS: the slope of the transfer curve at the Q-point (units: siemens). For a JFET or depletion MOSFET, differentiating Shockley gives g_m = (2I_DSS/|V_P|)(1 − V_GS/V_P) = g_m0(1 − V_GS/V_P), with g_m0 = 2I_DSS/|V_P| the maximum, at V_GS = 0. g_m falls in a straight line to 0 at V_GS = V_P; at V_P/2 it's g_m0/2. In terms of current: g_m = g_m0√(I_D/I_DSS) (at I_DSS/4, half of g_m0). Datasheets call it g_fs or y_fs (forward transfer conductance, source common).",
    steps: [
      { k: "learn", title: "From β to g_m", b: [
        `<p>A BJT turns a small base current into a big collector current: β. A FET turns a small <b>gate voltage</b> change into a drain current change: the <b>transconductance</b>.</p>`,

        `<p class="aside">"Trans" because it links output to input; "conductance" because it's a current over a voltage, like 1/R.</p>`,

  /* =============== PART 2 =============== */
  const p2 = {
    id: "p2", title: "The FET ac model", mins: 20,
    blurb: "An open circuit at the gate, a current source g_mV_gs, and r_d. Simpler than the BJT's.",
    takeaway: "Input: the gate is effectively an open circuit, Z_i(FET) = ∞ (about 10⁹ Ω for JFETs, 10¹² to 10¹⁵ Ω for MOSFETs and MESFETs). Output: r_d = 1/g_os = 1/y_os, the inverse slope of the drain curve at the Q-point with V_GS constant: r_d = ΔV_DS/ΔI_D. Flatter curves mean bigger r_d (ideal: ∞). r_d is usually smaller nearer V_GS = 0. The model: an open gate, a current source g_mV_gs from drain to source (its direction gives the 180° inversion), and r_d in parallel. Lower-case subscripts (V_gs) mark ac quantities. No current gain is defined: the input current is zero.",
    steps: [
      { k: "learn", title: "Input and output", b: [
        `<div class="two"><div class="tile"><h3>Input</h3><p>The gate draws essentially nothing: <b>Z<sub>i</sub> = ∞</b> (about 10⁹ Ω for JFETs; 10¹² to 10¹⁵ Ω for MOSFETs).</p></div><div class="tile"><h3>Output</h3><p><b>r<sub>d</sub> = 1/g<sub>os</sub> = 1/y<sub>os</sub></b>: like a BJT's r<sub>o</sub>. Datasheets give g<sub>os</sub> in µS.</p></div></div>`,
        `<div class="eq">r<sub>d</sub> = ΔV<sub>DS</sub>/ΔI<sub>D</sub>  with V<sub>GS</sub> held constant</div>`,
        `<p>The flatter the drain curve at the Q-point, the bigger r<sub>d</sub>. A perfectly flat curve means r<sub>d</sub> = ∞, an open circuit, the usual approximation.</p>`,

  /* =============== PART 3 =============== */
  const p3 = {
    id: "p3", title: "Common source: fixed bias and bypassed self-bias", mins: 25,

    takeaway: "Fixed bias (and self-bias with R_S bypassed by C_S): Z_i = R_G (the FET adds nothing). Z_o = R_D ∥ r_d ≈ R_D if r_d ≥ 10R_D (set V_i = 0, so V_gs = 0 and the source opens). A_v = −g_m(r_d ∥ R_D) ≈ −g_mR_D: 180° phase shift. g_m comes from the DC Q-point: g_m = g_m0(1 − V_GSQ/V_P). Typical FET gains are far below a BJT's, but Z_i is megohms.",

        `<div class="eq">Z<sub>i</sub> = R<sub>G</sub>    Z<sub>o</sub> = R<sub>D</sub> ∥ r<sub>d</sub>    A<sub>v</sub> = −g<sub>m</sub>(r<sub>d</sub> ∥ R<sub>D</sub>) ≅ −g<sub>m</sub>R<sub>D</sub></div>`,

      ]},

    ],
  };

  /* =============== PART 4 =============== */
  const p4 = {

    blurb: "Take away the bypass capacitor and the gain drops by (1 + g_mR_S).",

      { k: "learn", title: "R_S stays in the circuit", b: [

        `<div class="eq">V<sub>gs</sub> = V<sub>i</sub> − I<sub>d</sub>R<sub>S</sub></div>`,

        `<div class="eq">A<sub>v</sub> = −g<sub>m</sub>R<sub>D</sub> / [1 + g<sub>m</sub>R<sub>S</sub> + (R<sub>D</sub> + R<sub>S</sub>)/r<sub>d</sub>]</div>`,

  /* =============== PART 5 =============== */
  const p5 = {

  function dfFig() {
    const T = 50, B = 180;
    let s = S.vsrc(50, 115, "V_i") + S.wire([50, 97], [50, T], [150, T]) + S.wire([50, 133], [50, B], [460, B]);
    s += S.dot(150, T) + S.t(150, T - 10, "G", { cls: "s m" }) + S.t(158, 115, "V_gs", { a: "start", cls: "s c" }) + S.dot(150, B);
    s += S.wire([150, T], [150, 20]) + S.res(150, 20, 300, 20, "R_F") + S.wire([300, 20], [300, T]);
    s += S.isrc(300, 115, "g_m·V_gs", { down: true, side: "right" }) + S.wire([300, 97], [300, T], [460, T]) + S.wire([300, 133], [300, B]) + S.dot(300, T) + S.t(312, T + 14, "D", { a: "start", cls: "s m" });
    s += S.res(380, T, 380, B, "r_d", { side: "right" }) + S.res(440, T, 440, B, "R_D", { side: "right" }) + S.dot(380, T) + S.dot(440, T) + S.dot(380, B) + S.dot(440, B) + S.t(470, T - 6, "V_o", { a: "start", cls: "a" });
    return S.svg(510, 210, s, { max: 510, label: "Drain-feedback E-MOSFET amplifier model: RF from drain back to gate" });
  }

        { t: "num", q: "Two identical stages: g_m = 3 mS, R_D = 2.2 kΩ, next stage's R_G = 1 MΩ. Overall gain (ignore r_d)?", a: 43.46, tol: 0.01, hint: "Stage 1: −3 × (2.2k ∥ 1M). Stage 2: −3 × 2.2k.", why: "(−6.59)(−6.6) = +43.5. Two inversions: positive." },
        `<p>A FET in front of a BJT gets you a huge Z<sub>i</sub> plus the BJT's big gain. But the BJT's input (around 1 kΩ) heavily loads the FET's drain.</p>`,
        { t: "num", q: "FET stage (g_m = 3 mS, R_D = 2.2 kΩ) drives a BJT stage with Z_i = 1.2 kΩ and A_v = −250. Overall gain?", a: 582.4, tol: 0.01, hint: "Stage 1 loaded: −3 × (2.2k ∥ 1.2k).", why: "Stage 1: −2.33. Total: (−2.33)(−250) = 582." },
        `<p class="aside">Book slip: Example 8.17 takes stage 2's gain "from Example 5.18", but Example 5.18 is the feedback pair; the RC-coupled BJT stage is Example 5.15.</p>`,
      ]},
      { k: "say", title: "Say it back", b: [
        { t: "say", q: "Why are FET amplifiers less affected by source resistance than BJT amplifiers?", model: "Because a FET amplifier's input impedance is usually megohms, set by R_G or the divider, so the voltage divider formed with the source resistance passes nearly all of the signal. A BJT stage often has an input impedance around a kilohm, so a source resistance of a few kilohms throws away most of the signal." },
      ]},
    ],
  };

  /* =============== PART 11 =============== */
  const p11 = {
    id: "p11", title: "Troubleshooting, mixers and silent switches", mins: 25,
    blurb: "Check the obvious first. Then: why JFET mixers need isolation resistors, and JFETs as switches.",
    takeaway: "Troubleshooting a small-signal amplifier: look for obvious damage (scorched areas, hot parts, bad joints), check DC voltages against the expected values, then trace an ac test signal from input to output with a scope (shape, polarity, amplitude, full cycle). No ac output: check the supply, that V_D is mid-range, that there's signal at the gate, and both sides of each coupling capacitor. JFET mixer: all channels can share one gate because Z_i is so high, but series isolation resistors (100 kΩ) keep a low-impedance source from swamping a high-impedance one (and from driving power back into it: a microphone can even act as a speaker). Silent switching: a JFET at V_GS = 0 is a low resistance (about 100 Ω), past pinch-off an open circuit (up to 10 GΩ). It's bilateral and DC-controlled, so it replaces noisy mechanical switches; an RC on the gate ignores spikes.",
    steps: [
      { k: "learn", title: "A troubleshooting routine", b: [
        `<ol><li>Look: scorched areas, components too hot to touch, poor solder joints, loose connections.</li><li>DC: compare voltages with the expected values.</li><li>ac: inject a test signal, follow it from input toward output.</li><li>At the faulty stage, scope the waveform: shape, polarity, amplitude, frequency, glitches, full cycle present?</li></ol>`,
        { t: "sort", q: "No ac output. Put the checks in a sensible category.", bins: ["Power and DC", "Signal path"], items: [
          ["Is the supply connected?", 0, "Check the obvious first."],
          ["Is V_D somewhere between 0 and V_DD?", 0, "A drain stuck at 0 or V_DD means no proper bias."],
          ["Is there an ac signal at the gate?", 1, "If not, the problem is before the FET."],
          ["Is there signal on both sides of each coupling capacitor?", 1, "An open capacitor passes nothing."],
        ]},
        `<p class="aside">In the lab: measure resistor values (overheated ones drift), make sure all grounds are common, and measure the input signal you're actually applying.</p>`,
      ]},
      { k: "play", title: "A three-channel mixer", b: [
        (host) => {
          const f = el(`<div class="fig"></div>`), ro = el(`<div></div>`);
          const Rm = 12, Rg = 0.6;
          function draw(k) {
            const R = k === 0 ? 0 : 100, a = R + Rm, b = R + Rg, wm = b / (a + b), wg = a / (a + b);
            const bar = (v, y, cls, lab) => `<rect x="150" y="${y}" width="${Math.max(1, v * 320)}" height="22" style="fill:var(--${cls})"/>` + S.t(140, y + 16, lab, { a: "end", cls: "s" }) + S.t(156 + Math.max(1, v * 320), y + 16, fmt(v, 3), { a: "start", cls: "s" });
            f.innerHTML = S.svg(560, 90, bar(wm, 10, "cool", "microphone") + bar(wg, 50, "accent", "guitar"), { max: 560, label: "Share of each source at the JFET gate" });
            ro.innerHTML = readout([["Isolation resistor", R ? "100 kΩ each" : "none"], ["v<sub>G</sub>", `${fmt(wm, 3)}·v<sub>mic</sub> + ${fmt(wg, 3)}·v<sub>guitar</sub>`]]);
          }
          host.append(f, toggle(["No isolation resistors", "100 kΩ isolation resistors"], draw, 0), ro);
          draw(0);
        },
        `<p>A microphone with 12 kΩ inside and a guitar amp with 600 Ω inside feed one JFET gate (the JFET's input is essentially open, so it doesn't load either). Superposition gives each source's share.</p>`,
        `<p class="aside">Without isolation, the low-impedance guitar swamps the mic, and can even push power back into it: a microphone is built like a small speaker and may start playing the guitar. With 100 kΩ in each line, both look nearly alike: an even mix.</p>`,
      ]},
      { k: "learn", title: "The silent switch", b: [
        `<p>Mechanical switches in audio lines make "pfft" noises and pick up interference on their long wires. A JFET can switch instead:</p>`,
        `<div class="two"><div class="tile"><h3>ON: V<sub>GS</sub> = 0</h3><p>R<sub>DS</sub> about 100 Ω. Next to a 47 kΩ series resistor, practically a short.</p></div><div class="tile"><h3>OFF: V<sub>GS</sub> = −10 V</h3><p>Past pinch-off: up to about 10 GΩ. An open circuit.</p></div></div>`,
        `<p>It's <b>bilateral</b> (passes signals both ways, unlike a diode) and controlled by DC, so it suits remote and computer control. In the book's two-channel summing amp, with both switches on, v<sub>o</sub> = −(v<sub>1</sub> + v<sub>2</sub>); with one on, v<sub>o</sub> ≈ −v<sub>1</sub>.</p>`,
        { t: "num", q: "The gate control goes through 2.2 MΩ to a 22 nF capacitor. Time constant, in ms?", a: 48.4, unit: "ms", hint: "τ = RC.", why: "2.2 MΩ × 22 nF = 48.4 ms. The slow gate means a short spike on the control line can't flip the switch." },
      ]},
      { k: "say", title: "Say it back", b: [
        { t: "say", q: "Why put a resistor in series with each input of a JFET mixer?", model: "Sources with different internal impedances, connected in parallel, don't mix evenly: the lowest-impedance source dominates the shared node. Large equal series resistors make every channel look about the same, so the signals mix in balance, and they stop one source from driving current into another." },
      ]},
    ],
  };

  /* =============== PART 12 =============== */
  const p12 = {
    id: "p12", title: "Phase shifters and motion detectors", mins: 20,
    blurb: "A JFET's resistance and a capacitor shift a signal's phase on command. And a FET that listens to body heat.",
    takeaway: "Phase-advance network (C in series, R_DS to ground): V_o = k_1V_i∠θ_1 with k_1 = R_DS/√(R_DS² + X_C²) and θ_1 = tan⁻¹(X_C/R_DS), from near 0° to almost 90°. Phase-retard network (R_DS in series, C to ground): k_2 = X_C/√(R_DS² + X_C²), θ_2 = −tan⁻¹(R_DS/X_C). R_DS is set by V_GS, so a DC voltage controls the phase; more phase shift costs amplitude. PIR motion detector: a pyroelectric element sees changing heat (a person crossing zones) as a slow ac-like signal with high internal impedance; a JFET source follower picks it up without loading it, followed by a low-frequency amplifier, a peak detector and comparator, and a driver. Steadily rising heat (a heater, a lamp) produces no alternating signal, so no alarm.",
    steps: [
      { k: "play", title: "A voltage-controlled phase shift", b: [
        (host, id) => {
          const f = el(`<div class="fig"></div>`), ro = el(`<div></div>`);
          let R = 3, adv = true;
          const XC = 1.447;
          function draw() {
            const mag = adv ? R / Math.hypot(R, XC) : XC / Math.hypot(R, XC), th = adv ? Math.atan(XC / R) : -Math.atan(R / XC);
            f.innerHTML = plot({ x: [0, 2], y: [-1.2, 1.2], xt: [0, 0.5, 1, 1.5, 2], yt: [0], ytf: () => "0", xl: "time (cycles)", h: 190, series: [{ f: (t) => Math.sin(2 * Math.PI * t), cls: "s2" }, { f: (t) => mag * Math.sin(2 * Math.PI * t + th), cls: "s1" }], texts: [{ x: 0.25, y: 1.08, s: "v_i" }], label: "Input and phase-shifted output" });
            ro.innerHTML = readout([["R<sub>DS</sub>", kohm(R)], ["X<sub>C</sub>", "1.447 kΩ"], ["Output size", fmt(mag, 3) + " × input"], ["Phase", fmt((th * 180) / Math.PI, 3) + "°"]]);
          }
          host.append(f, toggle(["Phase advance (C in series)", "Phase retard (R_DS in series)"], (k) => { adv = k === 0; draw(); }, 0),
            slider({ id: id + "-r", label: "R<sub>DS</sub> (set by V<sub>GS</sub>)", min: 0.2, max: 10, step: 0.1, value: R, show: (v) => kohm(v) }, (v) => { R = v; draw(); }).el, ro);
          draw();
        },
        `<p class="aside">C = 0.022 µF at 5 kHz gives X<sub>C</sub> = 1.447 kΩ. Phase advance: shrink R<sub>DS</sub> and the phase grows toward 90°, but the output shrinks. That's the trade: angle against amplitude.</p>`,
      ]},
      { k: "check", title: "Your turn", b: [
        { t: "num", q: "Phase advance with R_DS = 3 kΩ, X_C = 1.447 kΩ. Phase angle?", a: 25.75, unit: "°", tol: 0.01, hint: "tan⁻¹(X_C/R_DS).", why: "tan⁻¹(0.482) = 25.8°." },
        { t: "num", q: "Output magnitude, as a fraction of the input?", a: 0.9007, tol: 0.01, hint: "R_DS/√(R_DS² + X_C²).", why: "3/3.331 = 0.90." },
        { t: "mcq", q: "Keep R_DS fixed and raise the signal frequency. What happens to the advance network's phase shift?", opts: [
          ["It shrinks toward 0°: X_C falls", true, "Lower X_C relative to R_DS means less phase shift (and less loss). At low frequencies it approaches 90°."],
          ["It grows toward 90°", false, "That's what happens at lower frequencies."],
          ["Nothing", false, "X_C depends on frequency."],
        ]},
      ]},
      { k: "learn", title: "Passive infrared motion detection", b: [
        `<ol><li>A <b>pyroelectric</b> element makes a voltage that follows the heat falling on it. A filter passes only infrared; a parabolic reflector focuses one area's heat on it.</li><li>A person walking past crosses the sensor's zones: the heat level jumps up and down, a slow ac-like signal with a high internal impedance.</li><li>A <b>JFET source follower</b> picks it up without loading it (megohm input).</li><li>A low-frequency amplifier, a peak detector and a comparator decide whether the swing is big enough; a driver sets off the alarm.</li></ol>`,
        { t: "mcq", q: "Why doesn't switching on a heater or a lamp trigger it?", opts: [
          ["Their heat rises steadily: there's no alternating signal for the system to detect", true, "The detector responds to heat, not light, and the alarm chain only reacts to an oscillating signal."],
          ["The detector ignores all heat sources except people", false, "It can't tell what made the heat; it reacts to how the heat changes."],
          ["The JFET blocks DC", false, "The point is about the shape of the signal, rising versus alternating."],
        ]},
      ]},
      { k: "say", title: "Say it back", b: [
        { t: "say", q: "Why use a JFET source follower right after the pyroelectric detector?", model: "The detector's signal comes from a source with a very high internal impedance. A JFET source follower has an input impedance of megohms, so it takes almost none of the signal's current and passes the voltage on with a low output impedance for the next stages." },
      ]},
    ],
  };

  window.CHAPTER = {
    id: "edc8", eyebrow: "Boylestad · Chapter 8", title: "FET Amplifiers",
    intro: `<p>Twelve parts: the FET small-signal model (g<sub>m</sub> and r<sub>d</sub>), then Z<sub>i</sub>, Z<sub>o</sub> and A<sub>v</sub> for every common configuration, MOSFET versions, design, loads, cascades, troubleshooting and real circuits.</p><p>It mirrors Chapter 5 for the BJT, and builds on 6.002 Chapter 8. The gate's open circuit makes most of it simpler.</p><p class="aside">The "Computer Analysis" section isn't covered. Arrow keys ← → move between steps.</p>`,
    after: `<p>Do the chapter's problems in the book. They test whether the ideas stuck, so don't expect them to look like the examples here.</p><p>Stuck? Tell Claude which problem and what you've tried. You'll get a guiding question first, not the answer.</p>`,
    parts: [p1, p2, p3, p4, p5, p6, p7, p8, p9, p10, p11, p12],
    summary: `
      <h3>The model</h3>
      <div class="eq">g<sub>m</sub> = ΔI<sub>D</sub>/ΔV<sub>GS</sub> = g<sub>fs</sub> = y<sub>fs</sub>    g<sub>m0</sub> = 2I<sub>DSS</sub>/|V<sub>P</sub>|    g<sub>m</sub> = g<sub>m0</sub>(1 − V<sub>GS</sub>/V<sub>P</sub>) = g<sub>m0</sub>√(I<sub>D</sub>/I<sub>DSS</sub>)</div>
      <div class="eq">E-MOSFET: g<sub>m</sub> = 2k(V<sub>GSQ</sub> − V<sub>GS(Th)</sub>)    r<sub>d</sub> = 1/g<sub>os</sub> = 1/y<sub>os</sub> = ΔV<sub>DS</sub>/ΔI<sub>D</sub>    gate: open circuit</div>
      <h3>Configurations</h3>
      <div class="eq">Fixed / bypassed self-bias: Z<sub>i</sub> = R<sub>G</sub>, Z<sub>o</sub> = R<sub>D</sub> ∥ r<sub>d</sub>, A<sub>v</sub> = −g<sub>m</sub>(r<sub>d</sub> ∥ R<sub>D</sub>)    Divider: Z<sub>i</sub> = R<sub>1</sub> ∥ R<sub>2</sub></div>
      <div class="eq">Unbypassed R<sub>S</sub>: Z<sub>o</sub> ≅ R<sub>D</sub>, A<sub>v</sub> = −g<sub>m</sub>R<sub>D</sub>/[1 + g<sub>m</sub>R<sub>S</sub> + (R<sub>D</sub> + R<sub>S</sub>)/r<sub>d</sub>] ≅ −g<sub>m</sub>R<sub>D</sub>/(1 + g<sub>m</sub>R<sub>S</sub>)</div>
      <div class="eq">Common gate: Z<sub>i</sub> = R<sub>S</sub> ∥ (r<sub>d</sub> + R<sub>D</sub>)/(1 + g<sub>m</sub>r<sub>d</sub>) ≅ R<sub>S</sub> ∥ 1/g<sub>m</sub>, Z<sub>o</sub> = R<sub>D</sub> ∥ r<sub>d</sub>, A<sub>v</sub> ≅ +g<sub>m</sub>R<sub>D</sub></div>
      <div class="eq">Source follower: Z<sub>i</sub> = R<sub>G</sub>, Z<sub>o</sub> = r<sub>d</sub> ∥ R<sub>S</sub> ∥ 1/g<sub>m</sub>, A<sub>v</sub> = g<sub>m</sub>(r<sub>d</sub> ∥ R<sub>S</sub>)/[1 + g<sub>m</sub>(r<sub>d</sub> ∥ R<sub>S</sub>)] &lt; 1</div>
      <div class="eq">Drain feedback: Z<sub>i</sub> = (R<sub>F</sub> + r<sub>d</sub> ∥ R<sub>D</sub>)/[1 + g<sub>m</sub>(r<sub>d</sub> ∥ R<sub>D</sub>)] ≅ R<sub>F</sub>/(1 + g<sub>m</sub>R<sub>D</sub>), Z<sub>o</sub> = R<sub>F</sub> ∥ r<sub>d</sub> ∥ R<sub>D</sub>, A<sub>v</sub> = −g<sub>m</sub>(R<sub>F</sub> ∥ r<sub>d</sub> ∥ R<sub>D</sub>)</div>
      <h3>Systems</h3>
      <div class="eq">A<sub>vL</sub> = −g<sub>m</sub>(r<sub>d</sub> ∥ R<sub>D</sub> ∥ R<sub>L</sub>)    A<sub>vs</sub> = [R<sub>G</sub>/(R<sub>G</sub> + R<sub>sig</sub>)]A<sub>vL</sub>    Cascade: A<sub>v</sub> = A<sub>v1</sub>A<sub>v2</sub> (loaded)</div>
      <p>Phase: common source and drain feedback invert; common gate and source follower don't. Typical FET gains 2–20.</p>
      <h3>Applications</h3>
      <div class="eq">Phase advance: k<sub>1</sub> = R<sub>DS</sub>/√(R<sub>DS</sub>² + X<sub>C</sub>²), θ<sub>1</sub> = tan⁻¹(X<sub>C</sub>/R<sub>DS</sub>)    Retard: k<sub>2</sub> = X<sub>C</sub>/√(R<sub>DS</sub>² + X<sub>C</sub>²), θ<sub>2</sub> = −tan⁻¹(R<sub>DS</sub>/X<sub>C</sub>)</div>`,
  };
  Course.start(window.CHAPTER);
})();
</script>
