<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: a chapter map (hub) that opens one part at a time; each part is a rail of single-card steps on graph paper. */
:root {
  --paper: #eaf0f4;
  --grid: rgba(40, 90, 140, 0.08);
  --card: #ffffff;
  --ink: #142238;
  --muted: #56677d;
  --line: #d2dce6;
  --accent: #e39a0b;
  --accent-soft: #fdf1d8;
  --accent-ink: #7a4d00;
  --cool: #2b67a3;
  --cool-soft: #e1ecf7;
  --good: #1d8656;
  --good-soft: #def4e9;
  --bad: #c2412a;
  --bad-soft: #fbe5e0;
  --on-accent: #1b1300;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1520; --grid: rgba(120, 170, 220, 0.07); --card: #16212f; --ink: #e5edf6; --muted: #98a8bc;
    --line: #2a3a4e; --accent: #f3b53c; --accent-soft: #3a2d10; --accent-ink: #f8d68f; --cool: #7db3ea;
    --cool-soft: #15283d; --good: #43c88d; --good-soft: #123426; --bad: #f2735a; --bad-soft: #3d1c16;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1520; --grid: rgba(120, 170, 220, 0.07); --card: #16212f; --ink: #e5edf6; --muted: #98a8bc;
  --line: #2a3a4e; --accent: #f3b53c; --accent-soft: #3a2d10; --accent-ink: #f8d68f; --cool: #7db3ea;
  --cool-soft: #15283d; --good: #43c88d; --good-soft: #123426; --bad: #f2735a; --bad-soft: #3d1c16;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.55;
}
.wrap {
  max-width: 700px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
  display: grid; gap: 16px;
}
header.top { display: grid; gap: 10px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.eyebrow button { font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--cool); background: none; border: 0; padding: 0; cursor: pointer; }
.eyebrow a.book-link { color: var(--cool); text-decoration: none; }
.eyebrow a.book-link:hover, .eyebrow a.book-link:focus-visible { text-decoration: underline; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 6.5vw, 40px); line-height: 1.05; margin: 0; text-wrap: balance; }
.rail { display: flex; gap: 5px; align-items: center; }
.rail button { flex: 1; height: 8px; border-radius: 4px; border: 0; padding: 0; cursor: pointer; background: var(--line); }
.rail button.done { background: var(--accent); opacity: 0.5; }
.rail button.now { background: var(--accent); }
.rail button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.where { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.where b { color: var(--ink); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 20px; display: grid; gap: 16px; min-width: 0; }
.card > * { min-width: 0; }
.card h2 { font-family: var(--display); font-weight: 600; font-size: 24px; line-height: 1.18; margin: 0; text-wrap: balance; }
.card h3 { font-family: var(--display); font-weight: 600; font-size: 19px; margin: 0; }
.card p { margin: 0; max-width: 62ch; }
.card ul, .card ol { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.tag { justify-self: start; font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--line); color: var(--ink); }
.k-predict, .k-play { background: var(--accent-soft); color: var(--accent-ink); }
.k-why, .k-math { background: var(--cool-soft); color: var(--cool); }
.k-bug { background: var(--bad-soft); color: var(--bad); }
.k-whatif, .k-check { background: var(--good-soft); color: var(--good); }
.k-say { background: transparent; color: var(--ink); border: 1px solid var(--ink); }

.mono, code { font-family: var(--mono); font-weight: 700; font-size: 0.92em; }
.eq { font-family: var(--mono); font-weight: 700; font-size: clamp(20px, 5.4vw, 28px); text-align: center; padding: 8px 0; overflow-x: auto; }
.eq .a { color: var(--accent); }
.key { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 10px 10px 0; }
.key b { color: var(--accent-ink); }
.aside { font-size: 15px; color: var(--muted); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.two > * { min-width: 0; }
.tile { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; }
.tile h3 { font-size: 17px; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 16px; }
.tbl th, .tbl td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
.tbl th { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* controls */
.btn { font: inherit; font-size: 16px; padding: 10px 16px; border-radius: 10px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn.ghost { background: transparent; }
.btn.small { font-size: 14px; padding: 6px 12px; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); font-weight: 700; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn:focus-visible, input:focus-visible, textarea:focus-visible, .hit:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.choices { display: grid; gap: 8px; }
.choice { text-align: left; width: 100%; }
.choice.right { border-color: var(--good); background: var(--good-soft); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.q { display: grid; gap: 10px; }
.qq { font-weight: 700; }
.feedback { border-radius: 10px; padding: 12px 14px; font-size: 16px; background: var(--paper); border: 1px solid var(--line); }
.feedback.ok { background: var(--good-soft); border-color: var(--good); }
.feedback.no { background: var(--bad-soft); border-color: var(--bad); }
.num { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.num input { font: inherit; font-family: var(--mono); font-size: 19px; width: 8em; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
textarea { font: inherit; font-size: 17px; width: 100%; min-height: 96px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); resize: vertical; }
select { font: inherit; font-family: var(--mono); font-size: 15px; max-width: 100%; padding: 8px 10px; margin: 4px 0 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.model { border: 2px dashed var(--good); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.model .lbl { font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--good); }
.sort { display: grid; gap: 8px; }
.sort-item { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.sort-item > span { min-width: 0; }
.sort-item.right { border-color: var(--good); background: var(--good-soft); }
.sort-item.wrong { border-color: var(--bad); background: var(--bad-soft); }
.sort-item .why { grid-column: 1 / -1; font-size: 15px; }
@media (max-width: 480px) { .sort-item { grid-template-columns: 1fr; } }

/* sliders + readouts */
.sliders { display: grid; gap: 10px; }
.sl { display: grid; gap: 2px; }
.sl label { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; color: var(--muted); }
.sl output { font-family: var(--mono); font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.sl input[type="range"] { width: 100%; accent-color: var(--accent); }
.readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.readout > div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--paper); min-width: 0; }
.readout span { display: block; font-size: 13px; color: var(--muted); }
.readout b { font-family: var(--mono); font-size: 19px; font-variant-numeric: tabular-nums; }
.verdict { justify-self: start; font-weight: 700; font-size: 15px; padding: 4px 14px; border-radius: 999px; }
.verdict.ok { background: var(--good-soft); color: var(--good); }
.verdict.mid { background: var(--accent-soft); color: var(--accent-ink); }
.verdict.no { background: var(--bad-soft); color: var(--bad); }

/* schematics + plots */
.fig { overflow-x: auto; }
.sch, .plot { width: 100%; height: auto; display: block; margin: 0 auto; }
.sch .w { stroke: var(--ink); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.sch .w.hl { stroke: var(--accent); stroke-width: 3.5; }
.sch .w.dim { stroke: var(--line); }
.sch .el { fill: var(--card); stroke: var(--ink); stroke-width: 2.5; }
.sch .el.hl { stroke: var(--accent); stroke-width: 3.5; }
.sch .nd { fill: var(--ink); }
.sch text { fill: var(--ink); font-family: var(--mono); font-size: 14px; }
.sch text.s { font-size: 12px; }
.sch text.big { font-size: 18px; font-weight: 700; }
.sch .m { fill: var(--muted); }
.sch .a { fill: var(--accent-ink); }
.sch .c { fill: var(--cool); }
.sch .g { fill: var(--good); }
.sch .b { fill: var(--bad); }
.sch .cur { stroke: var(--cool); stroke-width: 2.2; fill: none; }
.sch .curh { fill: var(--cool); }
.sch .flow { stroke: var(--accent); stroke-width: 4; fill: none; stroke-dasharray: 3 13; stroke-linecap: round; animation: flow var(--dur, 1s) linear infinite; }
.sch .zone { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 4; }
.sch .box { fill: var(--paper); stroke: var(--ink); stroke-width: 2.5; }
.sch .hit { cursor: pointer; fill: transparent; stroke: transparent; stroke-width: 18; }
@keyframes flow { to { stroke-dashoffset: -16; } }
.plot .grid { stroke: var(--line); stroke-width: 1; }
.plot .axis { stroke: var(--muted); stroke-width: 1.5; }
.plot text { fill: var(--muted); font-family: var(--mono); font-size: 12px; }
.plot text.lab { fill: var(--ink); font-size: 13px; font-weight: 700; }
.plot .s1 { stroke: var(--accent); stroke-width: 3; fill: none; }
.plot .s2 { stroke: var(--cool); stroke-width: 3; fill: none; }
.plot .s3 { stroke: var(--good); stroke-width: 3; fill: none; }
.plot .s4 { stroke: var(--bad); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.plot .s5 { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 4 4; }
.plot .ar1 { fill: var(--accent); opacity: 0.22; }
.plot .ar2 { fill: var(--cool); opacity: 0.18; }
.plot .ar3 { fill: var(--good); opacity: 0.16; }
.plot .mk { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
.plot .mk2 { fill: var(--cool); stroke: var(--card); stroke-width: 2; }
.plot .mkb { fill: var(--bad); stroke: var(--card); stroke-width: 2; }

/* hub */
.parts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.part-btn { width: 100%; text-align: left; display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.part-btn:hover { border-color: var(--ink); }
.part-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.part-btn > span { min-width: 0; }
.part-n { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-weight: 700; border: 2px solid var(--line); }
.part-btn.done .part-n { background: var(--good); border-color: var(--good); color: var(--card); }
.part-btn.next .part-n { border-color: var(--accent); color: var(--accent-ink); }
.part-t { font-weight: 700; display: block; }
.part-d { font-size: 15px; color: var(--muted); display: block; }
.part-m { font-family: var(--mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
.after { border: 2px solid var(--ink); border-radius: 14px; padding: 16px 18px; display: grid; gap: 8px; background: var(--card); }

nav.bottom { display: flex; justify-content: space-between; gap: 8px; }
nav.bottom .btn { min-width: 120px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
.ov { text-decoration: overline; }
.bits { display: flex; flex-wrap: wrap; gap: 6px; }
.bits .btn { min-width: 44px; font-family: var(--mono); font-weight: 700; }

/* code (HDL and assembly listings) */
pre.code { font-family: var(--mono); font-size: 14px; line-height: 1.5; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 0; overflow-x: auto; white-space: pre; color: var(--ink); }
pre.code .kw { color: var(--accent-ink); font-weight: 700; }
pre.code .cm { color: var(--muted); font-style: italic; }
pre.code .nm { color: var(--cool); }
pre.code .hl { background: var(--accent-soft); border-radius: 4px; }
code { font-family: var(--mono); font-size: .92em; background: var(--paper); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
</style>
</head>

   adds the shared helpers and sets window.BOOK to the book this page belongs to (window.BOOK_KEY). */
(function () {
  const all = window.BOOKS || {};
  Object.values(all).forEach((B) => {
    B.all = () => B.groups.flatMap((g) => g.items);
    B.chapters = () => B.all().filter((c) => typeof c.n === "number");
    B.find = (id) => B.all().find((c) => c.id === id);
    B.pdfName = (c) => B.pdfFile || B.pdfPrefix + c.pdf + ".pdf"; /* one-file books name the whole PDF */
    /* "pp. 26–75" for books whose file names are PDF pages, "pp. 1–54" (printed pages) when a chapter lists `pages`. */
    B.pagesLabel = (c) => (c.pages ? "book pp. " + c.pages : "pp. " + c.pdf).replace("-", "–") + (B.pdfFile && c.pages ? ", PDF pp. " + c.pdf.replace("-", "–") : "");
    B.probsLabel = (c) => (c.probs ? `page ${c.probs} of that PDF${c.probsBook && c.probsBook !== c.probs ? ` (book page ${c.probsBook})` : ""}` : "");
  });
  window.BOOK = all[window.BOOK_KEY] || null;
})();

<script>
/* Progress store shared by the contents page and every chapter page.
   Each chapter's state is { done: {p1: true}, last: {part, step} | null, say: {key: text}, t: ms }.
   It lives in two places:
     - localStorage "course-<id>": instant first paint, and the fallback when nothing else works.
     - the artifact's db, at data/users/<viewer id>/<chapter id>: private to the viewer, follows them
       across browsers and sessions. Only available when the page runs inside the claude.ai viewer. */
window.Progress = (function () {
  const LKEY = (id) => "course-" + id;
  const local = {
    get(id) { try { const v = localStorage.getItem(LKEY(id)); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
    set(id, v) { try { localStorage.setItem(LKEY(id), JSON.stringify(v)); } catch (e) {} },
  };
  const blank = () => ({ done: {}, last: null, say: {}, t: 0 });
  const norm = (s) => Object.assign(blank(), s || {}, { done: Object.assign({}, s && s.done), say: Object.assign({}, s && s.say) });

  /* Combine two copies: parts finished anywhere stay finished; the newer copy wins for position and text. */
  function merge(a, b) {
    a = norm(a); b = norm(b);
    const [old, neu] = a.t >= b.t ? [b, a] : [a, b];
    return { done: Object.assign({}, old.done, neu.done), last: neu.last, say: Object.assign({}, old.say, neu.say), t: neu.t };
  }
  const same = (a, b) => JSON.stringify(norm(a)) === JSON.stringify(norm(b));

  /* ---------- cloud ---------- */
  let status = "local"; // "local" | "cloud"
  const statusFns = [];
  const setStatus = (s) => { status = s; statusFns.forEach((f) => f(s)); };
  const cloud = (async () => {
    try {
      if (!window.claude || !window.claude.use) return null;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return null;
      const uid = await user.id();
      if (!uid) return null;
      const col = db.collection("data/users/" + uid);
      await col.limit(1).get(); // proves the store answers before we claim "saved to your account"
      setStatus("cloud");
      return col;
    } catch (e) { return null; }
  })();

  /* One write in flight per chapter; bursts collapse into the latest state. */
  const pending = {}, busy = {};
  async function flush(id) {
    const col = await cloud;
    if (!col || busy[id] || !pending[id]) return;
    busy[id] = true;
    const body = pending[id]; pending[id] = null;
    try { await col.doc(id).set(body); }
    catch (e) {
      if (e && e.code === "unavailable") { pending[id] = pending[id] || body; setTimeout(() => flush(id), 1500 + Math.random() * 1500); }
      else if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) setStatus("local");
    }
    busy[id] = false;
    if (pending[id]) flush(id);
  }
  const timers = {};
  function push(id, state, delay) {
    pending[id] = JSON.parse(JSON.stringify(norm(state)));
    clearTimeout(timers[id]);
    timers[id] = setTimeout(() => flush(id), delay);
  }

  return {
    /* Synchronous best guess from this browser. */
    load(id) { return norm(local.get(id)); },
    /* Save locally now, to the account shortly after. `delay` batches typing. */
    save(id, state, delay = 400) {
      state.t = Date.now();
      local.set(id, state);

    onStatus(fn) { statusFns.push(fn); fn(status); },

    });
    (o.texts || []).forEach((tx) => { s += `<text class="lab" x="${X(tx.x)}" y="${Y(tx.y)}" text-anchor="${tx.a || "start"}">${tx.s}</text>`; });
    return `<svg class="plot" viewBox="0 0 ${W} ${H}" style="max-width:${W}px" role="img" aria-label="${o.label || "Graph"}">${s}</svg>`;
  }

  /* ---------- UI helpers for widgets ---------- */
  function slider(o, onChange) {
    const wrap = el(`<div class="sl"><label for="${o.id}"><span>${o.label}</span><output></output></label><input type="range" id="${o.id}"></div>`);
    const inp = wrap.querySelector("input"), out = wrap.querySelector("output");
    if (o.log) { inp.min = 0; inp.max = 1000; inp.step = 1; }
    else { inp.min = o.min; inp.max = o.max; inp.step = o.step || (o.max - o.min) / 100; }
    const toT = (v) => (1000 * Math.log(v / o.min)) / Math.log(o.max / o.min);
    const get = () => (o.log ? o.min * Math.pow(o.max / o.min, inp.value / 1000) : +inp.value);
    const show = () => { out.textContent = o.show ? o.show(get()) : fmt(get()); };
    inp.value = o.log ? toT(o.value) : o.value;
    show();
    inp.addEventListener("input", () => { show(); onChange && onChange(get()); });
    return { el: wrap, get, set(v) { inp.value = o.log ? toT(v) : v; show(); onChange && onChange(get()); } };
  }
  function toggle(labels, onPick, start = 0) {
    const r = el(`<div class="row" role="group"></div>`);
    labels.forEach((lab, i) => {
      const b = el(`<button type="button" class="btn small" aria-pressed="${i === start}">${lab}</button>`);
      b.addEventListener("click", () => { r.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); onPick(i); });
      r.appendChild(b);
    });
    return r;
  }
  const readout = (pairs) => `<div class="readout">${pairs.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join("")}</div>`;

  /* ---------- blocks ---------- */
  function mcq(b) {
    const n = el(`<div class="q">${b.q ? `<p class="qq">${b.q}</p>` : ""}${b.fig || ""}<div class="choices"></div><div class="feedback" aria-live="polite" hidden></div></div>`);
    const ch = n.querySelector(".choices"), fb = n.querySelector(".feedback");
    b.opts.forEach(([txt, ok, why]) => {
      const btn = el(`<button type="button" class="btn choice">${txt}</button>`);
      btn.addEventListener("click", () => {
        fb.hidden = false;
        fb.className = "feedback " + (ok ? "ok" : "no");
        fb.innerHTML = (ok ? "<b>Yes.</b> " : "<b>Not this one.</b> ") + (why || "");
        btn.classList.add(ok ? "right" : "wrong");
        if (ok) ch.querySelectorAll("button").forEach((x) => (x.disabled = x !== btn));
      });
      ch.appendChild(btn);
    });
    return n;
  }
  function num(b, id) {
    const n = el(`<div class="q"><p class="qq">${b.q}</p>${b.fig || ""}<form class="num" novalidate><input id="${id}" inputmode="decimal" autocomplete="off" aria-label="Your answer"><span class="mono">${b.unit || ""}</span><button class="btn primary" type="submit">Check</button></form><div class="feedback" aria-live="polite" hidden></div></div>`);
    const fb = n.querySelector(".feedback"), inp = n.querySelector("input");
    let tries = 0;
    n.querySelector("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const v = parseFloat(String(inp.value).replace(",", ".").replace("−", "-"));
      fb.hidden = false;
      if (isNaN(v)) { fb.className = "feedback"; fb.textContent = "Type a number first."; return; }
      const tol = b.tol != null ? b.tol : 0.02;
      const ok = b.a === 0 ? Math.abs(v) < 1e-9 : Math.abs(v - b.a) <= Math.abs(b.a) * tol;
      tries++;
      if (ok) { fb.className = "feedback ok"; fb.innerHTML = "<b>Yes.</b> " + (b.why || ""); }
      else { fb.className = "feedback no"; fb.innerHTML = "<b>Not yet.</b> " + (tries >= 2 && b.hint2 ? b.hint2 : b.hint || "Check your units and signs."); }
    });
    return n;
  }
  /* Say-it-back answers live in the chapter's progress state; start() points this at it. */
  let says = { get: (k) => store.get(k, ""), set: (k, v) => store.set(k, v) };
  function say(b, id, key) {
    const n = el(`<div class="q"><p class="qq">${b.q}</p><textarea id="${id}" placeholder="Type your answer in your own words. Rough is fine."></textarea><div class="row"><button type="button" class="btn primary">Compare with mine</button></div><div class="model" hidden><span class="lbl">One good answer</span><div>${b.model}</div><p class="aside">Did yours get the same core idea? Wording doesn't matter. If you're unsure, paste yours into the chat and ask for feedback.</p></div></div>`);
    const ta = n.querySelector("textarea");
    ta.value = says.get(key);
    ta.addEventListener("input", () => says.set(key, ta.value));
    n.querySelector("button").addEventListener("click", () => { n.querySelector(".model").hidden = false; });
    return n;
  }
  function sort(b) {
    const n = el(`<div class="q">${b.q ? `<p class="qq">${b.q}</p>` : ""}<div class="sort"></div><div class="row"><button type="button" class="btn primary sort-check">Check my sorting</button></div><div class="feedback" aria-live="polite" hidden></div></div>`);
    const box = n.querySelector(".sort"), picks = [];
    b.items.forEach(([label], i) => {
      const it = el(`<div class="sort-item"><span>${label}</span></div>`);
      it.appendChild(toggle(b.bins, (k) => (picks[i] = k), -1));
      it.appendChild(el(`<div class="why" hidden></div>`));
      box.appendChild(it);
    });
    n.querySelector(".sort-check").addEventListener("click", () => {
      let right = 0;
      b.items.forEach(([, bin, why], i) => {
        const it = box.children[i], ok = picks[i] === bin;
        if (ok) right++;
        it.classList.toggle("right", ok); it.classList.toggle("wrong", !ok);
        const w = it.querySelector(".why"); w.hidden = false;
        w.innerHTML = (picks[i] == null ? "<b>Not sorted yet.</b> " : "") + (ok ? "" : `<b>Belongs in “${b.bins[bin]}”.</b> `) + (why || "");
      });
      const fb = n.querySelector(".feedback"); fb.hidden = false;
      fb.className = "feedback " + (right === b.items.length ? "ok" : "no");
      fb.innerHTML = `<b>${right} of ${b.items.length}</b> sorted correctly. ${right === b.items.length ? "" : "Read the notes on the red ones."}`;
    });
    return n;
  }
  function reveal(b) {
    const n = el(`<div class="q"><div class="row"><button type="button" class="btn">${b.label || "Show me"}</button></div><div hidden>${b.html}</div></div>`);
    n.querySelector("button").addEventListener("click", (e) => { n.lastElementChild.hidden = false; e.currentTarget.disabled = true; });
    return n;
  }
  function renderBlock(b, id, key) {
    if (typeof b === "string") return el(`<div>${b}</div>`);
    if (typeof b === "function") { const h = el(`<div class="widget" style="display:grid;gap:12px;min-width:0"></div>`); b(h, id); return h; }
    if (b.t === "mcq") return mcq(b);
    if (b.t === "num") return num(b, id);
    if (b.t === "say") return say(b, id, key);
    if (b.t === "sort") return sort(b);
    if (b.t === "reveal") return reveal(b);
    return el(`<div>${b.html || ""}</div>`);
  }

  /* ---------- subscripts: "v_TH" in any text renders as v<sub>TH</sub> (tspan inside SVG).
     A subscript stops before a letter that starts the next subscripted name, so "g_mR_D" reads g<sub>m</sub>R<sub>D</sub>. ---------- */
  const SUBRE = /([A-Za-zΔβμαθωφτγ′])_([A-Za-z0-9]+?)(?=[A-Za-zΔβμαθωφτγ′]_|[^A-Za-z0-9]|$)/g, SVGNS = "http://www.w3.org/2000/svg";
  function subify(root) {
    if (!root || !document.createTreeWalker) return;
    const w = document.createTreeWalker(root, 4 /* text */), hits = [];
    for (let n = w.nextNode(); n; n = w.nextNode()) {
      const p = n.parentNode;
      if (n.nodeValue.indexOf("_") < 0 || !p || /^(script|style|textarea|sub|tspan|title|code|pre)$/i.test(p.nodeName) || (p.closest && p.closest("pre, code"))) continue;
      SUBRE.lastIndex = 0;
      if (SUBRE.test(n.nodeValue)) hits.push(n);
    }
    hits.forEach((n) => {
      const svg = n.parentNode.namespaceURI === SVGNS, s = n.nodeValue, frag = document.createDocumentFragment();
      let last = 0, m;
      SUBRE.lastIndex = 0;
      while ((m = SUBRE.exec(s))) {
        frag.appendChild(document.createTextNode(s.slice(last, m.index) + m[1]));
        const sub = svg ? document.createElementNS(SVGNS, "tspan") : document.createElement("sub");
        if (svg) { sub.setAttribute("baseline-shift", "sub"); sub.setAttribute("font-size", "75%"); }
        sub.textContent = m[2];
        frag.appendChild(sub);
        last = m.index + m[0].length;
      }
      frag.appendChild(document.createTextNode(s.slice(last)));
      n.parentNode.replaceChild(frag, n);
    });
  }
  function watchSubs(root) {
    subify(root);
    if (!window.MutationObserver) return;
    new MutationObserver((ms) => ms.forEach((m) => m.addedNodes.forEach((a) => subify(a.nodeType === 3 ? a.parentNode : a)))).observe(root, { childList: true, subtree: true });
  }

  /* ---------- app ---------- */
  const KIND = { learn: "Learn", play: "Play", predict: "Predict first", why: "Why?", whatif: "What if…", bug: "Spot the mistake", check: "Quick check", say: "Say it back", math: "Math boost" };

  function start(C) {
    const KEY = "course-" + C.id, P = window.Progress;
    const state = P ? P.load(C.id) : store.get(KEY, { done: {}, last: null, say: {} });
    state.say = state.say || {};
    const save = (delay) => (P ? P.save(C.id, state, delay) : store.set(KEY, state));
    says = {
      get: (k) => (k in state.say ? state.say[k] : store.get(k, "")), // older builds kept answers under their own keys
      set: (k, v) => { state.say[k] = v; save(1500); },
    };
    const root = document.getElementById("app");
    watchSubs(root);
    let view = { part: null, step: 0 };

    /* Book navigation: chapter pages sit in the book's folder, its contents page one level up. */
    const B = window.BOOK;
    const bookLink = () => (B ? `<a class="book-link" href="../${B.home}">← Contents</a> · ` : "");
    /* Where this chapter lives in the real book, so the problems are easy to find afterwards. */
    const U = (B && B.unit) || "Chapter", u = U.toLowerCase();
    /* Cross-book links: a math module lists the chapters that use it; a chapter lists the math modules it needs. */
    const BOOKS = Object.values(window.BOOKS || {});
    function chapterRef(id) {
      for (const K of BOOKS) {
        if (K.key === "math" || !K.find) continue;
        const c = K.find(id);
        if (c && c.file) return `<a href="../${K.dir}/${c.file}" title="${c.title}">${K.short} ${typeof c.n === "number" ? "Ch" : "App"} ${c.n}</a>`;
      }
      return "";
    }
    function mathLinks() {
      const M = window.BOOKS && window.BOOKS.math;
      if (!M || !M.all || (B && B.key === "math")) return "";
      const href = (m) => (m.file.startsWith("../") ? m.file : "../math/" + m.file);
      const list = (key) => M.all().filter((m) => m.file && (m[key] || []).includes(C.id)).map((m) => `<a href="${href(m)}">${m.title}</a>`).join(" · ");
      const need = list("needs"), also = list("also");
      return (need ? `<p class="aside where-book">Math you'll use: ${need}</p>` : "") + (also ? `<p class="aside where-book">Going further (optional): ${also}</p>` : "");
    }
    function whereInBook() {
      const me = B && B.find(C.id);
      if (me && B.noPdf) {
        const used = (me.needs || []).map(chapterRef).filter(Boolean), pairs = (me.also || []).map(chapterRef).filter(Boolean);
        return (used.length ? `<p class="aside where-book">Used in: ${used.join(" · ")}</p>` : "") + (pairs.length ? `<p class="aside where-book">Not in the books, but pairs with: ${pairs.join(" · ")}</p>` : "");
      }
      if (!me || !me.pdf) return mathLinks();
      return `<p class="aside where-book">${B.short}, ${typeof me.n === "number" ? "Chapter" : "Appendix"} ${me.n} · ${B.pagesLabel(me)}${B.pdfFile ? "" : ` · PDF file ending “-${me.pdf}.pdf”`}${me.probs ? ` · problems from ${B.probsLabel(me)}` : ""}</p>` + mathLinks();
    }
    function problemsNote() {
      const me = B && B.find(C.id);
      if (!me || !me.probs) return "";
      return `<div class="key"><b>Your book problems:</b> open <span class="mono">${B.pdfName(me)}</span> and go to ${B.probsLabel(me)}.</div>`;
    }
    const isAppPage = () => { const m = B && B.find(C.id); return !!m && typeof m.n !== "number"; };
    function nextChapter() {
      if (!B) return "";
      const me = B.find(C.id), isApp = !!me && typeof me.n !== "number";
      const list = isApp ? B.all().filter((c) => typeof c.n !== "number" && c.file) : B.chapters(), i = list.findIndex((c) => c.id === C.id), nx = list[i + 1];
      const ans = B.answers && !isApp ? `<p class="aside">The book has short answers to some problems (${B.answers.label}, pages ${B.answers.pdf.replace("-", "–")}). Look only after you've committed to your own answer.</p>` : "";
      if (!nx) return ans + `<p><a href="../${B.home}">← Back to the contents</a></p>`;
      return ans + (nx.file
        ? `<p>Then: <a href="${nx.file}">${isApp ? "Appendix" : U} ${nx.n} · ${nx.title} →</a></p>`
        : `<p>Next up: ${U} ${nx.n} · ${nx.title}. Its tutorial isn't built yet. Ask Claude for it when you're ready.</p>`);
    }

    function hub() {
      view = { part: null, step: 0 };
      const firstOpen = C.parts.findIndex((p) => !state.done[p.id]);
      const node = el(`<div class="wrap">
        <header class="top"><div class="eyebrow">${bookLink()}${C.eyebrow}</div><h1>${C.title}</h1>${whereInBook()}</header>
        <section class="card"><span class="tag">How this ${isAppPage() ? "appendix" : u} works</span>${C.intro}</section>
        <ol class="parts" aria-label="Parts of this ${u}"></ol>
        <section class="after"><h3 style="font-family:var(--display);margin:0">After the last part</h3>${problemsNote()}${C.after}${nextChapter()}</section>
        <p class="aside save-note"></p>
      </div>`);
      if (P) P.onStatus((s) => { const n = node.querySelector(".save-note"); if (n) n.textContent = s === "cloud" ? "Progress saves to your Claude account, so it follows you to any browser." : "Progress saves in this browser only."; });
      const list = node.querySelector(".parts");
      C.parts.forEach((p, i) => {
        const done = !!state.done[p.id];
        const cls = done ? "done" : i === firstOpen ? "next" : "";
        const b = el(`<li><button type="button" class="part-btn ${cls}"><span class="part-n">${done ? "✓" : i + 1}</span><span><span class="part-t">${p.title}</span><span class="part-d">${p.blurb}</span></span><span class="part-m">${p.mins} min</span></button></li>`);
        b.querySelector("button").addEventListener("click", () => openPart(i, state.last && state.last.part === i ? state.last.step : 0));
        list.appendChild(b);
      });
      const sum = el(`<li><button type="button" class="part-btn"><span class="part-n">Σ</span><span><span class="part-t">${U} summary</span><span class="part-d">Every key idea and formula on one page. Keep it open while you do the problems.</span></span><span class="part-m">ref</span></button></li>`);
      sum.querySelector("button").addEventListener("click", summary);
      list.appendChild(sum);
      if (state.last && state.last.part != null && C.parts[state.last.part]) {
        const p = C.parts[state.last.part];
        const cont = el(`<div class="row"><button type="button" class="btn primary">Continue: Part ${state.last.part + 1}, step ${state.last.step + 1}</button><span class="aside">${p.title}</span></div>`);
        cont.querySelector("button").addEventListener("click", () => openPart(state.last.part, state.last.step));
        node.querySelector(".card").after(cont);
      }
      root.replaceChildren(node);
      window.scrollTo(0, 0);
    }

    function summary() {
      view = { part: null, step: 0 };
      const node = el(`<div class="wrap"><header class="top"><div class="eyebrow"><button type="button">← ${C.eyebrow}</button></div><h1>${U} summary</h1></header><section class="card">${C.summary}</section><nav class="bottom"><button type="button" class="btn ghost">← ${U} map</button><span></span></nav></div>`);
      node.querySelectorAll(".eyebrow button, nav .btn").forEach((b) => b.addEventListener("click", hub));
      root.replaceChildren(node);
      window.scrollTo(0, 0);
    }

    function openPart(pi, si0 = 0) {
      const P = C.parts[pi];
      const node = el(`<div class="wrap">
        <header class="top"><div class="eyebrow"><button type="button">← ${C.eyebrow}</button> · Part ${pi + 1} of ${C.parts.length}</div><h1>${P.title}</h1>
        <div class="rail" aria-label="Steps"></div><div class="where"></div></header>
        <main></main>
        <nav class="bottom"><button type="button" class="btn ghost" data-back>← Back</button><button type="button" class="btn primary" data-next>Next →</button></nav></div>`);
      node.querySelector(".eyebrow button").addEventListener("click", hub);
      root.replaceChildren(node);
      const rail = node.querySelector(".rail"), where = node.querySelector(".where"), main = node.querySelector("main");
      const back = node.querySelector("[data-back]"), next = node.querySelector("[data-next]");
      const N = P.steps.length;

      function show(i) {
        i = Math.max(0, Math.min(N, i));
        view = { part: pi, step: i };
        if (i === N) return finish();
        state.last = { part: pi, step: i }; save();
        const st = P.steps[i];
        const card = el(`<section class="card"><span class="tag k-${st.k}">${KIND[st.k] || st.k}</span>${st.title ? `<h2>${st.title}</h2>` : ""}</section>`);
        (st.b || []).forEach((b, j) => card.appendChild(renderBlock(b, `${C.id}-${P.id}-s${i}-b${j}`, `${KEY}-say-${P.id}-${i}-${j}`)));
        main.replaceChildren(card);
        rail.innerHTML = P.steps.map((s, k) => `<button type="button" class="${k < i ? "done" : k === i ? "now" : ""}" aria-label="Step ${k + 1}" ${k === i ? 'aria-current="step"' : ""} data-i="${k}"></button>`).join("");
        rail.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => show(+b.dataset.i)));
        where.innerHTML = `Step <b>${i + 1}</b> of ${N} · ${KIND[st.k] || st.k}`;
        back.disabled = i === 0;
        next.hidden = false;
        next.textContent = i === N - 1 ? "Finish part ✓" : "Next →";
        window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
      }
      function finish() {
        state.done[P.id] = true;
        state.last = pi + 1 < C.parts.length ? { part: pi + 1, step: 0 } : null;
        save();
        const hasNext = pi + 1 < C.parts.length;
        const card = el(`<section class="card"><span class="tag k-check">Part ${pi + 1} complete</span><h2>Your takeaway</h2><div class="key">${P.takeaway}</div>
          <p class="aside">Good moment for a short break. Stand up, drink some water, then come back.</p>
          <div class="row">${hasNext ? `<button type="button" class="btn primary" data-np>Part ${pi + 2}: ${C.parts[pi + 1].title} →</button>` : `<button type="button" class="btn primary" data-sum>Open the ${u} summary</button>`}<button type="button" class="btn ghost" data-hub>Chapter map</button></div></section>`);
        main.replaceChildren(card);
        rail.querySelectorAll("button").forEach((b) => (b.className = "done"));
        where.innerHTML = `<b>Done</b> · ${N} steps`;
        back.disabled = false;
        next.hidden = true;
        card.querySelector("[data-hub]").addEventListener("click", hub);
        if (hasNext) card.querySelector("[data-np]").addEventListener("click", () => openPart(pi + 1, 0));
        else card.querySelector("[data-sum]").addEventListener("click", summary);
        window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
      }
      back.addEventListener("click", () => show(view.step - 1));
      next.addEventListener("click", () => show(view.step + 1));
      show(si0);
    }

    document.addEventListener("keydown", (e) => {
      if (view.part == null) return;
      if (e.target.closest && e.target.closest("input, textarea, select")) return;
      const nb = document.querySelector("[data-next]"), bb = document.querySelector("[data-back]");
      if (e.key === "ArrowRight" && nb && !nb.hidden) nb.click();
      if (e.key === "ArrowLeft" && bb && !bb.disabled) bb.click();
    });

    const m = /^#p(\d+)$/.exec(location.hash || "");
    /* #resume (from the library's Resume card): the saved step, else the first unfinished part, else the map. */
    const L = state.last, todo = C.parts.findIndex((p) => !state.done[p.id]);
    if (m && C.parts[+m[1] - 1]) openPart(+m[1] - 1, 0);
    else if (location.hash === "#resume" && L && C.parts[L.part]) openPart(L.part, L.step);
    else if (location.hash === "#resume" && todo >= 0) openPart(todo, 0);
    else hub();
    if (P) P.sync(C.id, state, () => { if (view.part == null) hub(); });
  }

  return { start, S, plot, slider, toggle, readout, fmt, si, el, reduce, store };
})();
</script>
<script>
(function () {
  const { S, plot, slider, toggle, readout, fmt, si, el } = Course;
  const fig = (svg) => `<div class="fig">${svg}</div>`;
  /* A short "you've already learned this" card that links back into the 6.002 book. */
  const seen = (html, href, where) => `<div class="key"><b>Seen in 6.002:</b> ${html} <a href="../chapters/${href}">${where} →</a></div>`;
  const ch = (n, file, part, where, html) => `<p class="aside">${html} <a href="${file}#${part}">Boylestad Chapter ${n}, ${where} →</a></p>`;
  const off = (s) => `<g opacity="0.3">${s}</g>`;
  const par = (...r) => 1 / r.reduce((a, x) => a + 1 / x, 0);
  const ohm = (r) => si(r, "Ω");
  const VT = 0.026;

  /* BJT symbol. Base lead from (x−30,y); collector ends at (x+22,y−50); emitter at (x+22,y+50). */
  function bjt(x, y, o = {}) {
    const c = o.cls ? " " + o.cls : "", L = Math.hypot(22, 19), ux = 22 / L, uy = 19 / L;
    let s = `<line class="w${c}" x1="${x - 30}" y1="${y}" x2="${x}" y2="${y}"/><line class="w${c}" x1="${x}" y1="${y - 20}" x2="${x}" y2="${y + 20}" style="stroke-width:3.5"/>`;
    s += `<polyline class="w${c}" points="${x},${y - 9} ${x + 22},${y - 28} ${x + 22},${y - 50}"/><polyline class="w${c}" points="${x},${y + 9} ${x + 22},${y + 28} ${x + 22},${y + 50}"/>`;
    const d = o.pnp ? -1 : 1, t = o.pnp ? 0.3 : 0.85, tx = x + 22 * t, ty = y + 9 + 19 * t, bx = tx - d * 9 * ux, by = ty - d * 9 * uy;
    s += `<polygon class="nd" points="${tx},${ty} ${bx - 5 * uy},${by + 5 * ux} ${bx + 5 * uy},${by - 5 * ux}"/>`;
    return s;
  }

  /* Small-signal common-emitter model drawn between a top rail (y=40) and a common bottom rail (y=170).
     o.rs: add V_s and R_s.  o.rin: label of the shunt resistor at the input (R_B, R′…).  o.zb: label of the base resistor.
     o.ro: draw r_o.  o.rc: collector resistor label.  o.rl: add a load.  o.zi / o.zo: show Z_i and Z_o markers. */
  function ceFig(o = {}) {
    const T = 40, B = 170, M = 105;
    let s = "", x = 60;
    s += S.vsrc(60, M, o.rs ? "V_s" : "V_i") + S.wire([60, M - 18], [60, T]) + S.wire([60, M + 18], [60, B]);
    if (o.rs) { s += S.res(60, T, 140, T, "R_s"); x = 140; s += S.t(146, T + 18, "V_i", { a: "start", cls: "a s" }); }
    const xr = x + 50, xb = o.rin ? xr + 80 : xr;
    s += S.wire([x, T], [xb, T]);
    if (o.rin) s += S.res(xr, T, xr, B, o.rin, { side: "right" }) + S.dot(xr, T) + S.dot(xr, B);
    s += S.res(xb, T, xb, B, o.zb || "βr_e", { side: "right" }) + S.t(xb, T - 8, "b", { cls: "s m" }) + S.t(xb - 12, B - 6, "e", { cls: "s m", a: "end" });
    const xi = xb + 110;
    s += S.isrc(xi, M, "βI_b", { down: true, side: "right" }) + S.wire([xi, M - 18], [xi, T]) + S.wire([xi, M + 18], [xi, B]) + S.t(xi, T - 8, "c", { cls: "s m" });
    let xe = xi;
    const add = (lab, cls) => { xe += 85; s += S.res(xe, T, xe, B, lab, { side: "right", cls }) + S.dot(xe, T) + S.dot(xe, B); };
    if (o.ro) add("r_o");
    if (o.rc !== null) add(o.rc || "R_C");
    if (o.rl) add("R_L", "hl");
    s += S.wire([xi, T], [xe + 40, T]) + S.dot(xe + 40, T) + S.t(xe + 40, T - 10, "V_o", { cls: "a" });
    s += S.wire([60, B], [xe + 40, B]) + S.dot(xe + 40, B);
    if (o.zi) s += S.t(xr - 14, B + 26, "Z_i →", { a: "end", cls: "c s" });
    if (o.zo) s += S.t(xe + 40, B + 26, "← Z_o", { a: "end", cls: "c s" });
    return S.svg(xe + 70, 205, s, { max: xe + 70, label: o.label || "Small-signal re model of a common-emitter amplifier" });
  }

  /* Input and output waveforms: v_i (small, blue) and v_o (orange), normalized. gain < 0 means inverted. */
  function waves(gain, o = {}) {
    const inv = gain < 0, A = o.big ? 1 : 0.85, ai = o.ai != null ? o.ai : 0.3;
    const out = (t) => (inv ? -1 : 1) * A * Math.sin(2 * Math.PI * t);
    return plot({ x: [0, 2], y: [-1.2, 1.2], xt: [0, 0.5, 1, 1.5, 2], yt: [0], ytf: () => "0", xl: "time (cycles)", h: o.h || 200,
      series: [{ f: (t) => ai * Math.sin(2 * Math.PI * t), cls: "s2" }, { f: out, cls: "s1" }],
      texts: [{ x: 0.27, y: ai + 0.12, s: o.li || "v_i" }, { x: inv ? 0.75 : 0.3, y: inv ? 1.0 : A + 0.12, s: o.lo || "v_o" }], label: "Input and output waveforms" });
  }

  /* The voltage-divider amplifier, drawn in four stages of being turned into its ac equivalent. */
  function acSteps(k) {
    const hi = (x) => (x ? "hl" : "");
    let s = "";
    const supply = S.supply(200, 40, "V_CC");
    s += k >= 1 ? off(supply) + S.t(210, 14, "V_CC → 0 V: top rail is ground", { a: "start", cls: "a s" }) : supply;
    s += S.wire([150, 40], [252, 40]) + (k >= 1 ? S.wc("hl", [150, 40], [252, 40]) : "");
    s += S.res(150, 40, 150, 170, "R_1", { side: "left" }) + S.res(252, 40, 252, 100, "R_C", { side: "left" }) + S.wire([252, 100], [252, 120]) + S.dot(252, 100);
    s += bjt(230, 170) + S.wire([150, 170], [200, 170]) + S.dot(150, 170);
    s += S.res(150, 170, 150, 290, "R_2", { side: "left" }) + S.gnd(150, 290);
    s += S.vsrc(40, 230, "v_i") + S.wire([40, 212], [40, 170], [70, 170]) + S.wire([40, 248], [40, 290]) + S.gnd(40, 290);
    s += k >= 2 ? S.wc("hl", [70, 170], [150, 170]) + S.wc("hl", [252, 100], [340, 100]) : S.cap(70, 170, 150, 170, "C_1") + S.cap(252, 100, 330, 100, "C_2", { side: "below" }) + S.wire([330, 100], [340, 100]);
    s += S.dot(340, 100) + S.t(350, 105, "v_o", { a: "start", cls: "a" });
    s += S.wire([252, 220], [252, 235]) + S.dot(252, 235) + S.wire([252, 235], [320, 235]) + S.wire([252, 300], [320, 300]) + S.gnd(286, 300);
    const re = S.res(252, 235, 252, 300, "R_E", { side: "left" });
    s += k >= 3 ? off(re) + S.t(238, 268, "✕", { cls: "b", a: "end" }) : k >= 2 ? re : re;
    s += k >= 2 ? S.wc("hl", [320, 235], [320, 300]) : S.cap(320, 235, 320, 300, "C_E", { side: "right" });
    return S.svg(430, 330, s, { max: 430, label: "Voltage-divider amplifier being reduced to its ac equivalent" });
  }
  function acRedrawn() {
    let s = S.vsrc(50, 150, "v_i") + S.wire([50, 132], [50, 60], [230, 60]) + S.wire([50, 168], [50, 250], [420, 250]);
    s += S.res(120, 60, 120, 250, "R_1", { side: "right" }) + S.res(190, 60, 190, 250, "R_2", { side: "right" }) + S.dot(120, 60) + S.dot(190, 60) + S.dot(120, 250) + S.dot(190, 250);
    s += S.wire([230, 60], [230, 150], [270, 150]) + bjt(300, 150) + S.wire([322, 200], [322, 250]) + S.wire([322, 100], [322, 60], [420, 60]);
    s += S.res(390, 60, 390, 250, "R_C", { side: "right" }) + S.dot(390, 60) + S.dot(390, 250) + S.dot(322, 250) + S.t(420, 50, "v_o", { cls: "a" });
    s += S.t(155, 285, "R′ = R_1 ∥ R_2", { cls: "s c" });
    return S.svg(460, 300, s, { max: 460, label: "The ac equivalent redrawn: R1 and R2 in parallel at the input, RC from collector to ground" });
  }

  /* =============== PART 1 =============== */
  const p1 = {
    id: "p1", title: "Where does the extra power come from?", mins: 20,

    steps: [
      { k: "learn", title: "Power from nowhere?", b: [
        `<p>An amplifier's output signal carries more ac power than its input signal. Energy can't be created. So where does the extra come from?</p>`,
        `<div class="key">From the <b>DC supply</b>. The transistor acts as a valve: the tiny input signal opens and closes it, and the valve steers a big steady current from the supply into an ac current through the load.</div>`,
        `<div class="eq">efficiency η = P<sub>o(ac)</sub> / P<sub>i(dc)</sub>    (ac power to the load ÷ DC power supplied)</div>`,

              series: [{ pts: [[0, Idc], [2, Idc]], cls: "s5" }, { f: iT, cls: "s1", n: 400 }], texts: [{ x: 1.55, y: Idc + 0.35, s: "I_dc" }], label: "Total current: DC level plus the ac swing" });

      ]},
      { k: "learn", title: "Two analyses, one link", b: [
        seen("Small-signal analysis: bias at an operating point, then treat small wiggles with a linear circuit.", "08-small-signal-model.html#p3", "Chapter 8, Part 3"),

        { t: "mcq", q: "In the ac equivalent, why is R_C connected from the collector to ground?", opts: [
          ["Because its top end sat on V_CC, and V_CC becomes ground for ac", true, "A DC supply holds its voltage constant, so it has no ac voltage on it: for the signal it's the same as ground."],

        ]},
      ]},
      { k: "learn", title: "Directions and definitions", b: [
        `<p>Every system, from one transistor to a whole chip, gets the same four labels:</p>`,
        `<div class="two"><div class="tile"><h3>Z<sub>i</sub> = V<sub>i</sub>/I<sub>i</sub></h3><p>Impedance "looking into" the input.</p></div><div class="tile"><h3>Z<sub>o</sub> = V<sub>o</sub>/I<sub>o</sub></h3><p>Impedance "looking back into" the output, with the signal set to zero.</p></div></div>`,
        `<div class="key">By definition both <b>I<sub>i</sub> and I<sub>o</sub> flow <i>into</i> the system</b>. If the real output current flows out, its value gets a minus sign. That convention keeps Z<sub>i</sub> and Z<sub>o</sub> positive.</div>`,

      ]},
      { k: "say", title: "Say it back", b: [
        { t: "say", q: "How can an amplifier put out more signal power than it takes in?", model: "The extra power comes from the DC supply. The transistor uses the small input signal to control the large DC current, converting part of the DC power into ac power at the output. The output can't swing past the limits set by the DC operating point, or it clips." },
      ]},
    ],
  };

  /* =============== PART 2 =============== */
  const p2 = {
    id: "p2", title: "The re model", mins: 25,
    blurb: "Replace the transistor with a resistor and a current source. One value comes from the DC current.",
    takeaway: "Common emitter: the base–emitter diode becomes its ac resistance r_e = 26 mV/I_E (I_E from the DC analysis). Looking into the base you see (β + 1)r_e ≈ βr_e, because the emitter current is (β + 1) times the base current. The output is a current source βI_b, with r_o in parallel. r_o comes from the curves' slope: extend them to the Early voltage −V_A, then r_o = (V_A + V_CEQ)/I_CQ ≈ V_A/I_CQ. Typical: βr_e from a few hundred Ω to 6–7 kΩ; r_o 40–50 kΩ. Common base: input r_e (a few Ω to about 50 Ω), output αI_e, r_o in the MΩ range. For the common collector use the CE model. npn and pnp have the same ac model.",
    steps: [
      { k: "learn", title: "A model is a stand-in", b: [
        `<p>A <b>model</b> is a set of ordinary circuit elements that behaves like the device, under specific operating conditions. Swap it in for the transistor symbol and use the circuit methods you already know.</p>`,
        `<div class="two"><div class="tile"><h3>r<sub>e</sub> model</h3><p>Built from the actual operating point. The book's main model.</p></div><div class="tile"><h3>Hybrid (h) model</h3><p>Values from the datasheet, at the maker's operating point.</p></div><div class="tile"><h3>Hybrid π model</h3><p>Adds parts that matter at high frequency (Chapter 9).</p></div></div>`,
      ]},
      { k: "learn", title: "The input: a diode becomes a resistor", b: [
        `<p>Looking into the base, you see the base–emitter junction: a forward-biased diode carrying I<sub>E</sub>. For small signals, a diode is a resistor:</p>`,
        `<div class="eq">r<sub>e</sub> = 26 mV / I<sub>E</sub>    (I<sub>E</sub> from the DC analysis)</div>`,
        ch(1, "01-semiconductor-diodes.html", "p6", "Part 6", "Same idea as the diode's r<sub>d</sub> = 26 mV/I<sub>D</sub>."),
        { t: "num", q: "The DC analysis gives I_E = 1.3 mA. What's r_e?", a: 20, unit: "Ω", hint: "26 mV ÷ 1.3 mA. mV/mA gives ohms.", why: "26/1.3 = 20 Ω. Double the current and r_e halves." },
      ]},
      { k: "why", title: "Why the base sees β times more", b: [
        `<p>r<sub>e</sub> carries the <b>emitter</b> current, but the signal source only supplies the <b>base</b> current. So:</p>`,
        `<div class="eq">V<sub>be</sub> = I<sub>e</sub>r<sub>e</sub> = (β + 1)I<sub>b</sub>r<sub>e</sub>    so    Z<sub>i</sub> = V<sub>be</sub>/I<sub>b</sub> = (β + 1)r<sub>e</sub> ≅ βr<sub>e</sub></div>`,
        `<p>Viewed from the base, any resistance in the emitter looks (β + 1) times bigger. This "reflection" rule comes back again and again in this chapter.</p>`,
        { t: "num", q: "β = 150 and r_e = 20 Ω. What resistance does the signal see looking into the base?", a: 3000, unit: "Ω", hint: "βr_e.", why: "150 × 20 = 3 kΩ. (β + 1)r_e = 3.02 kΩ: the difference doesn't matter." },
      ]},
      { k: "learn", title: "The output: a current source", b: [
        `<p>If the output curves were perfectly flat and evenly spaced, the collector current would be exactly βI<sub>b</sub>, whatever the collector voltage. That's a <b>controlled current source</b>.</p>`,
        fig(ceFig({ zb: "βr_e", rc: null, label: "re model: βre between base and emitter, a βIb current source from collector to emitter" })),
        `<p class="aside">The input and output are now separate loops, linked only by the controlled source. Much easier to analyze than a diode wired into the output.</p>`,
      ]},
      { k: "play", title: "Early voltage and r_o", b: [
        (host, id) => {
          const f = el(`<div class="fig"></div>`), ro = el(`<div></div>`);

          function draw() {

            const series = [10, 20, 30, 40].map((k) => ({ f: (v) => ic(k, v), from: -VA, to: 20, cls: k === IB ? "s1" : "s5" }));
            series.push(...[10, 20, 30, 40].map((k) => ({ f: (v) => ic(k, v), from: 0.3, to: 20, cls: k === IB ? "s1" : "s2" })));
            f.innerHTML = plot({ x: [-VA - 10, 20], y: [0, 6], xt: [-VA, -VA / 2, 0, 10, 20], yt: [0, 2, 4, 6], xl: "V_CE (V)", yl: "I_C (mA)", series, marks: [{ x: VQ, y: IQ }, { x: -VA, y: 0, cls: "mk2" }], texts: [{ x: -VA + 4, y: 0.6, s: "−V_A" }], label: "Output curves extended back to meet at the Early voltage" });
            const exact = (VA + VQ) / (IQ / 1000), approx = VA / (IQ / 1000);
            ro.innerHTML = readout([["I<sub>CQ</sub>", fmt(IQ, 3) + " mA"], ["r<sub>o</sub> = (V<sub>A</sub> + V<sub>CEQ</sub>)/I<sub>CQ</sub>", ohm(exact)], ["r<sub>o</sub> ≈ V<sub>A</sub>/I<sub>CQ</sub>", ohm(approx)]]);
          }
          host.append(f, slider({ id: id + "-va", label: "Early voltage V<sub>A</sub>", min: 30, max: 200, step: 5, value: 100, show: (v) => v + " V" }, (v) => { VA = v; draw(); }).el,
            slider({ id: id + "-ib", label: "Base current (picks the highlighted curve)", min: 10, max: 40, step: 10, value: 20, show: (v) => v + " µA" }, (v) => { IB = v; draw(); }).el, ro);
          draw();
        },
        `<p>Real curves slope upward. Extend them backward and they all meet at one point on the axis: <b>−V<sub>A</sub></b>, the <b>Early voltage</b> (found by James Early in 1952).</p>`,

      ]},
      { k: "predict", title: "More current, more or less r_o?", b: [
        { t: "mcq", q: "Move to a higher base-current curve. What happens to r_o, and is that good?", opts: [
          ["r_o falls (steeper curve), which is worse: you want r_o large", true, "r_o ≈ V_A/I_CQ, so more current means less output resistance. A large r_o is better because it barely loads the output."],
          ["r_o rises, which is better", false, "Watch the readout: the curves get steeper as current rises."],
          ["r_o stays the same, because V_A is fixed", false, "V_A is fixed, but r_o divides it by I_CQ."],
        ]},
        { t: "num", q: "V_A = 120 V and I_CQ = 3 mA. Roughly what's r_o?", a: 40000, unit: "Ω", hint: "V_A/I_CQ. Volts over milliamps gives kΩ.", why: "120/3 = 40 kΩ. Typical r_o values are 40–50 kΩ." },
      ]},
      { k: "learn", title: "Common base, and the others", b: [
        `<div class="two"><div class="tile"><h3>Common base</h3><p>Input: just r<sub>e</sub> (a few Ω up to about 50 Ω). Output: a source αI<sub>e</sub>, plus r<sub>o</sub> in the <b>MΩ</b> range (the curves are nearly flat).</p></div><div class="tile"><h3>Common collector</h3><p>No new model: use the common-emitter one.</p></div></div>`,
        `<div class="key">npn or pnp? For DC the polarities flip. For ac, the signal swings both ways anyway, so <b>the ac model is the same</b>.</div>`,
        `<p class="aside">The common-base source is drawn opposite to the defined I<sub>o</sub> direction. That's why, as you'll see, common base has no phase flip and common emitter has a 180° flip.</p>`,
      ]},
      { k: "say", title: "Say it back", b: [
        { t: "say", q: "Why does the base of a common-emitter transistor look like βr_e and not just r_e?", model: "The resistance r_e carries the emitter current, which is (β + 1) times the base current. The input voltage across r_e is therefore (β + 1)I_b·r_e, so the ratio of input voltage to input (base) current is (β + 1)r_e, about βr_e." },
      ]},
    ],
  };

  /* =============== PART 3 =============== */
  /* Fixed bias: DC then ac. Resistances in ohms. */
  function fixedAC(p) {
    const IB = Math.max(1e-9, (p.VCC - 0.7) / p.RB), IE = (p.beta + 1) * IB, re = VT / IE, IC = p.beta * IB;
    const VCE = p.VCC - IC * p.RC, ro = p.ro || Infinity, RCo = isFinite(ro) ? par(p.RC, ro) : p.RC;
    return { IB, IE, re, VCE, bre: p.beta * re, Zi: par(p.RB, p.beta * re), Zo: RCo, Av: -RCo / re };
  }
  const p3 = {
    id: "p3", title: "Common emitter: fixed bias and divider bias", mins: 25,
    blurb: "Plug the model in, read off Z_i, Z_o and the gain. Then the same thing with a voltage divider.",

        `<div class="key">The <b>minus sign</b> means the output is flipped: a <b>180° phase shift</b>. When the input rises, the output falls.</div>`,

  /* =============== PART 4 =============== */
  /* Unbypassed emitter-bias model: β·r_e from base to the emitter node, the βI_b source from collector to emitter node, R_E from emitter node to ground. */
  function ebFig(o = {}) {
    const T = 40, E = 130, B = 210;
    let s = S.vsrc(60, 125, "V_i") + S.wire([60, 107], [60, T], [230, T]) + S.wire([60, 143], [60, B], [470, B]);
    s += S.res(140, T, 140, B, o.rb || "R_B", { side: "right" }) + S.dot(140, T) + S.dot(140, B);
    s += S.res(230, T, 230, E, "βr_e", { side: "right" }) + S.t(230, T - 8, "b", { cls: "s m" });
    s += S.wire([230, E], [340, E]) + S.dot(285, E) + S.t(296, E - 8, "e", { cls: "s m", a: "start" });
    s += S.res(285, E, 285, B, o.re || "R_E", { side: "right", cls: o.hl ? "hl" : "" }) + S.dot(285, B);
    s += S.isrc(340, 85, "βI_b", { down: true, side: "right" }) + S.wire([340, 67], [340, T], [470, T]) + S.wire([340, 103], [340, E]) + S.t(340, T - 8, "c", { cls: "s m" });
    s += S.res(430, T, 430, B, "R_C", { side: "right" }) + S.dot(430, T) + S.dot(430, B) + S.dot(470, T) + S.t(470, T - 10, "V_o", { cls: "a" });
    s += S.t(200, T + 22, "Z_b ↓", { cls: "c s", a: "end" }) + S.t(126, B + 26, "Z_i →", { cls: "c s", a: "end" });
    return S.svg(510, 245, s, { max: 510, label: "Small-signal model of an emitter-bias amplifier with R_E left in the emitter" });
  }
  /* Emitter bias, DC then ac. p: VCC, RB, RC, RE (total), RE1 (unbypassed part), beta. */
  function ebAC(p) {
    const IB = (p.VCC - 0.7) / (p.RB + (p.beta + 1) * p.RE), IE = (p.beta + 1) * IB, re = VT / IE;
    const Zb = p.beta * re + (p.beta + 1) * p.RE1;
    return { IE, re, Zb, Zi: par(p.RB, Zb), Av: (-p.beta * p.RC) / Zb };
  }
  const p4 = {

      { k: "play", title: "The middle road: bypass part of R_E", b: [

  /* =============== PART 5 =============== */
  const p5 = {
    id: "p5", title: "Emitter follower", mins: 25,
    blurb: "Gain just under 1, high input impedance, tiny output impedance: a buffer.",
    takeaway: "Output from the emitter (collector at ac ground, so it's common collector). Z_i = R_B ∥ Z_b, Z_b ≈ β(r_e + R_E) ≈ βR_E: high. Z_o = R_E ∥ r_e ≈ r_e: very low. A_v = R_E/(R_E + r_e) ≈ 1, in phase. Used for impedance matching, like a transformer. With a divider, R_B → R_1 ∥ R_2; a collector resistor only sets the Q-point. With a load and source: replace R_E by R_E ∥ R_L, and Z_o = R_E ∥ (r_e + R′_s/β) with R′_s = R_s ∥ R_B. r_o barely matters for this circuit.",
    steps: [
      { k: "learn", title: "Output at the emitter", b: [

      ]},
      { k: "learn", title: "Z_i: high", b: [
        `<p>R<sub>E</sub> is in the emitter, unbypassed, so it reflects to the base exactly as in Part 4:</p>`,
        `<div class="eq">Z<sub>b</sub> = βr<sub>e</sub> + (β + 1)R<sub>E</sub> ≅ βR<sub>E</sub>    Z<sub>i</sub> = R<sub>B</sub> ∥ Z<sub>b</sub></div>`,

  }

    id: "p11", title: "Darlington and feedback pair", mins: 25,
    blurb: "Two transistors acting as one super-β transistor. What they do to Z_i, Z_o and A_i.",
    takeaway: "Darlington: β_D = β_1β_2, V_BE ≈ 1.4 V (packaged: up to about 2 V). Follower with R_E: I_B1 = (V_CC − V_BE1 − V_BE2)/(R_B + β_DR_E), Z_i = R_B ∥ β_DR_E, A_i ≈ β_DR_B/(R_B + β_DR_E), A_v ≈ 1, Z_o ≈ r_e1/β_2 + r_e2 (= 2r_e2, since I_E1 = I_E2/β_2). CE with R_E bypassed: Z_i′ = β_1(r_e1 + β_2r_e2), A_v = −β_DR_C/Z_i′, Z_o ≈ R_C ∥ r_o2, A_i (Z_i′ alone) = β_D. Feedback pair (pnp driving npn, acts like one pnp): Z_i′ ≈ β_1β_2R_C, A_v ≈ 1, Z_o ≈ r_e1/β_2, A_i = −β_1β_2R_B/(R_B + β_1β_2R_C).",
    steps: [
      { k: "learn", title: "Super-beta", b: [
        ch(4, "04-dc-biasing-bjts.html", "p10", "Part 10", "The Darlington's DC bias was in Chapter 4."),
        `<p>Q1's emitter drives Q2's base. Q1's emitter current is Q2's base current, so the gains multiply:</p>`,
        `<div class="eq">β<sub>D</sub> = β<sub>1</sub>β<sub>2</sub>    V<sub>BE</sub> = V<sub>BE1</sub> + V<sub>BE2</sub> ≈ 1.4 V</div>`,
        `<p class="aside">Sidney Darlington patented it in 1953. Packaged versions (such as the MPSA28: β<sub>D</sub> = 10 000, V<sub>BE(on)</sub> = 2 V, I<sub>C</sub> up to 800 mA) put both transistors on one chip with just three leads. Their I<sub>CEO</sub> leakage is much higher than a single transistor's.</p>`,
      ]},
      { k: "play", title: "Darlington follower lab", b: [
        (host, id) => {
          const ro = el(`<div></div>`);
          const p = { b1: 80, b2: 120, RB: 2.2e6, RE: 470, VCC: 15 };
          function draw() {
            const bD = p.b1 * p.b2, IB1 = (p.VCC - 1.4) / (p.RB + bD * p.RE), IE2 = bD * IB1, IE1 = IE2 / p.b2, re2 = VT / IE2, re1 = VT / IE1;
            ro.innerHTML = readout([["β<sub>D</sub>", fmt(bD, 4)], ["I<sub>B1</sub>", si(IB1, "A")], ["I<sub>E2</sub>", si(IE2, "A")], ["V<sub>E2</sub>", fmt(IE2 * p.RE, 3) + " V"], ["Z<sub>i</sub> = R<sub>B</sub> ∥ β<sub>D</sub>R<sub>E</sub>", ohm(par(p.RB, bD * p.RE))], ["A<sub>i</sub>", fmt((bD * p.RB) / (p.RB + bD * p.RE), 4)], ["r<sub>e1</sub>/β<sub>2</sub>", ohm(re1 / p.b2)], ["r<sub>e2</sub>", ohm(re2)], ["Z<sub>o</sub>", ohm(re1 / p.b2 + re2)]]);
          }
          host.append(slider({ id: id + "-b1", label: "β<sub>1</sub>", min: 40, max: 200, step: 5, value: p.b1 }, (v) => { p.b1 = v; draw(); }).el,
            slider({ id: id + "-b2", label: "β<sub>2</sub>", min: 40, max: 200, step: 5, value: p.b2 }, (v) => { p.b2 = v; draw(); }).el,
            slider({ id: id + "-re", label: "R<sub>E</sub>", min: 100, max: 2000, step: 10, value: p.RE, show: (v) => ohm(v) }, (v) => { p.RE = v; draw(); }).el, ro);
          draw();
        },
        `<p class="aside">V<sub>CC</sub> = 15 V, R<sub>B</sub> = 2.2 MΩ. Watch the two Z<sub>o</sub> pieces as you move the sliders.</p>`,
      ]},
      { k: "why", title: "A coincidence that isn't", b: [
        { t: "mcq", q: "In the lab, r_e1/β_2 always equals r_e2 exactly. Why?", opts: [
          ["Because I_E1 = I_E2/β_2, so r_e1 = 26 mV/I_E1 = β_2·(26 mV/I_E2) = β_2·r_e2", true, "Q1 carries only Q2's base current, so its r_e is β_2 times bigger. Divide by β_2 and you're back to r_e2. So Z_o ≈ 2r_e2."],
          ["Because both transistors have the same β", false, "Set β_1 and β_2 differently: they still match."],
          ["It's a rounding effect", false, "It's exact, for any β values."],
        ]},
        `<p>The same trick works for the Darlington amplifier with R<sub>E</sub> bypassed: Z<sub>i</sub>′ = β<sub>1</sub>(r<sub>e1</sub> + β<sub>2</sub>r<sub>e2</sub>) = 2β<sub>D</sub>r<sub>e2</sub>, so A<sub>v</sub> = −β<sub>D</sub>R<sub>C</sub>/Z<sub>i</sub>′ = −R<sub>C</sub>/2r<sub>e2</sub>.</p>`,
        `<p class="aside">Book slip: in the Darlington amplifier example, the A<sub>v</sub> line multiplies by 12 000, but β<sub>D</sub> = 12 100. The printed result (−241) is the one for 12 100.</p>`,
      ]},
      { k: "check", title: "Your turn", b: [
        `<p>Lab defaults: β<sub>1</sub> = 80, β<sub>2</sub> = 120, R<sub>B</sub> = 2.2 MΩ, R<sub>E</sub> = 470 Ω, V<sub>CC</sub> = 15 V.</p>`,
        { t: "num", q: "I_E2, in mA?", a: 19.45, unit: "mA", tol: 0.01, hint: "I_B1 = (15 − 1.4)/(R_B + β_DR_E), then × β_D.", why: "I_B1 = 13.6/6.712 MΩ = 2.026 µA; × 9600 = 19.45 mA." },
        { t: "num", q: "Z_i, in MΩ?", a: 1.479, unit: "MΩ", tol: 0.01, hint: "R_B ∥ β_DR_E.", why: "2.2 MΩ ∥ 4.512 MΩ = 1.48 MΩ. Compare a single transistor follower: a few hundred kΩ at best." },
        { t: "num", q: "Z_o?", a: 2.673, unit: "Ω", tol: 0.02, hint: "2r_e2.", why: "r_e2 = 26/19.45 = 1.337 Ω, so Z_o ≈ 2.67 Ω." },
      ]},
      { k: "learn", title: "The feedback pair", b: [
        `<p>A <b>pnp</b> Q1 drives an <b>npn</b> Q2; together they act like one pnp with β ≈ β<sub>1</sub>β<sub>2</sub>. The output is taken at the collector across R<sub>C</sub>, yet the behaviour is like a follower:</p>`,
        `<div class="eq">Z<sub>i</sub>′ ≅ β<sub>1</sub>β<sub>2</sub>R<sub>C</sub>    Z<sub>i</sub> = R<sub>B</sub> ∥ Z<sub>i</sub>′    A<sub>v</sub> ≅ 1    Z<sub>o</sub> ≅ r<sub>e1</sub>/β<sub>2</sub>    A<sub>i</sub> = −β<sub>1</sub>β<sub>2</sub>R<sub>B</sub>/(R<sub>B</sub> + β<sub>1</sub>β<sub>2</sub>R<sub>C</sub>)</div>`,
        `<p class="aside">DC: I<sub>B1</sub> = (V<sub>CC</sub> − V<sub>EB1</sub>)/(R<sub>B</sub> + β<sub>1</sub>β<sub>2</sub>R<sub>C</sub>). Chapter 12 pairs a Darlington with a feedback pair to make complementary output stages.</p>`,
        { t: "num", q: "β_1 = 120, β_2 = 150, R_C = 100 Ω, R_B = 1.5 MΩ. Z_i, in MΩ?", a: 0.8182, unit: "MΩ", tol: 0.01, hint: "Z_i′ = β_1β_2R_C, then in parallel with R_B.", why: "Z_i′ = 1.8 MΩ; 1.5 ∥ 1.8 = 0.818 MΩ, from a 100 Ω collector resistor." },
      ]},
      { k: "say", title: "Say it back", b: [
        { t: "say", q: "What does a Darlington follower buy you over a single-transistor follower?", model: "A much higher current gain, β_1β_2, so the input impedance (about β_DR_E in parallel with R_B) is far higher and the source is loaded much less. The output impedance is still very low, about twice r_e of the output transistor, and the voltage gain is still just under 1." },
      ]},
    ],
  };

  /* =============== PART 12 =============== */
  function hybFig(o = {}) {
    let s = S.wire([40, 40], [80, 40]) + S.res(80, 40, 160, 40, o.hi || "h_i") + S.wire([160, 40], [190, 40]) + S.vsrc(190, 105, "", {}) + S.t(214, 110, o.hr || "h_r·V_o", { a: "start", cls: "s" }) + S.wire([190, 40], [190, 87]) + S.wire([190, 123], [190, 170], [40, 170]);
    s += S.dot(40, 40) + S.dot(40, 170) + S.t(30, 110, "V_i", { a: "end", cls: "a" }) + S.arrow(46, 28, 76, 28, "I_i", { ly: 22 });
    s += S.isrc(330, 105, o.hf || "h_f·I_i", { down: true, side: "left" }) + S.wire([330, 87], [330, 40], [460, 40]) + S.wire([330, 123], [330, 170], [460, 170]);
    s += S.res(400, 40, 400, 170, "1/h_o", { side: "right" }) + S.dot(400, 40) + S.dot(400, 170) + S.dot(460, 40) + S.dot(460, 170) + S.t(470, 110, "V_o", { a: "start", cls: "a" }) + S.arrow(454, 28, 424, 28, "I_o", { ly: 22 });
    if (o.approx) s = s.replace(S.vsrc(190, 105, "", {}), `<g opacity="0.25">${S.vsrc(190, 105, "", {})}</g>`).replace(S.res(400, 40, 400, 170, "1/h_o", { side: "right" }), `<g opacity="0.25">${S.res(400, 40, 400, 170, "1/h_o", { side: "right" })}</g>`);
    return S.svg(520, 200, s, { max: 520, label: "Hybrid equivalent circuit: hi and hr·Vo at the input, hf·Ii and 1/ho at the output" });
  }
  const p12 = {
    id: "p12", title: "The hybrid (h) model", mins: 25,
    blurb: "The datasheet's model: four h-parameters measured with the output shorted or the input open.",
    takeaway: "Two-port equations: V_i = h_11I_i + h_12V_o and I_o = h_21I_i + h_22V_o. h_11 = h_i = V_i/I_i with V_o = 0 (short-circuit input impedance, Ω). h_12 = h_r = V_i/V_o with I_i = 0 (open-circuit reverse voltage ratio, no units). h_21 = h_f = I_o/I_i with V_o = 0 (short-circuit forward current ratio, no units). h_22 = h_o = I_o/V_o with I_i = 0 (open-circuit output admittance, S). A second letter names the configuration: h_ie, h_fb, and so on. Circuit: h_i in series with a source h_rV_o at the input; h_fI_i in parallel with 1/h_o at the output. Approximate model drops h_r and 1/h_o. Links to the r_e model: h_ie = βr_e, h_fe = β_ac, h_ib = r_e, h_fb = −α ≈ −1, h_oe = 1/r_o. Datasheet values are at the maker's operating point; h_fe varies least, h_ie must be recalculated at your current.",
    steps: [
      { k: "learn", title: "Why another model?", b: [
        `<div class="two"><div class="tile"><h3>r<sub>e</sub> model</h3><p>+ Built from <b>your</b> operating point.<br>− No output resistance or feedback term unless you look them up.</p></div><div class="tile"><h3>Hybrid model</h3><p>+ Every parameter on the datasheet.<br>− Measured at the <b>maker's</b> operating point (for example I<sub>C</sub> = 1 mA, V<sub>CE</sub> = 10 V for the 2N4400).</p></div></div>`,
        `<p>Datasheets list a range for each h-parameter, so you can compare transistors at a glance. Know both models and how to translate between them.</p>`,
      ]},
      { k: "learn", title: "Four numbers, two equations", b: [
        `<div class="eq">V<sub>i</sub> = h<sub>11</sub>I<sub>i</sub> + h<sub>12</sub>V<sub>o</sub>    I<sub>o</sub> = h<sub>21</sub>I<sub>i</sub> + h<sub>22</sub>V<sub>o</sub></div>`,
        `<p>To isolate one parameter, kill the other term: <b>short the output</b> (V<sub>o</sub> = 0) or <b>open the input</b> (I<sub>i</sub> = 0).</p>`,

        `<p class="aside">"Hybrid" because the units are mixed (Ω, S, none), and because the circuit mixes a Thévenin input with a Norton output. Subscript digits: first = what's measured, second = what causes it (1 = input, 2 = output).</p>`,
      ]},
      { k: "check", title: "Sort the conditions", b: [
        { t: "sort", q: "Which terminal condition defines each parameter?", bins: ["Output shorted (V_o = 0)", "Input open (I_i = 0)"], items: [
          ["h_i, the input impedance", 0, "Shorting the output kills the h_rV_o term in the first equation."],
          ["h_r, the reverse voltage ratio", 1, "Opening the input kills the h_iI_i term."],
          ["h_f, the forward current ratio", 0, "Shorting the output kills the h_oV_o term in the second equation."],

        ]},
      ]},
      { k: "learn", title: "The circuit that fits the equations", b: [
        fig(hybFig()),
        `<p>Equation 1 sums voltages: a resistor h<sub>i</sub> in series with a controlled voltage source h<sub>r</sub>V<sub>o</sub>. Equation 2 sums currents: a controlled current source h<sub>f</sub>I<sub>i</sub> in parallel with a conductance h<sub>o</sub> (a resistor 1/h<sub>o</sub>).</p>`,
        `<p>Add a second letter for the configuration: <b>e</b>, <b>b</b> or <b>c</b>. Common emitter: h<sub>ie</sub>, h<sub>re</sub>, h<sub>fe</sub>, h<sub>oe</sub>, with I<sub>i</sub> = I<sub>b</sub>, I<sub>o</sub> = I<sub>c</sub>. Same circuit shape for all three configurations, and for npn or pnp.</p>`,

        { t: "num", q: "Common-emitter r_o, in kΩ?", a: 40, unit: "kΩ", hint: "1/h_oe.", why: "1/25 µS = 40 kΩ." },
        { t: "num", q: "Common-base r_o, in MΩ?", a: 2.5, unit: "MΩ", hint: "1/h_ob.", why: "1/0.4 µS = 2.5 MΩ: far bigger than the CE one, as Part 2 said." },

      { k: "learn", title: "Same analysis, new names", b: [
        `<p>With the approximate hybrid model, every result from Parts 3–6 carries over: write h<sub>ie</sub> for βr<sub>e</sub>, h<sub>fe</sub> for β, 1/h<sub>oe</sub> for r<sub>o</sub>.</p>`,
        `<div class="eq">Fixed bias: Z<sub>i</sub> = R<sub>B</sub> ∥ h<sub>ie</sub>   Z<sub>o</sub> = R<sub>C</sub> ∥ 1/h<sub>oe</sub>   A<sub>v</sub> = −h<sub>fe</sub>(R<sub>C</sub> ∥ 1/h<sub>oe</sub>)/h<sub>ie</sub>   A<sub>i</sub> ≅ h<sub>fe</sub></div>`,

  /* =============== PART 13 =============== */
  function fullHyb(h, RL, Rs) {
    const Ai = h.hf / (1 + h.ho * RL), Av = (-h.hf * RL) / (h.hi + (h.hi * h.ho - h.hf * h.hr) * RL);
    const Zi = h.hi - (h.hf * h.hr * RL) / (1 + h.ho * RL), Zo = 1 / (h.ho - (h.hf * h.hr) / (h.hi + Rs));
    return { Ai, Av, Zi, Zo };
  }
  const p13 = {
    id: "p13", title: "The complete hybrid model", mins: 20,
    blurb: "Keep h_r and h_o and see exactly how much they change the answers.",
    takeaway: "With the full model, a load R_L and source R_s: A_i = h_f/(1 + h_oR_L); A_v = −h_fR_L/[h_i + (h_ih_o − h_fh_r)R_L]; Z_i = h_i − h_fh_rR_L/(1 + h_oR_L); Z_o = 1/[h_o − h_fh_r/(h_i + R_s)]. Each falls back to the approximate result when the extra term is small (h_oR_L ≪ 1 and so on). The same four equations serve CE, CB and CC: just use that configuration's h-parameters. Approximate CE → CB conversions: h_ib ≈ h_ie/(1 + h_fe), h_fb ≈ −h_fe/(1 + h_fe), h_ob ≈ h_oe/(1 + h_fe), h_rb ≈ h_ieh_oe/(1 + h_fe) − h_re.",
    steps: [
      { k: "learn", title: "Four results", b: [
        `<p>Put the full hybrid circuit between a source (R<sub>s</sub>) and a load (R<sub>L</sub>). The book derives each result with KVL and KCL; find A<sub>i</sub> first, because the others reuse it.</p>`,
        `<div class="eq">A<sub>i</sub> = h<sub>f</sub>/(1 + h<sub>o</sub>R<sub>L</sub>)    A<sub>v</sub> = −h<sub>f</sub>R<sub>L</sub>/[h<sub>i</sub> + (h<sub>i</sub>h<sub>o</sub> − h<sub>f</sub>h<sub>r</sub>)R<sub>L</sub>]</div>`,
        `<div class="eq">Z<sub>i</sub> = h<sub>i</sub> − h<sub>f</sub>h<sub>r</sub>R<sub>L</sub>/(1 + h<sub>o</sub>R<sub>L</sub>)    Z<sub>o</sub> = 1/[h<sub>o</sub> − h<sub>f</sub>h<sub>r</sub>/(h<sub>i</sub> + R<sub>s</sub>)]</div>`,
        `<p class="aside">Z<sub>o</sub> here is at the transistor's own output terminals. Put R<sub>C</sub> in parallel afterwards if the amplifier's Z<sub>o</sub> should include it.</p>`,
      ]},

              series: [{ pts: [[2, h.hf], [5, h.hf]], cls: "s5" }, { f: (x) => fullHyb(h, Math.pow(10, x), 1000).Ai, cls: "s1" }], marks: [{ x: Math.log10(RL), y: F.Ai }], texts: [{ x: 4.3, y: 146, s: "approx: h_fe", a: "middle" }], label: "Current gain against load: full model falls below hfe as RL grows" });

  /* =============== PART 14 =============== */
  /* Smooth curve through points (Catmull-Rom). */
  function cr(pts) {
    return (x) => {
      let i = 1;
      while (i < pts.length - 1 && x > pts[i][0]) i++;
      const p0 = pts[Math.max(0, i - 2)], p1 = pts[i - 1], p2 = pts[i], p3 = pts[Math.min(pts.length - 1, i + 1)];
      const d = p2[0] - p1[0], t = Math.max(0, Math.min(1, (x - p1[0]) / d)), t2 = t * t, t3 = t2 * t;
      const m1 = ((p2[1] - p0[1]) / (p2[0] - p0[0])) * d, m2 = ((p3[1] - p1[1]) / (p3[0] - p1[0])) * d;
      return (2 * t3 - 3 * t2 + 1) * p1[1] + (t3 - 2 * t2 + t) * m1 + (-2 * t3 + 3 * t2) * p2[1] + (t3 - t2) * m2;
    };
  }

  };
  const p14 = {
    id: "p14", title: "Hybrid π, and how the parameters drift", mins: 20,
    blurb: "The high-frequency model, then which parameter changes most with current, voltage and heat.",
    takeaway: "Hybrid π (Giacoletto) model: r_b (base contact, bulk and spreading, a few to tens of Ω), r_π = βr_e, r_u (≥ βr_o, MΩ, collector-to-base feedback), r_o (5–40 kΩ, from h_oe, V_A or the curves), C_π (few to tens of pF) and C_u (a few pF, magnified by the Miller effect), and a source g_mV_π = βI_b with g_m = 1/r_e. h_re ≈ r_π/(r_π + r_u). At low and mid frequencies the capacitors are open, r_b is negligible and r_u is huge: it reduces to the r_e model. Parameter drift: h_fe (β) varies least with collector current; h_oe and h_ie vary most (r_e = 26 mV/I_E). With V_CE, h_fe and h_ie stay steady while h_oe and h_re move. All h-parameters rise with temperature. Collector current has by far the biggest effect, so keep I_C steady.",

      { k: "learn", title: "A light that follows the music", b: [
