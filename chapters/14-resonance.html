   adds the shared helpers and sets window.BOOK to the book this page belongs to (window.BOOK_KEY). */
(function () {
  const all = window.BOOKS || {};
  Object.values(all).forEach((B) => {
    B.all = () => B.groups.flatMap((g) => g.items);
    B.chapters = () => B.all().filter((c) => typeof c.n === "number");
    B.find = (id) => B.all().find((c) => c.id === id);
    B.pdfName = (c) => B.pdfFile || B.pdfPrefix + c.pdf + ".pdf"; /* one-file books name the whole PDF */
    /* "pp. 26–75" for books whose file names are PDF pages, "pp. 1–54" (printed pages) when a chapter lists `pages`. */
    B.pagesLabel = (c) => (c.pages ? "book pp. " + c.pages : "pp. " + c.pdf).replace("-", "–") + (B.pdfFile && c.pages ? ", PDF pp. " + c.pdf.replace("-", "–") : "");
    B.probsLabel = (c) => (c.probs ? `page ${c.probs} of that PDF${c.probsBook && c.probsBook !== c.probs ? ` (book page ${c.probsBook})` : ""}` : "");
  });
  window.BOOK = all[window.BOOK_KEY] || null;
})();

<script>
/* Progress store shared by the contents page and every chapter page.
   Each chapter's state is { done: {p1: true}, last: {part, step} | null, say: {key: text}, t: ms }.
   It lives in two places:
     - localStorage "course-<id>": instant first paint, and the fallback when nothing else works.
     - the artifact's db, at data/users/<viewer id>/<chapter id>: private to the viewer, follows them
       across browsers and sessions. Only available when the page runs inside the claude.ai viewer. */
window.Progress = (function () {
  const LKEY = (id) => "course-" + id;
  const local = {
    get(id) { try { const v = localStorage.getItem(LKEY(id)); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
    set(id, v) { try { localStorage.setItem(LKEY(id), JSON.stringify(v)); } catch (e) {} },
  };
  const blank = () => ({ done: {}, last: null, say: {}, t: 0 });
  const norm = (s) => Object.assign(blank(), s || {}, { done: Object.assign({}, s && s.done), say: Object.assign({}, s && s.say) });

  /* Combine two copies: parts finished anywhere stay finished; the newer copy wins for position and text. */
  function merge(a, b) {
    a = norm(a); b = norm(b);
    const [old, neu] = a.t >= b.t ? [b, a] : [a, b];
    return { done: Object.assign({}, old.done, neu.done), last: neu.last, say: Object.assign({}, old.say, neu.say), t: neu.t };
  }
  const same = (a, b) => JSON.stringify(norm(a)) === JSON.stringify(norm(b));

  /* ---------- cloud ---------- */
  let status = "local"; // "local" | "cloud"
  const statusFns = [];
  const setStatus = (s) => { status = s; statusFns.forEach((f) => f(s)); };
  const cloud = (async () => {
    try {
      if (!window.claude || !window.claude.use) return null;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return null;
      const uid = await user.id();
      if (!uid) return null;
      const col = db.collection("data/users/" + uid);
      await col.limit(1).get(); // proves the store answers before we claim "saved to your account"
      setStatus("cloud");
      return col;
    } catch (e) { return null; }
  })();

  /* One write in flight per chapter; bursts collapse into the latest state. */
  const pending = {}, busy = {};
  async function flush(id) {
    const col = await cloud;
    if (!col || busy[id] || !pending[id]) return;
    busy[id] = true;
    const body = pending[id]; pending[id] = null;
    try { await col.doc(id).set(body); }
    catch (e) {
      if (e && e.code === "unavailable") { pending[id] = pending[id] || body; setTimeout(() => flush(id), 1500 + Math.random() * 1500); }
      else if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) setStatus("local");
    }
    busy[id] = false;
    if (pending[id]) flush(id);
  }
  const timers = {};
  function push(id, state, delay) {
    pending[id] = JSON.parse(JSON.stringify(norm(state)));
    clearTimeout(timers[id]);
    timers[id] = setTimeout(() => flush(id), delay);
  }

  return {
    /* Synchronous best guess from this browser. */
    load(id) { return norm(local.get(id)); },
    /* Save locally now, to the account shortly after. `delay` batches typing. */
    save(id, state, delay = 400) {
      state.t = Date.now();
      local.set(id, state);

    onStatus(fn) { statusFns.push(fn); fn(status); },

    });
    (o.texts || []).forEach((tx) => { s += `<text class="lab" x="${X(tx.x)}" y="${Y(tx.y)}" text-anchor="${tx.a || "start"}">${tx.s}</text>`; });
    return `<svg class="plot" viewBox="0 0 ${W} ${H}" style="max-width:${W}px" role="img" aria-label="${o.label || "Graph"}">${s}</svg>`;
  }

  /* ---------- UI helpers for widgets ---------- */
  function slider(o, onChange) {
    const wrap = el(`<div class="sl"><label for="${o.id}"><span>${o.label}</span><output></output></label><input type="range" id="${o.id}"></div>`);
    const inp = wrap.querySelector("input"), out = wrap.querySelector("output");
    if (o.log) { inp.min = 0; inp.max = 1000; inp.step = 1; }
    else { inp.min = o.min; inp.max = o.max; inp.step = o.step || (o.max - o.min) / 100; }
    const toT = (v) => (1000 * Math.log(v / o.min)) / Math.log(o.max / o.min);
    const get = () => (o.log ? o.min * Math.pow(o.max / o.min, inp.value / 1000) : +inp.value);
    const show = () => { out.textContent = o.show ? o.show(get()) : fmt(get()); };
    inp.value = o.log ? toT(o.value) : o.value;
    show();
    inp.addEventListener("input", () => { show(); onChange && onChange(get()); });
    return { el: wrap, get, set(v) { inp.value = o.log ? toT(v) : v; show(); onChange && onChange(get()); } };
  }
  function toggle(labels, onPick, start = 0) {
    const r = el(`<div class="row" role="group"></div>`);
    labels.forEach((lab, i) => {
      const b = el(`<button type="button" class="btn small" aria-pressed="${i === start}">${lab}</button>`);
      b.addEventListener("click", () => { r.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); onPick(i); });
      r.appendChild(b);
    });
    return r;
  }
  const readout = (pairs) => `<div class="readout">${pairs.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join("")}</div>`;

  /* ---------- blocks ---------- */
  function mcq(b) {
    const n = el(`<div class="q">${b.q ? `<p class="qq">${b.q}</p>` : ""}${b.fig || ""}<div class="choices"></div><div class="feedback" aria-live="polite" hidden></div></div>`);
    const ch = n.querySelector(".choices"), fb = n.querySelector(".feedback");
    b.opts.forEach(([txt, ok, why]) => {
      const btn = el(`<button type="button" class="btn choice">${txt}</button>`);
      btn.addEventListener("click", () => {
        fb.hidden = false;
        fb.className = "feedback " + (ok ? "ok" : "no");
        fb.innerHTML = (ok ? "<b>Yes.</b> " : "<b>Not this one.</b> ") + (why || "");
        btn.classList.add(ok ? "right" : "wrong");
        if (ok) ch.querySelectorAll("button").forEach((x) => (x.disabled = x !== btn));
      });
      ch.appendChild(btn);
    });
    return n;
  }
  function num(b, id) {
    const n = el(`<div class="q"><p class="qq">${b.q}</p>${b.fig || ""}<form class="num" novalidate><input id="${id}" inputmode="decimal" autocomplete="off" aria-label="Your answer"><span class="mono">${b.unit || ""}</span><button class="btn primary" type="submit">Check</button></form><div class="feedback" aria-live="polite" hidden></div></div>`);
    const fb = n.querySelector(".feedback"), inp = n.querySelector("input");
    let tries = 0;
    n.querySelector("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const v = parseFloat(String(inp.value).replace(",", ".").replace("−", "-"));
      fb.hidden = false;
      if (isNaN(v)) { fb.className = "feedback"; fb.textContent = "Type a number first."; return; }
      const tol = b.tol != null ? b.tol : 0.02;
      const ok = b.a === 0 ? Math.abs(v) < 1e-9 : Math.abs(v - b.a) <= Math.abs(b.a) * tol;
      tries++;
      if (ok) { fb.className = "feedback ok"; fb.innerHTML = "<b>Yes.</b> " + (b.why || ""); }
      else { fb.className = "feedback no"; fb.innerHTML = "<b>Not yet.</b> " + (tries >= 2 && b.hint2 ? b.hint2 : b.hint || "Check your units and signs."); }
    });
    return n;
  }
  /* Say-it-back answers live in the chapter's progress state; start() points this at it. */
  let says = { get: (k) => store.get(k, ""), set: (k, v) => store.set(k, v) };
  function say(b, id, key) {
    const n = el(`<div class="q"><p class="qq">${b.q}</p><textarea id="${id}" placeholder="Type your answer in your own words. Rough is fine."></textarea><div class="row"><button type="button" class="btn primary">Compare with mine</button></div><div class="model" hidden><span class="lbl">One good answer</span><div>${b.model}</div><p class="aside">Did yours get the same core idea? Wording doesn't matter. If you're unsure, paste yours into the chat and ask for feedback.</p></div></div>`);
    const ta = n.querySelector("textarea");
    ta.value = says.get(key);
    ta.addEventListener("input", () => says.set(key, ta.value));
    n.querySelector("button").addEventListener("click", () => { n.querySelector(".model").hidden = false; });
    return n;
  }
  function sort(b) {
    const n = el(`<div class="q">${b.q ? `<p class="qq">${b.q}</p>` : ""}<div class="sort"></div><div class="row"><button type="button" class="btn primary sort-check">Check my sorting</button></div><div class="feedback" aria-live="polite" hidden></div></div>`);
    const box = n.querySelector(".sort"), picks = [];
    b.items.forEach(([label], i) => {
      const it = el(`<div class="sort-item"><span>${label}</span></div>`);
      it.appendChild(toggle(b.bins, (k) => (picks[i] = k), -1));
      it.appendChild(el(`<div class="why" hidden></div>`));
      box.appendChild(it);
    });
    n.querySelector(".sort-check").addEventListener("click", () => {
      let right = 0;
      b.items.forEach(([, bin, why], i) => {
        const it = box.children[i], ok = picks[i] === bin;
        if (ok) right++;
        it.classList.toggle("right", ok); it.classList.toggle("wrong", !ok);
        const w = it.querySelector(".why"); w.hidden = false;
        w.innerHTML = (picks[i] == null ? "<b>Not sorted yet.</b> " : "") + (ok ? "" : `<b>Belongs in “${b.bins[bin]}”.</b> `) + (why || "");
      });
      const fb = n.querySelector(".feedback"); fb.hidden = false;
      fb.className = "feedback " + (right === b.items.length ? "ok" : "no");
      fb.innerHTML = `<b>${right} of ${b.items.length}</b> sorted correctly. ${right === b.items.length ? "" : "Read the notes on the red ones."}`;
    });
    return n;
  }
  function reveal(b) {
    const n = el(`<div class="q"><div class="row"><button type="button" class="btn">${b.label || "Show me"}</button></div><div hidden>${b.html}</div></div>`);
    n.querySelector("button").addEventListener("click", (e) => { n.lastElementChild.hidden = false; e.currentTarget.disabled = true; });
    return n;
  }
  function renderBlock(b, id, key) {
    if (typeof b === "string") return el(`<div>${b}</div>`);
    if (typeof b === "function") { const h = el(`<div class="widget" style="display:grid;gap:12px;min-width:0"></div>`); b(h, id); return h; }
    if (b.t === "mcq") return mcq(b);
    if (b.t === "num") return num(b, id);
    if (b.t === "say") return say(b, id, key);
    if (b.t === "sort") return sort(b);
    if (b.t === "reveal") return reveal(b);
    return el(`<div>${b.html || ""}</div>`);
  }

  /* ---------- subscripts: "v_TH" in any text renders as v<sub>TH</sub> (tspan inside SVG).
     A subscript stops before a letter that starts the next subscripted name, so "g_mR_D" reads g<sub>m</sub>R<sub>D</sub>. ---------- */
  const SUBRE = /([A-Za-zΔβμαθωφτγ′])_([A-Za-z0-9]+?)(?=[A-Za-zΔβμαθωφτγ′]_|[^A-Za-z0-9]|$)/g, SVGNS = "http://www.w3.org/2000/svg";
  function subify(root) {
    if (!root || !document.createTreeWalker) return;
    const w = document.createTreeWalker(root, 4 /* text */), hits = [];
    for (let n = w.nextNode(); n; n = w.nextNode()) {
      const p = n.parentNode;
      if (n.nodeValue.indexOf("_") < 0 || !p || /^(script|style|textarea|sub|tspan|title|code|pre)$/i.test(p.nodeName) || (p.closest && p.closest("pre, code"))) continue;
      SUBRE.lastIndex = 0;
      if (SUBRE.test(n.nodeValue)) hits.push(n);
    }
    hits.forEach((n) => {
      const svg = n.parentNode.namespaceURI === SVGNS, s = n.nodeValue, frag = document.createDocumentFragment();
      let last = 0, m;
      SUBRE.lastIndex = 0;
      while ((m = SUBRE.exec(s))) {
        frag.appendChild(document.createTextNode(s.slice(last, m.index) + m[1]));
        const sub = svg ? document.createElementNS(SVGNS, "tspan") : document.createElement("sub");
        if (svg) { sub.setAttribute("baseline-shift", "sub"); sub.setAttribute("font-size", "75%"); }
        sub.textContent = m[2];
        frag.appendChild(sub);
        last = m.index + m[0].length;
      }
      frag.appendChild(document.createTextNode(s.slice(last)));
      n.parentNode.replaceChild(frag, n);
    });
  }
  function watchSubs(root) {
    subify(root);
    if (!window.MutationObserver) return;
    new MutationObserver((ms) => ms.forEach((m) => m.addedNodes.forEach((a) => subify(a.nodeType === 3 ? a.parentNode : a)))).observe(root, { childList: true, subtree: true });
  }

  /* ---------- app ---------- */
  const KIND = { learn: "Learn", play: "Play", predict: "Predict first", why: "Why?", whatif: "What if…", bug: "Spot the mistake", check: "Quick check", say: "Say it back", math: "Math boost" };

  function start(C) {
    const KEY = "course-" + C.id, P = window.Progress;
    const state = P ? P.load(C.id) : store.get(KEY, { done: {}, last: null, say: {} });
    state.say = state.say || {};
    const save = (delay) => (P ? P.save(C.id, state, delay) : store.set(KEY, state));
    says = {
      get: (k) => (k in state.say ? state.say[k] : store.get(k, "")), // older builds kept answers under their own keys
      set: (k, v) => { state.say[k] = v; save(1500); },
    };
    const root = document.getElementById("app");
    watchSubs(root);
    let view = { part: null, step: 0 };

    /* Book navigation: chapter pages sit in the book's folder, its contents page one level up. */
    const B = window.BOOK;
    const bookLink = () => (B ? `<a class="book-link" href="../${B.home}">← Contents</a> · ` : "");
    /* Where this chapter lives in the real book, so the problems are easy to find afterwards. */
    const U = (B && B.unit) || "Chapter", u = U.toLowerCase();
    /* Cross-book links: a math module lists the chapters that use it; a chapter lists the math modules it needs. */
    const BOOKS = Object.values(window.BOOKS || {});
    function chapterRef(id) {
      for (const K of BOOKS) {
        if (K.key === "math" || !K.find) continue;
        const c = K.find(id);
        if (c && c.file) return `<a href="../${K.dir}/${c.file}" title="${c.title}">${K.short} ${typeof c.n === "number" ? "Ch" : "App"} ${c.n}</a>`;
      }
      return "";
    }
    function mathLinks() {
      const M = window.BOOKS && window.BOOKS.math;
      if (!M || !M.all || (B && B.key === "math")) return "";
      const href = (m) => (m.file.startsWith("../") ? m.file : "../math/" + m.file);
      const list = (key) => M.all().filter((m) => m.file && (m[key] || []).includes(C.id)).map((m) => `<a href="${href(m)}">${m.title}</a>`).join(" · ");
      const need = list("needs"), also = list("also");
      return (need ? `<p class="aside where-book">Math you'll use: ${need}</p>` : "") + (also ? `<p class="aside where-book">Going further (optional): ${also}</p>` : "");
    }
    function whereInBook() {
      const me = B && B.find(C.id);
      if (me && B.noPdf) {
        const used = (me.needs || []).map(chapterRef).filter(Boolean), pairs = (me.also || []).map(chapterRef).filter(Boolean);
        return (used.length ? `<p class="aside where-book">Used in: ${used.join(" · ")}</p>` : "") + (pairs.length ? `<p class="aside where-book">Not in the books, but pairs with: ${pairs.join(" · ")}</p>` : "");
      }
      if (!me || !me.pdf) return mathLinks();
      return `<p class="aside where-book">${B.short}, ${typeof me.n === "number" ? "Chapter" : "Appendix"} ${me.n} · ${B.pagesLabel(me)}${B.pdfFile ? "" : ` · PDF file ending “-${me.pdf}.pdf”`}${me.probs ? ` · problems from ${B.probsLabel(me)}` : ""}</p>` + mathLinks();
    }
    function problemsNote() {
      const me = B && B.find(C.id);
      if (!me || !me.probs) return "";
      return `<div class="key"><b>Your book problems:</b> open <span class="mono">${B.pdfName(me)}</span> and go to ${B.probsLabel(me)}.</div>`;
    }
    const isAppPage = () => { const m = B && B.find(C.id); return !!m && typeof m.n !== "number"; };
    function nextChapter() {
      if (!B) return "";
      const me = B.find(C.id), isApp = !!me && typeof me.n !== "number";
      const list = isApp ? B.all().filter((c) => typeof c.n !== "number" && c.file) : B.chapters(), i = list.findIndex((c) => c.id === C.id), nx = list[i + 1];
      const ans = B.answers && !isApp ? `<p class="aside">The book has short answers to some problems (${B.answers.label}, pages ${B.answers.pdf.replace("-", "–")}). Look only after you've committed to your own answer.</p>` : "";
      if (!nx) return ans + `<p><a href="../${B.home}">← Back to the contents</a></p>`;
      return ans + (nx.file
        ? `<p>Then: <a href="${nx.file}">${isApp ? "Appendix" : U} ${nx.n} · ${nx.title} →</a></p>`
        : `<p>Next up: ${U} ${nx.n} · ${nx.title}. Its tutorial isn't built yet. Ask Claude for it when you're ready.</p>`);
    }

    function hub() {
      view = { part: null, step: 0 };
      const firstOpen = C.parts.findIndex((p) => !state.done[p.id]);
      const node = el(`<div class="wrap">
        <header class="top"><div class="eyebrow">${bookLink()}${C.eyebrow}</div><h1>${C.title}</h1>${whereInBook()}</header>
        <section class="card"><span class="tag">How this ${isAppPage() ? "appendix" : u} works</span>${C.intro}</section>
        <ol class="parts" aria-label="Parts of this ${u}"></ol>
        <section class="after"><h3 style="font-family:var(--display);margin:0">After the last part</h3>${problemsNote()}${C.after}${nextChapter()}</section>
        <p class="aside save-note"></p>
      </div>`);
      if (P) P.onStatus((s) => { const n = node.querySelector(".save-note"); if (n) n.textContent = s === "cloud" ? "Progress saves to your Claude account, so it follows you to any browser." : "Progress saves in this browser only."; });
      const list = node.querySelector(".parts");
      C.parts.forEach((p, i) => {
        const done = !!state.done[p.id];
        const cls = done ? "done" : i === firstOpen ? "next" : "";
        const b = el(`<li><button type="button" class="part-btn ${cls}"><span class="part-n">${done ? "✓" : i + 1}</span><span><span class="part-t">${p.title}</span><span class="part-d">${p.blurb}</span></span><span class="part-m">${p.mins} min</span></button></li>`);
        b.querySelector("button").addEventListener("click", () => openPart(i, state.last && state.last.part === i ? state.last.step : 0));
        list.appendChild(b);
      });
      const sum = el(`<li><button type="button" class="part-btn"><span class="part-n">Σ</span><span><span class="part-t">${U} summary</span><span class="part-d">Every key idea and formula on one page. Keep it open while you do the problems.</span></span><span class="part-m">ref</span></button></li>`);
      sum.querySelector("button").addEventListener("click", summary);
      list.appendChild(sum);
      if (state.last && state.last.part != null && C.parts[state.last.part]) {
        const p = C.parts[state.last.part];
        const cont = el(`<div class="row"><button type="button" class="btn primary">Continue: Part ${state.last.part + 1}, step ${state.last.step + 1}</button><span class="aside">${p.title}</span></div>`);
        cont.querySelector("button").addEventListener("click", () => openPart(state.last.part, state.last.step));
        node.querySelector(".card").after(cont);
      }
      root.replaceChildren(node);
      window.scrollTo(0, 0);
    }

    function summary() {
      view = { part: null, step: 0 };
      const node = el(`<div class="wrap"><header class="top"><div class="eyebrow"><button type="button">← ${C.eyebrow}</button></div><h1>${U} summary</h1></header><section class="card">${C.summary}</section><nav class="bottom"><button type="button" class="btn ghost">← ${U} map</button><span></span></nav></div>`);
      node.querySelectorAll(".eyebrow button, nav .btn").forEach((b) => b.addEventListener("click", hub));
      root.replaceChildren(node);
      window.scrollTo(0, 0);
    }

    function openPart(pi, si0 = 0) {
      const P = C.parts[pi];
      const node = el(`<div class="wrap">
        <header class="top"><div class="eyebrow"><button type="button">← ${C.eyebrow}</button> · Part ${pi + 1} of ${C.parts.length}</div><h1>${P.title}</h1>
        <div class="rail" aria-label="Steps"></div><div class="where"></div></header>
        <main></main>
        <nav class="bottom"><button type="button" class="btn ghost" data-back>← Back</button><button type="button" class="btn primary" data-next>Next →</button></nav></div>`);
      node.querySelector(".eyebrow button").addEventListener("click", hub);
      root.replaceChildren(node);
      const rail = node.querySelector(".rail"), where = node.querySelector(".where"), main = node.querySelector("main");
      const back = node.querySelector("[data-back]"), next = node.querySelector("[data-next]");
      const N = P.steps.length;

      function show(i) {
        i = Math.max(0, Math.min(N, i));
        view = { part: pi, step: i };
        if (i === N) return finish();
        state.last = { part: pi, step: i }; save();
        const st = P.steps[i];
        const card = el(`<section class="card"><span class="tag k-${st.k}">${KIND[st.k] || st.k}</span>${st.title ? `<h2>${st.title}</h2>` : ""}</section>`);
        (st.b || []).forEach((b, j) => card.appendChild(renderBlock(b, `${C.id}-${P.id}-s${i}-b${j}`, `${KEY}-say-${P.id}-${i}-${j}`)));
        main.replaceChildren(card);
        rail.innerHTML = P.steps.map((s, k) => `<button type="button" class="${k < i ? "done" : k === i ? "now" : ""}" aria-label="Step ${k + 1}" ${k === i ? 'aria-current="step"' : ""} data-i="${k}"></button>`).join("");
        rail.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => show(+b.dataset.i)));
        where.innerHTML = `Step <b>${i + 1}</b> of ${N} · ${KIND[st.k] || st.k}`;
        back.disabled = i === 0;
        next.hidden = false;
        next.textContent = i === N - 1 ? "Finish part ✓" : "Next →";
        window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
      }
      function finish() {
        state.done[P.id] = true;
        state.last = pi + 1 < C.parts.length ? { part: pi + 1, step: 0 } : null;
        save();
        const hasNext = pi + 1 < C.parts.length;
        const card = el(`<section class="card"><span class="tag k-check">Part ${pi + 1} complete</span><h2>Your takeaway</h2><div class="key">${P.takeaway}</div>
          <p class="aside">Good moment for a short break. Stand up, drink some water, then come back.</p>
          <div class="row">${hasNext ? `<button type="button" class="btn primary" data-np>Part ${pi + 2}: ${C.parts[pi + 1].title} →</button>` : `<button type="button" class="btn primary" data-sum>Open the ${u} summary</button>`}<button type="button" class="btn ghost" data-hub>Chapter map</button></div></section>`);
        main.replaceChildren(card);
        rail.querySelectorAll("button").forEach((b) => (b.className = "done"));
        where.innerHTML = `<b>Done</b> · ${N} steps`;
        back.disabled = false;
        next.hidden = true;
        card.querySelector("[data-hub]").addEventListener("click", hub);
        if (hasNext) card.querySelector("[data-np]").addEventListener("click", () => openPart(pi + 1, 0));
        else card.querySelector("[data-sum]").addEventListener("click", summary);
        window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
      }
      back.addEventListener("click", () => show(view.step - 1));
      next.addEventListener("click", () => show(view.step + 1));
      show(si0);
    }

    document.addEventListener("keydown", (e) => {
      if (view.part == null) return;
      if (e.target.closest && e.target.closest("input, textarea, select")) return;
      const nb = document.querySelector("[data-next]"), bb = document.querySelector("[data-back]");
      if (e.key === "ArrowRight" && nb && !nb.hidden) nb.click();
      if (e.key === "ArrowLeft" && bb && !bb.disabled) bb.click();
    });

    const m = /^#p(\d+)$/.exec(location.hash || "");
    /* #resume (from the library's Resume card): the saved step, else the first unfinished part, else the map. */
    const L = state.last, todo = C.parts.findIndex((p) => !state.done[p.id]);
    if (m && C.parts[+m[1] - 1]) openPart(+m[1] - 1, 0);
    else if (location.hash === "#resume" && L && C.parts[L.part]) openPart(L.part, L.step);
    else if (location.hash === "#resume" && todo >= 0) openPart(todo, 0);
    else hub();
    if (P) P.sync(C.id, state, () => { if (view.part == null) hub(); });
  }

  return { start, S, plot, slider, toggle, readout, fmt, si, el, reduce, store };
})();
</script>
<script>
(function () {
  const { S, plot, slider, toggle, readout, fmt, si, el } = Course;
  const fig = (svg) => `<div class="fig">${svg}</div>`;

  /* complex numbers as [re, im] */
  const Z = {
    div: (a, b) => { const d = b[0] * b[0] + b[1] * b[1]; return [(a[0] * b[0] + a[1] * b[1]) / d, (a[1] * b[0] - a[0] * b[1]) / d]; },
    abs: (a) => Math.hypot(a[0], a[1]),
    deg: (a) => (Math.atan2(a[1], a[0]) * 180) / Math.PI,
  };

  /* log-scale plots (x = log10 ω) */
  const sup = (n) => String(n).replace(/-/g, "⁻").replace(/\d/g, (d) => "⁰¹²³⁴⁵⁶⁷⁸⁹"[d]);
  const p10 = (v) => "10" + sup(v);
  const ints = (a, b) => { const r = []; for (let k = Math.ceil(a); k <= Math.floor(b); k++) r.push(k); return r; };
  function bmag(o) {
    return plot({
      w: o.w || 520, h: o.h || 260, x: o.x, y: o.y, xt: ints(o.x[0], o.x[1]), yt: o.yt || ints(o.y[0], o.y[1]), xtf: p10, ytf: o.ytf || p10, xl: o.xl || "ω (rad/s)", yl: o.yl || "|H|",
      series: o.series.map((se) => ({ f: (lx) => Math.log10(se.f(Math.pow(10, lx))), cls: se.cls, n: se.n || 400 })),
      marks: (o.marks || []).map((m) => Object.assign({}, m, { x: Math.log10(m.x), y: Math.log10(m.y) })), label: o.label || "Magnitude versus frequency, log scales",
    });
  }
  function bph(o) {
    return plot({

  /* RK4 simulators. Parallel RLC fed by current i(t): C dv/dt = i − v/R − iL, L diL/dt = v.  Series RLC fed by v(t): returns [t, vC, i]. */
  function simPar(R, L, C, iin, T, N) {
    const dt = T / N, out = [];
    let v = 0, il = 0;
    const f = (t, v, il) => [(iin(t) - v / R - il) / C, v / L];
    for (let k = 0; k <= N; k++) {
      const t = k * dt; out.push([t, v]);
      const a = f(t, v, il), b = f(t + dt / 2, v + (dt / 2) * a[0], il + (dt / 2) * a[1]), c = f(t + dt / 2, v + (dt / 2) * b[0], il + (dt / 2) * b[1]), d = f(t + dt, v + dt * c[0], il + dt * c[1]);
      v += (dt / 6) * (a[0] + 2 * b[0] + 2 * c[0] + d[0]); il += (dt / 6) * (a[1] + 2 * b[1] + 2 * c[1] + d[1]);
    }
    return out;
  }
  function simSer(R, L, C, vin, v0, T, N) {
    const dt = T / N, out = [];
    let v = v0, i = 0;
    const f = (t, v, i) => [i / C, (vin(t) - R * i - v) / L];
    for (let k = 0; k <= N; k++) {
      const t = k * dt; out.push([t, v, i]);
      const a = f(t, v, i), b = f(t + dt / 2, v + (dt / 2) * a[0], i + (dt / 2) * a[1]), c = f(t + dt / 2, v + (dt / 2) * b[0], i + (dt / 2) * b[1]), d = f(t + dt, v + dt * c[0], i + dt * c[1]);
      v += (dt / 6) * (a[0] + 2 * b[0] + 2 * c[0] + d[0]); i += (dt / 6) * (a[1] + 2 * b[1] + 2 * c[1] + d[1]);
    }
    return out;
  }

  function parFig(o = {}) {
    const s = S.wire([60, 30], [320, 30]) + S.wire([60, 160], [320, 160]) + S.wire([60, 30], [60, 72]) + S.wire([60, 118], [60, 160]) + S.isrc(60, 95, o.I || "i(t)", { side: "left" }) +
      S.ind(150, 30, 150, 160, o.L || "L", { side: "left" }) + S.res(230, 30, 230, 160, o.R || "R", { side: "left" }) + S.cap(310, 30, 310, 160, o.C || "C", { side: "left" }) +
      S.dot(150, 30) + S.dot(230, 30) + S.dot(150, 160) + S.dot(230, 160) + S.t(340, 58, "+", { cls: "big" }) + S.t(340, 150, "−", { cls: "big" }) + S.t(344, 102, o.V || "v", { a: "start", cls: "a" });
    return S.svg(460, 185, `<g transform="translate(60,0)">${s}</g>`, { max: 460, label: "Parallel RLC driven by a current source" });
  }
  function serFig(hl) {
    const H = (k) => (hl === k || (hl === "lc" && (k === "l" || k === "c")) ? { tcls: "a", cls: "hl" } : {});
    let s = S.wire([60, 82], [60, 30], [80, 30]) + S.res(80, 30, 160, 30, "R", H("r")) + S.wire([160, 30], [180, 30]) + S.ind(180, 30, 270, 30, "L", H("l")) + S.wire([270, 30], [310, 30]) + S.cap(310, 30, 310, 160, "C", Object.assign({ side: "left" }, H("c"))) + S.wire([60, 118], [60, 160], [310, 160]) + S.vsrc(60, 100, "v_i", { side: "right" });
    s += S.t(120, 64, "+ v_r −", { cls: "s m" }) + S.t(225, 64, "+ v_l −", { cls: "s m" }) + S.t(330, 60, "+", { cls: "big" }) + S.t(330, 152, "−", { cls: "big" }) + S.t(336, 104, "v_c", { a: "start", cls: "s m" });
    return S.svg(400, 180, s, { max: 400, label: "Series RLC driven by a voltage source" });
  }

        `<p>Series RLC: L = 10 mH, C = 10 nF, R = 20 Ω, driven by 0.5 V·cos ωt.</p>`,
        { t: "num", q: "ω₀ = ?", a: 100000, unit: "rad/s", why: "1/√(10⁻¹⁰) = 10⁵ rad/s." },
        { t: "num", q: "Q = ω₀L/R?", a: 50, why: "10⁵ × 0.01 / 20 = 50." },
        { t: "num", q: "Bandwidth R/L?", a: 2000, unit: "rad/s", why: "20/0.01 = 2000 rad/s = ω₀/Q." },
        { t: "num", q: "Current amplitude at ω₀?", a: 25, unit: "mA", why: "L and C cancel: I = 0.5/20 = 25 mA." },
      ]},
      { k: "learn", title: "Any second-order circuit", b: [
        fig(S.svg(360, 170, S.wire([60, 82], [60, 30], [200, 30]) + S.wire([60, 118], [60, 150], [200, 150]) + S.vsrc(60, 100, "v_z", { side: "right" }) + S.cap(150, 30, 150, 150, "C", { side: "left" }) + S.res(250, 30, 250, 90, "R") + S.ind(250, 90, 250, 150, "L") + S.wire([200, 30], [250, 30]) + S.wire([200, 150], [250, 150]) + S.dot(200, 30) + S.dot(200, 150), { max: 360, label: "Capacitor in parallel with a series R-L branch" })),
        `<p>A real inductor has wire resistance: R–L in series, with C across it. Its admittance:</p>`,
        `<div class="eq">1/Z = sC + 1/(R + sL)  →  its numerator is ∝ s² + (R/L)s + 1/LC</div>`,
        `<p>Recipe: get the quadratic into the form <b>s² + 2αs + ω₀²</b>, then read off ω₀ and α, and Q = ω₀/2α.</p>`,
        { t: "num", q: "R = 2 Ω, L = 4 mH, C = 25 µF. Q = ?", a: 6.32, tol: 0.02, hint: "ω₀ = 1/√(LC), α = R/2L.", why: "ω₀ = 1/√(10⁻⁷) ≈ 3162 rad/s, α = 2/0.008 = 250 s⁻¹, Q = 3162/500 ≈ 6.3. Complex roots: resonant." },
      ]},
      { k: "say", title: "Say it back", b: [
        { t: "say", q: "Why does a large resistor give high Q in a parallel RLC, but a small resistor give high Q in a series RLC?", model: "Q is high when little energy is lost per cycle. In parallel, the resistor sees the full voltage, so a large R draws little current and wastes little power. In series, the resistor carries the full current, so a small R drops little voltage and wastes little power." },
      ]},
    ],
  };

  /* =============== PART 5 =============== */
  const p5 = {
    id: "p5", title: "Four filters from one circuit", mins: 25,
    blurb: "Take the output across R, C, L, or L+C.",
    takeaway: "Series RLC, output across: R → band-pass (2αs/(s² + 2αs + ω₀²), peak 1); C → low-pass (ω₀²/…); L → high-pass (s²/…); L and C together → notch (band-stop, zero at ω₀). Higher Q = more selective. At ω₀ the capacitor (and inductor) voltage is Q times the input!",
    steps: [
      { k: "play", title: "Move the output", b: [
        (host, id) => {
          const f = el(`<div class="fig"></div>`), sch = el(`<div class="fig"></div>`), ro = el(`<div></div>`);
          const L = 10e-3, C = 10e-9, w0 = 1e5;
          let which = 0, Q = 2;
          const names = ["across R: band-pass", "across C: low-pass", "across L: high-pass", "across L + C: notch"];
          function draw() {
            const R = (w0 * L) / Q, H = (w) => { const zl = [0, w * L], zc = [0, -1 / (w * C)], d = [R, w * L - 1 / (w * C)], n = [[R, 0], zc, zl, [0, w * L - 1 / (w * C)]][which]; return Z.div(n, d); };
            sch.innerHTML = serFig(["r", "c", "l", "lc"][which]);
            f.innerHTML = bmag({ x: [3, 7], y: [-3, 2], yl: "|V_out / V_i|", series: [{ f: () => 1, cls: "s5" }, { f: (w) => Z.abs(H(w)), cls: "s1" }], marks: [{ x: w0, y: Math.max(1e-3, Z.abs(H(w0))) }] });
            ro.innerHTML = readout([["output", names[which]], ["R = ω₀L/Q", si(R, "Ω")], ["|H| at ω₀", fmt(Z.abs(H(w0)))]]);
          }
          host.append(toggle(["R", "C", "L", "L + C"], (k) => { which = k; draw(); }), sch, f, slider({ id: id + "-q", label: "Q", min: 0.5, max: 50, log: true, value: Q, show: (x) => fmt(x) }, (x) => { Q = x; draw(); }).el, ro);
          draw();
        },
        `<p class="aside">L = 10 mH, C = 10 nF, ω₀ = 10⁵ rad/s. Pick where the output is taken, then change Q (by changing R). Watch the low-pass peak at high Q: it rises far above 1.</p>`,
      ]},
      { k: "why", title: "Guess each shape with opens and shorts", b: [
        { t: "sort", q: "At very LOW frequency (C open, L short), which outputs get most of the input?", bins: ["≈ all of v_i", "≈ 0"], items: [
          ["v_c (across C)", 0, "C is open: no current, no drop on R or L, so all of v_i sits on C. Low-pass."],
          ["v_r (across R)", 1, "No current flows, so v_r = 0."],
          ["v_l (across L)", 1, "L is a short: v_l = 0. High-pass."],
          ["v_l + v_c", 0, "C takes everything. The notch only bites near ω₀."],
        ]},
        `<p class="aside">Do the same at high frequency (C short, L open): v<sub>l</sub> takes it all, so L is high-pass; v<sub>c</sub> → 0.</p>`,
      ]},
      { k: "learn", title: "The four system functions", b: [
        `<div class="tbl"><table><tbody>
          <tr><td>band-pass (R)</td><td class="mono">2αs / (s² + 2αs + ω₀²)</td><td>= 1 at ω₀</td></tr>
          <tr><td>low-pass (C)</td><td class="mono">ω₀² / (s² + 2αs + ω₀²)</td><td>= −jQ at ω₀</td></tr>
          <tr><td>high-pass (L)</td><td class="mono">s² / (s² + 2αs + ω₀²)</td><td>= +jQ at ω₀</td></tr>
          <tr><td>notch (L + C)</td><td class="mono">(s² + ω₀²) / (s² + 2αs + ω₀²)</td><td>= 0 at ω₀</td></tr></tbody></table></div>`,
        `<p>Same denominator for all four: the circuit's own resonance. Only the numerator (where you look) changes.</p>`,
      ]},
      { k: "learn", title: "Q times the input", b: [
        `<p>At ω₀ the current is V<sub>i</sub>/R. The capacitor voltage is that current times 1/ω₀C:</p>`,
        `<div class="key">|V<sub>c</sub>| = |V<sub>l</sub>| = Q·|V<sub>i</sub>| at resonance</div>`,
        { t: "num", q: "A series RLC with Q = 50 is driven at ω₀ by 0.5 V. Capacitor voltage amplitude?", a: 25, unit: "V", why: "50 × 0.5 = 25 V, from a half-volt source. A capacitor rated for 16 V would fail." },
        `<p>That's the bridge story: a small, steady push at the resonant frequency builds a response Q times bigger.</p>`,
      ]},
      { k: "whatif", title: "What if…", b: [
        `<p>A metal detector: the inductor is a big flat coil. Nearby metal changes L a tiny bit, which shifts ω₀. You measure the amplitude across R.</p>`,
        { t: "mcq", q: "To notice the smallest change in L, which drive frequency should you pick?", opts: [["On a steep side of the peak, near a 0.707 frequency", true, "There a small shift of the curve changes |V_r| the most. At the very top the curve is flat, so a small shift barely changes the output."], ["Exactly at ω₀", false, "The peak's top is flat: its slope is zero."], ["Far from ω₀", false, "Out there the curve is flat-ish and the signal is tiny."]] },
      ]},
      { k: "check", title: "Numbers", b: [
        `<p>Series RLC: L = 1 mH, C = 1 µF, output across C. Driven by 1 V.</p>`,
        { t: "num", q: "ω₀ = ?", a: 31623, tol: 0.01, unit: "rad/s", why: "1/√(10⁻⁹) ≈ 31 600 rad/s (about 5 kHz)." },
        { t: "num", q: "What R gives Q = 1?", a: 31.6, tol: 0.02, unit: "Ω", hint: "Q = (1/R)√(L/C).", why: "√(L/C) = √1000 ≈ 31.6 Ω. A low-pass with no big peak." },
        { t: "num", q: "With R = 3.16 Ω instead, |v_c| at ω₀?", a: 10, tol: 0.02, unit: "V", why: "Q = 10, so 10 × 1 V. A poor low-pass: it boosts frequencies near ω₀ tenfold." },
      ]},
      { k: "say", title: "Say it back", b: [
        { t: "say", q: "How can the capacitor voltage be ten times the source voltage if energy is conserved?", model: "The capacitor and inductor voltages are each Q times the input but opposite in sign, so they cancel around the loop and the source only sees R. Energy isn't created: it builds up over many cycles and sloshes between L and C. The source only has to replace the small amount lost in R each cycle." },
      ]},
    ],
  };

  /* =============== PART 6 =============== */
  const p6 = {
    id: "p6", title: "Stored energy at resonance", mins: 20,
    blurb: "Energy sloshes between L and C; the source just tops it up.",
    takeaway: "Series RLC at ω₀: V_c = −jQV_i and V_l = +jQV_i cancel. Energy moves between L and C at 2ω₀, but the total stays constant: ½L(V_i/R)². Q = stored energy ÷ average energy lost per radian = ω₀L/R. Three definitions of Q (ω₀/2α, ω₀/bandwidth, energy ratio) agree for second-order circuits.",
    steps: [
      { k: "play", title: "Watch the energy", b: [
        (host, id) => {
          const f = el(`<div class="fig"></div>`), ro = el(`<div></div>`);
          const L = 10e-3, C = 10e-9, R = 20, Vi = 0.5, w0 = 1e5;
          let r = 1;
          function draw() {
            const w = r * w0, I = Z.div([Vi, 0], [R, w * L - 1 / (w * C)]), Vc = Z.div(I, [0, w * C]);
            const iL = (t) => Z.abs(I) * Math.cos(w * t + Math.atan2(I[1], I[0])), vC = (t) => Z.abs(Vc) * Math.cos(w * t + Math.atan2(Vc[1], Vc[0]));
            const T = (2 * Math.PI) / w0, X = (x) => x * T;
            const wl = (x) => 0.5 * L * iL(X(x)) ** 2 * 1e6, wc = (x) => 0.5 * C * vC(X(x)) ** 2 * 1e6;
            f.innerHTML = plot({ x: [0, 2], y: [0, 3.6], xt: [0, 0.5, 1, 1.5, 2], yt: [0, 1, 2, 3], xl: "t (cycles of ω₀)", yl: "energy (µJ)", series: [{ f: wl, cls: "s1" }, { f: wc, cls: "s2" }, { f: (x) => wl(x) + wc(x), cls: "s3" }], label: "Inductor energy, capacitor energy and their total" });
            ro.innerHTML = readout([["ω / ω₀", fmt(r)], ["|V_c|", fmt(Z.abs(Vc)) + " V"], ["current", fmt(Z.abs(I) * 1e3) + " mA"]]);
          }
          host.append(f, slider({ id: id + "-r", label: "Drive frequency ω / ω₀", min: 0.97, max: 1.03, step: 0.002, value: r, show: (x) => fmt(x, 4) }, (x) => { r = x; draw(); }).el, ro);
          draw();
        },
        `<p class="aside">The Part 4 circuit: L = 10 mH, C = 10 nF, R = 20 Ω (Q = 50), 0.5 V drive. Orange: ½Li². Blue: ½Cv². Green: the total. At exactly ω₀ the total is flat. Detune by 1% and it wobbles (the source has to push energy in and take it back: reactive power), and everything shrinks.</p>`,
      ]},
      { k: "learn", title: "The algebra", b: [
        `<p>At ω₀, I = V<sub>i</sub>/R (real). Then</p>`,
        `<div class="eq">V<sub>c</sub> = I/(jω₀C) = −jQV<sub>i</sub>     V<sub>l</sub> = jω₀L·I = +jQV<sub>i</sub></div>`,
        `<div class="eq">w<sub>L</sub> = ¼L(V<sub>i</sub>/R)²(1 + cos 2ω₀t)     w<sub>C</sub> = ¼L(V<sub>i</sub>/R)²(1 − cos 2ω₀t)</div>`,
        `<div class="key">w<sub>total</sub> = ½L(V<sub>i</sub>/R)²   constant</div>`,
        `<p>The L–C pair together looks like a short (their voltages cancel), but each one alone can carry a dangerous voltage. Q-meters use exactly this to measure an inductor's Q.</p>`,
      ]},
      { k: "learn", title: "Q from energy", b: [
        `<div class="key">Q = stored energy / (average energy dissipated per radian)</div>`,
        `<p>Power lost in R: V<sub>i</sub>²/2R. Per radian: divide by ω₀. So Q = ½L(V<sub>i</sub>/R)² ÷ (V<sub>i</sub>²/2Rω₀) = ω₀L/R. Same answer.</p>`,
        `<div class="tbl"><table><tbody>
          <tr><td>time view (Ch 12)</td><td class="mono">Q = ω₀/2α</td><td>about how many cycles it rings</td></tr>
          <tr><td>frequency view</td><td class="mono">Q = ω₀/bandwidth</td><td>how sharp the peak is</td></tr>
          <tr><td>energy view</td><td class="mono">Q = stored / lost per radian</td><td>how lossy it is</td></tr></tbody></table></div>`,
        `<p class="aside">All three agree for second-order circuits; they differ slightly for higher-order ones.</p>`,
      ]},
      { k: "check", title: "Numbers", b: [
        `<p>Series RLC: L = 10 mH, R = 20 Ω, driven at ω₀ = 10⁵ rad/s by 0.5 V.</p>`,
        { t: "num", q: "Total stored energy?", a: 3.125, tol: 0.01, unit: "µJ", why: "½ × 0.01 × (0.025)² = 3.125 µJ." },
        { t: "num", q: "Average power burned in R?", a: 6.25, tol: 0.01, unit: "mW", why: "V_i²/2R = 0.25/40 = 6.25 mW." },
        { t: "num", q: "Energy lost per radian, and Q = stored ÷ that?", a: 50, hint: "Lost per radian = 6.25 mW / 10⁵ rad/s = 62.5 nJ.", why: "3.125 µJ / 62.5 nJ = 50 = ω₀L/R." },
      ]},
      { k: "say", title: "Say it back", b: [
        { t: "say", q: "At resonance, what is the source actually doing, if the energy just moves between L and C?", model: "The source only supplies the energy the resistor burns each cycle. At resonance the inductor and capacitor trade their stored energy back and forth with nothing needed from outside, so the total stays constant. The source sees just R, in phase, with no reactive power." },
      ]},
    ],
  };

  /* =============== PART 7 =============== */
  const p7 = {
    id: "p7", title: "Peaky means ringy", mins: 15,
    blurb: "Read the step response from the frequency response, and back.",
    takeaway: "Q links both views: a tall, narrow frequency-response peak (high Q) means the circuit rings for about Q cycles when kicked; no peak (low Q) means the transient dies fast. ω_d, ω₀ and the peak frequency nearly coincide for high Q.",
    steps: [
      { k: "play", title: "Both views at once", b: [
        (host, id) => {
          const wrap = el(`<div class="two"></div>`), a = el(`<div class="fig"></div>`), b = el(`<div class="fig"></div>`), ro = el(`<div></div>`);
          const L = 10e-3, C = 10e-9, w0 = 1e5;
          let R = 40;
          function draw() {
            const H = (w) => 1 / Math.hypot(1 - w * w * L * C, w * R * C), sim = simSer(R, L, C, () => 0, 1, 2e-3, 2400);
            a.innerHTML = bmag({ w: 300, h: 220, x: [4, 6], y: [-2, 2], yl: "|V_c/V_i|", series: [{ f: H, cls: "s1" }], label: "Frequency response, capacitor output" });
            b.innerHTML = plot({ w: 300, h: 220, x: [0, 2], y: [-1.05, 1.05], xt: [0, 1, 2], yt: [-1, 0, 1], xl: "t (ms)", yl: "v_C (V)", series: [{ pts: sim.filter((p, k) => k % 2 === 0).map(([t, v]) => [t * 1e3, v]), cls: "s1" }], label: "Zero-input response from 1 V on the capacitor" });
            ro.innerHTML = readout([["Q = (1/R)√(L/C)", fmt(1000 / R)], ["peak |V_c/V_i|", fmt(Math.max(...[0.9, 0.95, 0.98, 0.99, 0.995, 1, 1.005].map((k) => H(k * w0))))]]);
          }
          wrap.append(a, b);
          host.append(wrap, slider({ id: id + "-r", label: "R", min: 20, max: 2000, log: true, value: R, show: (x) => fmt(x, 3) + " Ω" }, (x) => { R = x; draw(); }).el, ro);
          draw();
        },
        `<p class="aside">Series RLC, L = 10 mH, C = 10 nF (ω₀ = 10⁵ rad/s, period ≈ 63 µs). Left: frequency response. Right: start with 1 V on C and no input. Count the cycles of ringing and compare with Q.</p>`,
      ]},
      { k: "check", title: "Read one from the other", b: [
        { t: "mcq", q: "A filter's frequency response has a peak 30 times higher than its asymptotes' crossing. Kick it with a short pulse. It will…", opts: [["ring at about ω₀ for roughly 30 cycles", true, "Q ≈ 30 from the peak height, and Q is also roughly the number of cycles of ringing."], ["settle smoothly with no overshoot", false, "That's low Q (< ½)."], ["ring forever", false, "Only if there's no loss at all."]] },
        { t: "mcq", q: "A circuit's step response settles almost immediately with a tiny overshoot. Its frequency response…", opts: [["has little or no peak (low Q)", true, "Fast decay = big α compared with ω₀ = low Q = broad, flat-topped response."], ["has a very sharp peak", false, "Sharp peaks ring for a long time."], ["is a notch", false, "That depends on where the output is, not on the damping."]] },
      ]},
      { k: "learn", title: "Three nearby frequencies", b: [
        `<ul><li><b>ω₀ = 1/√(LC)</b>: undamped resonance; where L and C cancel.</li><li><b>ω<sub>d</sub> = √(ω₀² − α²)</b>: what the circuit rings at when kicked.</li><li><b>peak frequency</b> of a given output (for v<sub>C</sub> it's a bit below ω₀).</li></ul>`,
        `<p>For high Q they're all within a fraction of a percent, and the peak height is very nearly Q × input. For low Q, keep them apart.</p>`,
      ]},
      { k: "say", title: "Say it back", b: [
        { t: "say", q: "Why does a sharply peaked frequency response go with long ringing?", model: "Both come from small damping relative to ω₀, which is high Q. Little energy is lost per cycle, so after a kick the oscillation lasts many cycles; and a steady drive at ω₀ can build up a large response, while frequencies a little off resonance can't, which makes the peak narrow." },
      ]},
    ],
  };

  window.CHAPTER = {
    id: "ch14", eyebrow: "Chapter 14", title: "Sinusoidal Steady State: Resonance",
    intro: `<p>Seven parts. Chapter 12's ringing circuits, now seen from the frequency side. You'll sketch resonance curves from a few constraints, meet bandwidth and Q, build four different filters from one series RLC, and see why a capacitor can hold Q times the source voltage.</p><p class="aside">Uses Chapter 13's impedances and log plots. Arrow keys ← → move between steps. Need a refresher? <a href="13-sinusoidal-steady-state.html">Chapter 13</a>.</p>`,
    after: `<p>Open the Chapter 14 PDF and go to the <b>exercises and problems</b> at the end. For each circuit, write the denominator as s² + 2αs + ω₀², then name ω₀, α and Q before you draw anything.</p><p>Stuck? Tell Claude which problem and what you've tried. You'll get a guiding question, not the answer.</p>`,
    parts: [p1, p2, p3, p4, p5, p6, p7],
    summary: `
      <h3>Resonant systems</h3>
      <p>System function with s² + 2αs + ω₀² in the denominator and complex roots (α < ω₀, Q > ½). Total response to a switched-on sine = decaying natural part at ω<sub>d</sub> + forced part at ω₁ (beats when close).</p>
      <h3>Parallel RLC (output v, input i)</h3>
      <div class="eq">H = 1/(G + j(ωC − 1/ωL)) · ω₀ = 1/√(LC) · α = 1/2RC</div>
      <p>Low ω: jωL (+90°). High ω: 1/jωC (−90°). At ω₀: R (0°), LC pair = open. Bandwidth 1/RC = 2α. Q = ω₀RC = R/ω₀L.</p>
      <h3>Series RLC (output i, input v)</h3>
      <div class="eq">H = (s/L)/(s² + (R/L)s + 1/LC) · α = R/2L · bandwidth R/L · Q = ω₀L/R</div>
      <p>At ω₀: LC pair = short, I = V<sub>i</sub>/R. High Q: small series R, large parallel R.</p>
      <h3>Sketching</h3>
      <p>Low-ω asymptote, high-ω asymptote, value at ω₀; plus 0.707 points ≈ ω₀ ± α (Q > 5) with phase ±45°. Q = peak ÷ asymptote crossing.</p>
      <h3>Four filters (series RLC)</h3>
      <p>Across R: band-pass 2αs/D. Across C: low-pass ω₀²/D. Across L: high-pass s²/D. Across L+C: notch (s² + ω₀²)/D. At ω₀, |V<sub>c</sub>| = |V<sub>l</sub>| = Q|V<sub>i</sub>|.</p>
      <h3>Energy and Q</h3>
      <p>At ω₀: w<sub>total</sub> = ½L(V<sub>i</sub>/R)², constant; energy swaps L ↔ C at 2ω₀.</p>
      <div class="eq">Q = ω₀/2α = ω₀/bandwidth = stored / (lost per radian)</div>
      <p>Peaky response ⇔ long ringing (~Q cycles). For high Q, ω₀ ≈ ω<sub>d</sub> ≈ peak frequency.</p>`,
  };
  Course.start(window.CHAPTER);
})();
</script>
