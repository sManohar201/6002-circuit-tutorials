<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CMOS VLSI Tutorials</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: a chapter map (hub) that opens one part at a time; each part is a rail of single-card steps on graph paper. */
:root {
  --paper: #eaf0f4;
  --grid: rgba(40, 90, 140, 0.08);
  --card: #ffffff;
  --ink: #142238;
  --muted: #56677d;
  --line: #d2dce6;
  --accent: #e39a0b;
  --accent-soft: #fdf1d8;
  --accent-ink: #7a4d00;
  --cool: #2b67a3;
  --cool-soft: #e1ecf7;
  --good: #1d8656;
  --good-soft: #def4e9;
  --bad: #c2412a;
  --bad-soft: #fbe5e0;
  --on-accent: #1b1300;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1520; --grid: rgba(120, 170, 220, 0.07); --card: #16212f; --ink: #e5edf6; --muted: #98a8bc;
    --line: #2a3a4e; --accent: #f3b53c; --accent-soft: #3a2d10; --accent-ink: #f8d68f; --cool: #7db3ea;
    --cool-soft: #15283d; --good: #43c88d; --good-soft: #123426; --bad: #f2735a; --bad-soft: #3d1c16;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1520; --grid: rgba(120, 170, 220, 0.07); --card: #16212f; --ink: #e5edf6; --muted: #98a8bc;
  --line: #2a3a4e; --accent: #f3b53c; --accent-soft: #3a2d10; --accent-ink: #f8d68f; --cool: #7db3ea;
  --cool-soft: #15283d; --good: #43c88d; --good-soft: #123426; --bad: #f2735a; --bad-soft: #3d1c16;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.55;
}
.wrap {
  max-width: 700px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
  display: grid; gap: 16px;
}
header.top { display: grid; gap: 10px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.eyebrow button { font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--cool); background: none; border: 0; padding: 0; cursor: pointer; }
.eyebrow a.book-link { color: var(--cool); text-decoration: none; }
.eyebrow a.book-link:hover, .eyebrow a.book-link:focus-visible { text-decoration: underline; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 6.5vw, 40px); line-height: 1.05; margin: 0; text-wrap: balance; }
.rail { display: flex; gap: 5px; align-items: center; }
.rail button { flex: 1; height: 8px; border-radius: 4px; border: 0; padding: 0; cursor: pointer; background: var(--line); }
.rail button.done { background: var(--accent); opacity: 0.5; }
.rail button.now { background: var(--accent); }
.rail button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.where { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.where b { color: var(--ink); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 20px; display: grid; gap: 16px; min-width: 0; }
.card > * { min-width: 0; }
.card h2 { font-family: var(--display); font-weight: 600; font-size: 24px; line-height: 1.18; margin: 0; text-wrap: balance; }
.card h3 { font-family: var(--display); font-weight: 600; font-size: 19px; margin: 0; }
.card p { margin: 0; max-width: 62ch; }
.card ul, .card ol { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.tag { justify-self: start; font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--line); color: var(--ink); }
.k-predict, .k-play { background: var(--accent-soft); color: var(--accent-ink); }
.k-why, .k-math { background: var(--cool-soft); color: var(--cool); }
.k-bug { background: var(--bad-soft); color: var(--bad); }
.k-whatif, .k-check { background: var(--good-soft); color: var(--good); }
.k-say { background: transparent; color: var(--ink); border: 1px solid var(--ink); }

.mono, code { font-family: var(--mono); font-weight: 700; font-size: 0.92em; }
.eq { font-family: var(--mono); font-weight: 700; font-size: clamp(20px, 5.4vw, 28px); text-align: center; padding: 8px 0; overflow-x: auto; }
.eq .a { color: var(--accent); }
.key { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 10px 10px 0; }
.key b { color: var(--accent-ink); }
.aside { font-size: 15px; color: var(--muted); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.two > * { min-width: 0; }
.tile { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; }
.tile h3 { font-size: 17px; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 16px; }
.tbl th, .tbl td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
.tbl th { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* controls */
.btn { font: inherit; font-size: 16px; padding: 10px 16px; border-radius: 10px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn.ghost { background: transparent; }
.btn.small { font-size: 14px; padding: 6px 12px; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); font-weight: 700; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn:focus-visible, input:focus-visible, textarea:focus-visible, .hit:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.choices { display: grid; gap: 8px; }
.choice { text-align: left; width: 100%; }
.choice.right { border-color: var(--good); background: var(--good-soft); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.q { display: grid; gap: 10px; }
.qq { font-weight: 700; }
.feedback { border-radius: 10px; padding: 12px 14px; font-size: 16px; background: var(--paper); border: 1px solid var(--line); }
.feedback.ok { background: var(--good-soft); border-color: var(--good); }
.feedback.no { background: var(--bad-soft); border-color: var(--bad); }
.num { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.num input { font: inherit; font-family: var(--mono); font-size: 19px; width: 8em; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
textarea { font: inherit; font-size: 17px; width: 100%; min-height: 96px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); resize: vertical; }
select { font: inherit; font-family: var(--mono); font-size: 15px; max-width: 100%; padding: 8px 10px; margin: 4px 0 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.model { border: 2px dashed var(--good); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.model .lbl { font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--good); }
.sort { display: grid; gap: 8px; }
.sort-item { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.sort-item > span { min-width: 0; }
.sort-item.right { border-color: var(--good); background: var(--good-soft); }
.sort-item.wrong { border-color: var(--bad); background: var(--bad-soft); }
.sort-item .why { grid-column: 1 / -1; font-size: 15px; }
@media (max-width: 480px) { .sort-item { grid-template-columns: 1fr; } }

/* sliders + readouts */
.sliders { display: grid; gap: 10px; }
.sl { display: grid; gap: 2px; }
.sl label { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; color: var(--muted); }
.sl output { font-family: var(--mono); font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.sl input[type="range"] { width: 100%; accent-color: var(--accent); }
.readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.readout > div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--paper); min-width: 0; }
.readout span { display: block; font-size: 13px; color: var(--muted); }
.readout b { font-family: var(--mono); font-size: 19px; font-variant-numeric: tabular-nums; }
.verdict { justify-self: start; font-weight: 700; font-size: 15px; padding: 4px 14px; border-radius: 999px; }
.verdict.ok { background: var(--good-soft); color: var(--good); }
.verdict.mid { background: var(--accent-soft); color: var(--accent-ink); }
.verdict.no { background: var(--bad-soft); color: var(--bad); }

/* schematics + plots */
.fig { overflow-x: auto; }
.sch, .plot { width: 100%; height: auto; display: block; margin: 0 auto; }
.sch .w { stroke: var(--ink); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.sch .w.hl { stroke: var(--accent); stroke-width: 3.5; }
.sch .w.dim { stroke: var(--line); }
.sch .el { fill: var(--card); stroke: var(--ink); stroke-width: 2.5; }
.sch .el.hl { stroke: var(--accent); stroke-width: 3.5; }
.sch .nd { fill: var(--ink); }
.sch text { fill: var(--ink); font-family: var(--mono); font-size: 14px; }
.sch text.s { font-size: 12px; }
.sch text.big { font-size: 18px; font-weight: 700; }
.sch .m { fill: var(--muted); }
.sch .a { fill: var(--accent-ink); }
.sch .c { fill: var(--cool); }
.sch .g { fill: var(--good); }
.sch .b { fill: var(--bad); }
.sch .cur { stroke: var(--cool); stroke-width: 2.2; fill: none; }
.sch .curh { fill: var(--cool); }
.sch .flow { stroke: var(--accent); stroke-width: 4; fill: none; stroke-dasharray: 3 13; stroke-linecap: round; animation: flow var(--dur, 1s) linear infinite; }
.sch .zone { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 4; }
.sch .box { fill: var(--paper); stroke: var(--ink); stroke-width: 2.5; }
.sch .hit { cursor: pointer; fill: transparent; stroke: transparent; stroke-width: 18; }
@keyframes flow { to { stroke-dashoffset: -16; } }
.plot .grid { stroke: var(--line); stroke-width: 1; }
.plot .axis { stroke: var(--muted); stroke-width: 1.5; }
.plot text { fill: var(--muted); font-family: var(--mono); font-size: 12px; }
.plot text.lab { fill: var(--ink); font-size: 13px; font-weight: 700; }
.plot .s1 { stroke: var(--accent); stroke-width: 3; fill: none; }
.plot .s2 { stroke: var(--cool); stroke-width: 3; fill: none; }
.plot .s3 { stroke: var(--good); stroke-width: 3; fill: none; }
.plot .s4 { stroke: var(--bad); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.plot .s5 { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 4 4; }
.plot .ar1 { fill: var(--accent); opacity: 0.22; }
.plot .ar2 { fill: var(--cool); opacity: 0.18; }
.plot .ar3 { fill: var(--good); opacity: 0.16; }
.plot .mk { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
.plot .mk2 { fill: var(--cool); stroke: var(--card); stroke-width: 2; }
.plot .mkb { fill: var(--bad); stroke: var(--card); stroke-width: 2; }

/* hub */
.parts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.part-btn { width: 100%; text-align: left; display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.part-btn:hover { border-color: var(--ink); }
.part-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.part-btn > span { min-width: 0; }
.part-n { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-weight: 700; border: 2px solid var(--line); }
.part-btn.done .part-n { background: var(--good); border-color: var(--good); color: var(--card); }
.part-btn.next .part-n { border-color: var(--accent); color: var(--accent-ink); }
.part-t { font-weight: 700; display: block; }
.part-d { font-size: 15px; color: var(--muted); display: block; }
.part-m { font-family: var(--mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
.after { border: 2px solid var(--ink); border-radius: 14px; padding: 16px 18px; display: grid; gap: 8px; background: var(--card); }

nav.bottom { display: flex; justify-content: space-between; gap: 8px; }
nav.bottom .btn { min-width: 120px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
.ov { text-decoration: overline; }
.bits { display: flex; flex-wrap: wrap; gap: 6px; }
.bits .btn { min-width: 44px; font-family: var(--mono); font-weight: 700; }

/* code (HDL and assembly listings) */
pre.code { font-family: var(--mono); font-size: 14px; line-height: 1.5; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 0; overflow-x: auto; white-space: pre; color: var(--ink); }
pre.code .kw { color: var(--accent-ink); font-weight: 700; }
pre.code .cm { color: var(--muted); font-style: italic; }
pre.code .nm { color: var(--cool); }
pre.code .hl { background: var(--accent-soft); border-radius: 4px; }
code { font-family: var(--mono); font-size: .92em; background: var(--paper); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
/* Contents page. Reuses engine.css tokens; the chapter list is drawn as a circuit trace with a node dot per chapter. */
.cover { max-width: 760px; }
.cover header.top p.sub { margin: 0; color: var(--muted); max-width: 58ch; }

/* Up next */
.next-card { background: var(--card); border: 2px solid var(--ink); border-radius: 14px; padding: 18px 20px; display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: center; }
.next-card .big { grid-row: span 3; font-family: var(--mono); font-weight: 700; font-size: 56px; line-height: 1; color: var(--accent); min-width: 1.4em; text-align: center; }
.next-card .lbl { font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.next-card h2 { font-family: var(--display); font-weight: 800; font-size: clamp(22px, 4.5vw, 28px); line-height: 1.1; margin: 0; text-wrap: balance; }
.next-card .row { grid-column: 2; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.meter { width: 160px; max-width: 100%; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--good); }
a.btn { text-decoration: none; display: inline-flex; align-items: center; }

/* How a chapter works: three stages in a row */
.flow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; list-style: none; margin: 0; padding: 0; counter-reset: st; }
.flow li { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; position: relative; min-width: 0; }
.flow li::before { counter-increment: st; content: counter(st); font-family: var(--mono); font-weight: 700; font-size: 13px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-ink); }
.flow b { font-family: var(--display); font-size: 17px; }
.flow span { font-size: 15px; color: var(--muted); line-height: 1.4; }
@media (max-width: 560px) { .flow { grid-template-columns: 1fr; } }

/* Contents */
.group { display: grid; gap: 6px; }
.group h2 { font-family: var(--display); font-weight: 800; font-size: 22px; margin: 8px 0 0; }
.group > p { margin: 0 0 4px; color: var(--muted); font-size: 16px; }
.toc { list-style: none; margin: 0; padding: 0 0 0 28px; position: relative; display: grid; gap: 8px; }
.toc::before { content: ""; position: absolute; left: 9px; top: 18px; bottom: 18px; width: 2px; background: var(--ink); opacity: 0.5; }
.toc li { position: relative; }
.toc li::before { content: ""; position: absolute; left: -24px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; box-sizing: border-box; border: 2px solid var(--ink); background: var(--paper); }
.toc li.ready::before { background: var(--accent); border-color: var(--accent); }
.toc li.done::before { background: var(--good); border-color: var(--good); }
.toc li.later::before { border-style: dashed; border-color: var(--muted); }
.ch { display: grid; grid-template-columns: 3.2em 1fr auto; gap: 2px 12px; align-items: center; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: inherit; text-decoration: none; }
a.ch:hover { border-color: var(--accent); }
a.ch:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.later .ch { background: transparent; border-style: dashed; }
.ch .n { grid-row: span 2; font-family: var(--mono); font-weight: 700; font-size: 20px; color: var(--accent-ink); }
.later .ch .n { color: var(--muted); }
.ch .t { font-weight: 700; line-height: 1.25; min-width: 0; }
.ch .d { grid-column: 2; font-size: 15px; color: var(--muted); line-height: 1.35; min-width: 0; }
.ch .s { grid-row: span 2; grid-column: 3; display: grid; gap: 4px; justify-items: end; text-align: right; }
.chip { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; white-space: nowrap; background: var(--line); color: var(--muted); }
.chip.ready { background: var(--accent-soft); color: var(--accent-ink); }
.chip.going { background: var(--cool-soft); color: var(--cool); }
.chip.done { background: var(--good-soft); color: var(--good); }
.pp { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 520px) {
  .ch { grid-template-columns: 2.4em 1fr; }
  .ch .s { grid-row: auto; grid-column: 2; justify-items: start; text-align: left; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .next-card { grid-template-columns: 1fr; }
  .next-card .big { grid-row: auto; text-align: left; font-size: 44px; }
  .next-card .row { grid-column: 1; }
}
.foot { color: var(--muted); font-size: 15px; display: grid; gap: 6px; }
.foot p { margin: 0; }

/* Library page */
.book-card { background: var(--card); border: 2px solid var(--ink); border-radius: 14px; padding: 18px 20px; display: grid; gap: 8px; }
.book-card .lbl { font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
.book-card h2 { font-family: var(--display); font-weight: 800; font-size: clamp(22px, 4.5vw, 28px); line-height: 1.1; margin: 0; }
.book-card h2 a { color: inherit; text-decoration: none; }
.book-card .src { margin: 0; color: var(--muted); font-size: 15px; }
.book-card .row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.path { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: pth; }
.path li { display: grid; grid-template-columns: 1fr auto 1fr; gap: 2px 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.path .a, .path .b { font-weight: 700; }
.path .arr { color: var(--accent); font-family: var(--mono); font-weight: 700; }
.path .why { grid-column: 1 / -1; color: var(--muted); font-size: 15px; }
@media (max-width: 480px) { .path li { grid-template-columns: 1fr; } .path .arr { display: none; } }

/* Library: overall progress, Resume card, book tiles, where you are in each order */
.overall { display: grid; grid-template-columns: auto 1fr; gap: 4px 18px; align-items: center; }
.overall .big { grid-row: span 2; font-family: var(--mono); font-weight: 700; font-size: 52px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }

.overall .aside { margin: 0; }
.resume { background: var(--card); border: 2px solid var(--ink); border-radius: 14px; padding: 16px 20px 18px; display: grid; gap: 8px; }
.resume .lbl { margin: 0; font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }

.resume .aside { margin: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { font: inherit; font-size: 14px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.tab span { font-family: var(--mono); font-size: 12px; margin-left: 4px; }
.tab[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.tab:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.tile { display: grid; gap: 6px; align-content: start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: inherit; text-decoration: none; min-width: 0; }
.tile:hover { border-color: var(--accent); }
.tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tile .lbl { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
.tile b { font-family: var(--display); font-size: 17px; line-height: 1.2; }
.tile .meter { width: 100%; }
.tile .aside { font-size: 13px; margin: 0; }
.path li.done { opacity: 0.6; }
.path li.done .a::before { content: "✓ "; color: var(--good); }
.path li.now { border: 2px solid var(--accent); }
@media (max-width: 420px) { .overall .big { font-size: 40px; } .tiles { grid-template-columns: 1fr 1fr; } .tile b { font-size: 15px; } }

/* Library registry. Each book manifest adds itself to window.BOOKS; this file (loaded after them)
   adds the shared helpers and sets window.BOOK to the book this page belongs to (window.BOOK_KEY). */
(function () {
  const all = window.BOOKS || {};
  Object.values(all).forEach((B) => {
    B.all = () => B.groups.flatMap((g) => g.items);
    B.chapters = () => B.all().filter((c) => typeof c.n === "number");
    B.find = (id) => B.all().find((c) => c.id === id);
    B.pdfName = (c) => B.pdfFile || B.pdfPrefix + c.pdf + ".pdf"; /* one-file books name the whole PDF */
    /* "pp. 26–75" for books whose file names are PDF pages, "pp. 1–54" (printed pages) when a chapter lists `pages`. */
    B.pagesLabel = (c) => (c.pages ? "book pp. " + c.pages : "pp. " + c.pdf).replace("-", "–") + (B.pdfFile && c.pages ? ", PDF pp. " + c.pdf.replace("-", "–") : "");
    B.probsLabel = (c) => (c.probs ? `page ${c.probs} of that PDF${c.probsBook && c.probsBook !== c.probs ? ` (book page ${c.probsBook})` : ""}` : "");
  });
  window.BOOK = all[window.BOOK_KEY] || null;
})();

<script>
/* Progress store shared by the contents page and every chapter page.
   Each chapter's state is { done: {p1: true}, last: {part, step} | null, say: {key: text}, t: ms }.
   It lives in two places:
     - localStorage "course-<id>": instant first paint, and the fallback when nothing else works.
     - the artifact's db, at data/users/<viewer id>/<chapter id>: private to the viewer, follows them
       across browsers and sessions. Only available when the page runs inside the claude.ai viewer. */
window.Progress = (function () {
  const LKEY = (id) => "course-" + id;
  const local = {
    get(id) { try { const v = localStorage.getItem(LKEY(id)); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
    set(id, v) { try { localStorage.setItem(LKEY(id), JSON.stringify(v)); } catch (e) {} },
  };
  const blank = () => ({ done: {}, last: null, say: {}, t: 0 });
  const norm = (s) => Object.assign(blank(), s || {}, { done: Object.assign({}, s && s.done), say: Object.assign({}, s && s.say) });

  /* Combine two copies: parts finished anywhere stay finished; the newer copy wins for position and text. */
  function merge(a, b) {
    a = norm(a); b = norm(b);
    const [old, neu] = a.t >= b.t ? [b, a] : [a, b];
    return { done: Object.assign({}, old.done, neu.done), last: neu.last, say: Object.assign({}, old.say, neu.say), t: neu.t };
  }
  const same = (a, b) => JSON.stringify(norm(a)) === JSON.stringify(norm(b));

  /* ---------- cloud ---------- */
  let status = "local"; // "local" | "cloud"
  const statusFns = [];
  const setStatus = (s) => { status = s; statusFns.forEach((f) => f(s)); };
  const cloud = (async () => {
    try {
      if (!window.claude || !window.claude.use) return null;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return null;
      const uid = await user.id();
      if (!uid) return null;
      const col = db.collection("data/users/" + uid);
      await col.limit(1).get(); // proves the store answers before we claim "saved to your account"
      setStatus("cloud");
      return col;
    } catch (e) { return null; }
  })();

  /* One write in flight per chapter; bursts collapse into the latest state. */
  const pending = {}, busy = {};
  async function flush(id) {
    const col = await cloud;
    if (!col || busy[id] || !pending[id]) return;
    busy[id] = true;
    const body = pending[id]; pending[id] = null;
    try { await col.doc(id).set(body); }
    catch (e) {
      if (e && e.code === "unavailable") { pending[id] = pending[id] || body; setTimeout(() => flush(id), 1500 + Math.random() * 1500); }
      else if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) setStatus("local");
    }
    busy[id] = false;
    if (pending[id]) flush(id);
  }
  const timers = {};
  function push(id, state, delay) {
    pending[id] = JSON.parse(JSON.stringify(norm(state)));
    clearTimeout(timers[id]);
    timers[id] = setTimeout(() => flush(id), delay);
  }

  return {
    /* Synchronous best guess from this browser. */
    load(id) { return norm(local.get(id)); },
    /* Save locally now, to the account shortly after. `delay` batches typing. */
    save(id, state, delay = 400) {
      state.t = Date.now();
      local.set(id, state);
      push(id, state, delay);
    },
    /* Once the account copy arrives, merge it into `state` (mutating it) and call onChange if anything moved. */
    async sync(id, state, onChange) {
      const col = await cloud;
      if (!col) return;
      let remote = null;
      try { const snap = await col.doc(id).get(); remote = snap.exists ? snap.data() : null; } catch (e) { return; }
      const m = merge(state, remote);
      const changed = !same(m, state);
      Object.keys(state).forEach((k) => delete state[k]);
      Object.assign(state, m);
      local.set(id, state);
      if (!same(m, remote)) push(id, state, 0); // this browser had something the account didn't
      if (changed && onChange) onChange();
    },
    /* Contents page: every chapter's state, local first, then merged with the account. */
    async all(ids, onReady) {
      const out = {};
      ids.forEach((id) => (out[id] = norm(local.get(id))));
      onReady(out);
      const col = await cloud;
      if (!col) return;
      let snap;
      try { snap = await col.get(); } catch (e) { return; }
      const remote = {};
      snap.docs.forEach((d) => (remote[d.id] = d.data()));
      let changed = false;
      ids.forEach((id) => {
        const m = merge(out[id], remote[id]);
        if (!same(m, out[id])) { changed = true; out[id] = m; local.set(id, m); }
        if (!same(m, remote[id]) && (m.t || Object.keys(m.done).length)) push(id, m, 0);
      });
      if (changed) onReady(out);
    },
    status: () => status,
    onStatus(fn) { statusFns.push(fn); fn(status); },
  };
})();
</script>
<script>
/* Contents page: reads window.BOOK and each chapter's saved progress (window.Progress: this browser, then the account). */
(function () {
  const B = window.BOOK;
  let saved = {};
  const range = (p) => p.replace("-", "–");

  function progress(c) {
    if (!c.file) return { state: "later", done: 0 };
    const s = saved[c.id];
    const done = s && s.done ? Object.values(s.done).filter(Boolean).length : 0;
    const started = done > 0 || !!(s && s.last);
    return { state: done >= c.parts ? "done" : started ? "going" : "ready", done };
  }

  function chip(c, p) {
    if (p.state === "later") return `<span class="chip">${typeof c.n === "number" ? "Not built yet" : "Inside chapters"}</span>`;
    if (p.state === "done") return `<span class="chip done">Done ✓</span>`;
    if (p.state === "going") return `<span class="chip going">${p.done} of ${c.parts} parts</span>`;
    return `<span class="chip ready">${c.parts} parts</span>`;
  }

  function row(c) {
    const p = progress(c);
    const pages = B.noPdf ? (c.ref ? `<span class="pp">a 6.002 appendix</span>` : "") : (c.pdf ? `<span class="pp">${B.pagesLabel(c)}</span>` : `<span class="pp">not in PDFs</span>`) + (c.probs ? `<span class="pp">problems: PDF p. ${c.probs}</span>` : "");
    const inner = `<span class="n">${c.n}</span><span class="t">${c.title}</span><span class="d">${c.blurb}</span><span class="s">${chip(c, p)}${pages}</span>`;
    const cls = p.state === "later" ? "later" : p.state === "done" ? "done" : "ready";
    return c.file
      ? `<li class="${cls}"><a class="ch" href="${B.dir}/${c.file}">${inner}</a></li>`
      : `<li class="${cls}"><div class="ch" aria-disabled="true">${inner}</div></li>`;
  }

  const U = B.unit || "Chapter";
  function upNext() {
    const list = B.chapters();
    const built = list.filter((c) => c.file);
    const open = built.find((c) => progress(c).state !== "done");
    if (open) {
      const p = progress(open);
      const pct = Math.round((100 * p.done) / open.parts);
      const verb = p.state === "going" ? "Continue" : "Start";
      return `<section class="next-card" aria-label="Up next">
        <span class="big">${open.n}</span>
        <span class="lbl">Up next · ${U} ${open.n}</span>
        <h2>${open.title}</h2>
        <div class="row"><a class="btn primary" href="${B.dir}/${open.file}">${verb} ${U} ${open.n} →</a>
          <span class="meter" role="img" aria-label="${p.done} of ${open.parts} parts done"><i style="width:${pct}%"></i></span>
          <span class="aside">${p.done} of ${open.parts} parts</span></div>
      </section>`;
    }
    const nx = list.find((c) => !c.file);
    const none = !built.length;
    return `<section class="next-card" aria-label="Up next">
      <span class="big">${nx ? nx.n : "✓"}</span>
      <span class="lbl">${nx ? "Up next · " + U + " " + nx.n : "Finished"}</span>
      <h2>${nx ? nx.title : "Every " + U.toLowerCase() + " is done"}</h2>
      <div class="row"><span class="aside">${!nx ? "Nice work." : none ? "Its tutorial is being built. Ask Claude for it." : "Every built chapter is done. Ask Claude to build this one when you've finished the last chapter's problems."}</span></div>
    </section>`;
  }

  function render() {
  const builtCount = B.chapters().filter((c) => c.file).length;
  const html = `<div class="wrap cover">
    <header class="top">
      <div class="eyebrow"><a class="book-link" href="index.html">← Library</a> · ${B.source.replace(", Foundations", " · Foundations")}</div>
      <h1>${B.title}</h1>
      <p class="sub">${B.sub || "One tutorial per chapter, so you don't have to read the chapter. Finish the tutorial, then go straight to the book's problems."}</p>
    </header>
    ${B.intro ? `<section class="card">${B.intro}</section>` : ""}
    ${upNext()}
    <ol class="flow" aria-label="How each ${U.toLowerCase()} works">${B.flow ? B.flow.map(([b, t]) => `<li><b>${b}</b><span>${t}</span></li>`).join("") : `
      <li><b>Tutorial</b><span>Do the parts in order. About 20 minutes each, with a break after every part.</span></li>
      <li><b>Book problems</b><span>Open that chapter's PDF and do the exercises and problems at the end. They're the real test.</span></li>
      <li><b>Check</b><span>Commit to your answer first. Then check it against the book's answers to selected problems (the PDF file ending “-${B.answers.pdf}.pdf”).</span></li>`}
    </ol>
    ${B.groups.map((g) => `<section class="group" aria-label="${g.name}">
      <h2>${g.name}</h2><p>${g.note}</p>
      <ol class="toc">${g.items.map(row).join("")}</ol>
    </section>`).join("")}
    <footer class="foot">
      <p>${builtCount} of ${B.chapters().length} ${U.toLowerCase()} tutorials built.${builtCount < B.chapters().length ? " New ones get added here as you go." : ""}</p>
      ${B.pdfFolder ? `<p>${B.pdfFile ? `PDF: “${B.pdfFile}” in your “${B.pdfFolder}” folder. Page numbers here are PDF pages.` : `PDFs: the files in your “${B.pdfFolder}” folder, named “…-&lt;pages&gt;.pdf”.`}</p>` : ""}
      <p><span class="save-note"></span> Stuck on a problem? Ask Claude. You'll get a guiding question first, not the answer.</p>
    </footer>
  </div>`;
  document.getElementById("app").innerHTML = html;
  Progress.onStatus((st) => { const n = document.querySelector(".save-note"); if (n) n.textContent = st === "cloud" ? "Progress saves to your Claude account, so it follows you to any browser." : "Progress saves in this browser only."; });
  }

  Progress.all(B.all().filter((c) => c.file).map((c) => c.id), (s) => { saved = s; render(); });
})();
</script>
